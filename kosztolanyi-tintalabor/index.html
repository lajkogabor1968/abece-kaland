:root{--bg:#11141c;--panel:#1b202c;--ink:#f3f2ee;--muted:#b9bfcd;--line:#3c4558;--accent:#e4bafa;--mint:#9ee4cd;--gold:#f8d879}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#282f40;color:var(--ink);padding:12px 17px;min-height:48px}button:hover{border-color:var(--accent);background:#35364c}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--accent);color:#20142b;font-weight:750;border:0}.primary:hover{background:#efd6ff}.quiet{background:transparent}a{color:var(--mint)}header{max-width:1240px;margin:auto;padding:22px 26px;display:flex;gap:15px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.16em;font-size:15px}.tag,.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.wrap{max-width:1200px;margin:auto;padding:30px 26px 60px}.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;padding:35px 0}.intro h1{font-size:clamp(42px,6vw,76px);line-height:1.06;letter-spacing:-.055em;margin:18px 0 24px}.intro h1 em{font-style:normal;color:var(--accent)}.lead{font-size:20px;color:#d1d3db;max-width:650px}.cover{background:radial-gradient(ellipse at 30% 30%,#9974b740,transparent 60%),#1b202c;border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;min-height:380px}.swatches{display:flex;gap:12px;height:160px;align-items:end}.swatch{flex:1;border-radius:30px 30px 8px 8px;background:var(--c);height:var(--h);box-shadow:0 0 30px color-mix(in srgb,var(--c) 18%,transparent)}blockquote{font-family:Georgia,serif;font-size:25px;margin:25px 0 10px}.panel{background:var(--panel);padding:26px;border:1px solid var(--line);border-radius:16px;margin-bottom:22px}h2{font-size:clamp(26px,4vw,38px);line-height:1.2;letter-spacing:-.035em;margin:10px 0 16px}h3{font-size:21px;margin:20px 0 10px}.muted{color:var(--muted)}.setup{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}label{display:block;color:#d3d8e3}select,input,textarea{width:100%;padding:12px;background:#111722;border:1px solid #5c6579;color:var(--ink);border-radius:8px;margin-top:7px}textarea{resize:vertical;min-height:110px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}.sticky{position:sticky;top:15px;align-self:start}.poem{font-family:Georgia,serif;font-size:17px;line-height:1.9;white-space:pre-wrap}.poem p{margin:0 0 22px}.poem .ln{color:#909bb0;font:11px system-ui;display:inline-block;width:22px;user-select:none}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.step{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}.step.active{color:var(--accent);border-color:var(--accent)}.step.done{color:var(--mint);border-color:#548c7c}.bar{height:5px;background:#353b49;border-radius:5px;margin:15px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a5a4ed,#9ee4cd);transition:width .3s}.options{display:grid;gap:11px;margin:18px 0}.opt{text-align:left;background:#222938;border:1px solid #566078}.opt.selected{outline:2px solid var(--accent);background:#343044}.opt.correct{border-color:var(--mint);background:#203d36}.feedback{border-left:3px solid var(--gold);padding:12px 16px;background:#252835;margin-top:20px}.feedback.good{border-color:var(--mint);background:#1e3732}.feedback.bad{border-color:#ef9caa}.quote{border-left:2px solid var(--accent);padding:12px 20px;background:#151b27;white-space:pre-line;font-family:Georgia,serif;font-size:21px}.help{font-size:15px;background:#302c3f;padding:15px;border-radius:8px;margin-top:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}.orderlist{list-style:none;padding:0;display:grid;gap:10px}.orderlist li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#252c3a;padding:12px 15px;border-radius:9px}.arrows{display:flex;gap:7px}.arrows button{padding:7px 12px}.cloze{font-family:Georgia,serif;font-size:19px;line-height:2.1}.cloze label{font:inherit;display:block;margin-bottom:8px;color:var(--ink)}.cloze input,.cloze select{font:16px system-ui;display:inline-block;width:190px;margin:0 6px;padding:8px}.cloze .correct{border-color:var(--mint)}.cloze .wrong{border-color:#f098a9}.token{display:inline-block;width:30px;height:8px;border-radius:4px;background:var(--c);margin-right:7px}.stat{font-size:14px;color:var(--muted)}details summary{cursor:pointer;min-height:42px}.roles{background:#232d3a;border:1px solid #4b6277;border-radius:9px;padding:13px 16px;margin-bottom:20px}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.resultgrid div{padding:20px;background:#222b38;border-radius:12px}.resultgrid strong{display:block;color:var(--mint);font-size:30px}.postcard{border:1px solid #7a688d;padding:25px;border-radius:10px;white-space:pre-wrap;background:#241d31}.small{font-size:14px}footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:20px;margin-top:30px}.bigtext{font-size:20px}.bigtext .poem{font-size:20px}@media(max-width:900px){.intro{grid-template-columns:1fr;gap:20px}.cover{min-height:260px}.swatches{height:110px}.layout{grid-template-columns:1fr}.sticky{position:static}.setup{grid-template-columns:1fr}.resultgrid{grid-template-columns:1fr}.wrap{padding:18px 15px 45px}header{padding:17px 15px}.panel{padding:20px}.pair{grid-template-columns:1fr}.cloze input,.cloze select{width:155px}.tag{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{body{background:white;color:black}header,.actions,.steps,button,.bar{display:none!important}.layout,.intro{display:block}.panel{border:1px solid #aaa;background:white;color:black}.hidden{display:none!important}.muted,footer,label{color:#333}.postcard{background:white;color:black}.wrap{padding:0}.sticky{position:static}}
</style></head><body><header><span class="brand">TINTALABOR / 08</span><span class="tag">Kosztolányi Dezső · irodalmi küldetés</span><button id="size" class="quiet" aria-pressed="false">Nagyobb betűk</button></header><main class="wrap" id="main"></main><script>
'use strict';
const POEM=[
'Mostan színes tintákról álmodom.',
'Legszebb a sárga. Sok-sok levelet',
'e tintával írnék egy kisleánynak,',
'egy kisleánynak, akit szeretek.',
'Krikszkrakszokat, japán betűket írnék,',
's egy kacskaringós, kedves madarat.',
'És akarok még sok másszínű tintát,',
'bronzot, ezüstöt, zöldet, aranyat,',
'és kellene még sok száz és ezer,',
'és kellene még aztán millió:',
'tréfás-lila, bor-színű, néma-szürke,',
'szemérmetes, szerelmes, rikitó,',
'és kellene szomorú-viola',
'és téglabarna és kék is, de halvány,',
'akár a színes kapuablak árnya',
'augusztusi délkor a kapualján.',
'És akarok még égő-pirosat,',
'vérszínűt, mint a mérges alkonyat,',
'és akkor írnék, mindig-mindig írnék.',
'Kékkel húgomnak, anyámnak arannyal:',
'arany-imát írnék az én anyámnak,',
'arany-tüzet, arany-szót, mint a hajnal.',
'És el nem unnám, egyre-egyre írnék',
'egy vén toronyba, szünes-szüntelen.',
'Oly boldog lennék, Istenem, de boldog.',
'Kiszínezném vele az életem.'
];
const names=['Belépési nyom','Üzenetarchívum','Érzéklabor','Szétesett kézirat','Emléknyomat','Kijárat'];
const colors=['#f8d879','#92beef','#c6a3df','#e3a3b1','#9ee4cd','#e4bafa'];
const questions=[
{room:0,q:'Melyik állítás állja ki a szöveg próbáját?',opts:['A beszélő megtörtént levélírásról számol be.','A beszélő színes tintákkal való írásról ábrándozik.','A beszélő az írással kapcsolatos emlékeit időrendben rendezi.'],a:1,ev:[0,2,22],why:'Az álmodom és a feltételes módú írnék vágyat, elképzelt lehetőséget jelez. Nem egy már megtörtént levélírás történetét olvassuk.',hint:'Nézd meg a kezdősor igéjét és az írnék alakot.'},
{room:0,q:'Kihez vezet a sárga tinta nyoma?',opts:['Az édesanyához.','A húghoz.','Egy kisleányhoz, akit a beszélő szeret.'],a:2,ev:[1,2,3],why:'Az e tintával az előző sor sárga tintájára utal. A kisleányhoz szóló levelek terve követi.',hint:'Az e tintával visszautalás: keresd az előző sor színét.'},
{room:1,q:'Az üzenet címzettje és tintája közül melyik párosítás pontos?',opts:['Húg: kék; anya: arany.','Húg: arany; anya: kék.','Húg: lila; anya: sárga.'],a:0,ev:[19],why:'A sor két párhuzamos szerkezete: Kékkel húgomnak / anyámnak arannyal. A szó szerinti megfeleltetés biztos szövegadat.',hint:'A -val/-vel rag a tintát, a -nak/-nek rag a címzettet jelöli.'},
{room:1,q:'Melyik állítás ad vissza pontosan egy versbeli tervet?',opts:['A beszélő az anyjának arany-imát írna.','A beszélő a húgának japán levelet küldött.','A beszélő egy új tornyot szeretne építeni.'],a:0,ev:[20,23],why:'Az anya és az arany-ima kapcsolata kimondott szövegadat. A japán betűk nem bizonyítanak japán nyelvű levelet, a torony az írás elképzelt helye.',hint:'Különítsd el azt, amit a vers kimond, attól, amit csak hozzá lehetne képzelni.'},
{room:1,q:'A sárga tinta nyomát már megtaláltátok. Melyik sor bizonyítja közvetlenül az anya és a húg eltérő tintáját?',opts:['bronzot, ezüstöt, zöldet, aranyat,','Kékkel húgomnak, anyámnak arannyal:','egy vén toronyba, szünes-szüntelen.'],a:1,ev:[19],why:'Ez az egy sor együtt nevezi meg a két címzettet és a két tintát. A bizonyító idézetnek közvetlenül kell alátámasztania az állítást.',hint:'Olyan sort keress, amelyben mindkét címzett szerepel.'},
{room:2,q:'A néma-szürke kifejezésben melyik két érzékterület kapcsolódik össze?',opts:['Szaglás és tapintás.','Látás és ízlelés.','Hallás és látás.'],a:2,ev:[10],why:'A néma a hang hiányára, a szürke színre utal. Két érzékterület összekapcsolása: szinesztézia.',hint:'Melyik érzékszervünkkel észleljük a hangot, és melyikkel a színt?'},
{room:2,q:'Mit mutat meg a tréfás-lila és a szomorú-viola egymás mellé állítása?',opts:['A színneveknek a versben nincs érzelmi szerepük.','A színekhez eltérő hangulatok társulnak: játékosság és szomorúság is megjelenik.','Minden lila árnyalat minden helyzetben kizárólag szomorúságot jelent.'],a:1,ev:[10,12],why:'A tréfás és a szomorú jelző eltérő hangulatot kapcsol a színekhez. A tankönyv a tréfás-lilát is a szinesztéziák között említi; az érzékterületek összekapcsolását a néma-szürke példája mutatja a legközvetlenebbül.',hint:'A két jelzőből indulj ki, ne egy általános színszótárból.'},
{room:2,q:'A száz → ezer → millió lépcső mit tesz a verssel?',opts:['Ellenőrizhető leltárt ad a tintákról.','Leállítja a vágyakozást.','Túlzással és fokozással érzékelteti a telhetetlen vágyat.'],a:2,ev:[8,9],why:'A növekvő számok nem pontos készletet jelölnek. A mind több szín utáni vágy lendületét erősítik.',hint:'Valóban megszámolható készletről beszél a költő?'},
{room:2,q:'A vérszínűt, mint a mérges alkonyat részletben melyik eszközt jelzi közvetlenül a mint?',opts:['Hasonlatot.','Szinesztéziát.','Felsorolást.'],a:0,ev:[16,17],why:'A vérszínű tinta és az alkonyat színvilága között hasonlító kapcsolat jön létre. A mérges jelzőben megszemélyesítő hatás is érzékelhető.',hint:'Két dolgot kapcsol össze a mint szó.'},
{room:5,q:'Miért több a zárósor egy tintavásárlási kívánságnál?',opts:['Az írás öröme kizárólag a drága írószerek birtoklásából származna.','Az írással az életét is gazdagabbá, teljesebbé tenné.','Az alkotás csak gyermekkori elfoglaltság, amelyet a felnőtt már elhagy.'],a:1,ev:[18,24,25],why:'A kiszínezés az életre vonatkozik. Az írás és a képzelet életet gazdagító erejéről is olvashatunk benne; ez költői hitvallásként, ars poeticaként értelmezhető.',hint:'A vele mire utalhat? És mit színezne ki a beszélő?'},
{room:5,q:'Melyik bizonyítás támasztja alá legjobban, hogy nem csupa gondtalan vidámság ez a vers?',opts:['Van benne szomorú-viola, és a boldogság vágyként jelenik meg: lennék.','A néma-szürke önmagában bizonyítja, hogy a beszélő senkivel sem beszél.','A torony említése biztosan bizonyítja, hogy a beszélő fogoly.'],a:0,ev:[12,24],why:'Az első megoldás valódi szavakra és igealakra támaszkodik. A másik két következtetéshez a vers nem ad elegendő bizonyítékot.',hint:'Ne általános színjelentést keress, hanem a vers saját szavait.'},
{room:5,q:'Melyik olvasat a legpontosabb?',opts:['A gyermekhangon megszólaló lírai én és a felnőtt alkotó nézőpontja összekapcsolódhat.','A verset biztosan egy kisgyermek írta.','Minden sor egy hiteles gyermekkori esemény jegyzőkönyve.'],a:0,ev:[4,18,25],why:'A játékos rajzolás és a szenvedélyes írásvágy összetartozik. A lírai beszélőt nem azonosítjuk automatikusan a szerző életrajzi személyével.',hint:'Különítsd el a vers beszélőjét attól, aki megírta a művet.'}
];
const blanks=['álmodom','sárga','kisleánynak','szeretek','japán','madarat','másszínű','ezüstöt','ezer','millió','néma-szürke','rikitó','szomorú-viola','halvány','árnya','augusztusi','égő-pirosat','alkonyat','mindig-mindig','húgomnak','arany-imát','arany-szót','egyre-egyre','szünes-szüntelen','boldog','életem'];
const distractors=['emlékezem','kék','húgomnak','ismerek','kínai','levelet','egyforma','pirosat','száz','ezer','vidám-szürke','suttogó','vidám-viola','ragyogó','fénye','novemberi','jéghideget','hajnal','néha-néha','barátomnak','ezüst-imát','arany-hangot','egyszer-egyszer','csendes-csöndesen','szomorú','szobámat'];
const chunks=[[0,6],[6,16],[16,22],[22,26]];
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let S=null,selected=null,locked=false,order=[],hintOpen=false,sessionSave=true;
const KEY='tintalabor-v1';
function recordAnswer(id,ok){S.results=S.results||{};const r=S.results[id]||(S.results[id]={tries:0,points:0});if(r.points)return;r.tries++;if(ok)r.points=r.tries===1?2:1;save()}
function score(){const ids=[...questions.map((q,i)=>'q'+i),'order',...chunks.map((c,i)=>'memory'+i),...Array.from({length:6},(_,i)=>'read'+i)];let legacy=0;const earned=ids.reduce((n,id)=>{if(S.results?.[id])return n+S.results[id].points;if(!id.startsWith('read')){legacy++;return n+1}return n},0);return {earned,max:ids.length*2,legacy}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){sessionSave=false}}
function poemHTML(a=0,b=26){return POEM.slice(a,b).map((s,i)=>`<span class="ln">${a+i+1}</span>${esc(s)}${a+i===0||a+i===24?'\n':''}`).join('\n')}
function home(){let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){};$('main').innerHTML=`<div class="intro"><div><span class="eyebrow">Szövegnyomozás · 35–40 perc · 8. évfolyam</span><h1>A szavaknak<br>is van <em>színük.</em></h1><p class="lead">Egy elszíntelenedett kézirat. Hat lezárt állomás. A tinta akkor tér vissza, ha a szövegben megtalálod a nyomokat.</p><p class="muted">Kosztolányi Dezső<br><em>Mostan színes tintákról álmodom</em></p></div><div class="cover"><span class="eyebrow">01 / Kézirat-helyreállítás</span><div class="swatches" aria-hidden="true">${colors.map((c,i)=>`<i class="swatch" style="--c:${c};--h:${55+i%3*20}%"></i>`).join('')}</div><blockquote>„Kiszínezném vele az életem.”</blockquote><span class="small muted">A kijárat kulcsa a versben van.</span></div></div><section class="panel"><h2>Állítsd össze a küldetést!</h2><div class="setup"><label>Játékmód<select id="mode"><option value="1">Egyedül</option><option value="2">Párban · egy közös eszköz</option><option value="4">Négyfős csapat · egy közös eszköz</option></select></label><label>Útvonal<select id="level"><option value="standard">Nyomozó · önálló keresés</option><option value="support">Iránytű · több kapaszkodó</option><option value="challenge">Műhely · önálló felidézés</option></select></label><label>Csapatnév / álnév<input id="team" maxlength="35" placeholder="Pl. Margó" autocomplete="off"></label></div><p class="small muted">Az Iránytű rövidebb részletekkel és szóválasztással segít. A Műhelyben az emléknyomat hiányzó szavait be kell írni. Minden útvonal ugyanazt a teljes verset dolgozza fel. Nincs idő miatti kiesés.</p><div class="actions"><button class="primary" id="start">Küldetés indítása</button>${old&&old.version===1?'<button id="resume">Korábbi küldetés folytatása</button>':''}<button id="read">Előbb elolvasom a verset</button></div><p class="small muted">A haladás ezen az eszközön, ebben a böngészőben marad. Nincs regisztráció és online eredménygyűjtés. A csapatmód közös eszközön működik.</p></section><details class="panel"><summary>Hogyan dolgozzatok együtt?</summary><p>Négyen: felolvasó, nyomkereső, érvelő, kezelő. Minden állomásnál szerepcsere. Párban: egyikőtök dönt, a másik szövegbizonyítékot keres; feladatonként csere. Egyedül: olvasd fel magadnak a bizonyító sort.</p></details><footer><a href="oravazlat.html" target="_blank" rel="noopener">Órai forgatókönyv és tanári útmutató</a> · A szövegértő nyomozólap a küldetés végén digitálisan kitölthető · A teljes vers szabadon olvasható a játékban.<br>Forrás: OH-MIR08TA, 2023, 23–25. oldal; a tankönyv elérhető másolatával és a Wikiforrás versszövegével egyeztetve. <a href="https://hu.wikisource.org/wiki/Mostan_sz%C3%ADnes_tint%C3%A1kr%C3%B3l_%C3%A1lmodom" target="_blank" rel="noopener">Versszöveg</a></footer>`;
$('start').onclick=()=>{if(old&&!confirm('Új küldetés indul. A korábbi, ezen az eszközön mentett játékot felülírod.'))return;S={version:1,mode:$('mode').value,level:$('level').value,team:$('team').value.trim()||'Tintalabor',room:0,qi:0,chunk:0,done:[],attempts:0,hints:0,first:0,checks:0,memory:[],card:'',started:Date.now()};save();render()};if($('resume'))$('resume').onclick=()=>{S=old;render()};$('read').onclick=()=>{const d=document.createElement('section');d.className='panel';d.innerHTML='<h2>Mostan színes tintákról álmodom</h2><p>Kosztolányi Dezső</p><div class="poem">'+poemHTML()+'</div>';d.id='reading';if(!$('reading')){$('main').append(d);d.scrollIntoView({behavior:'smooth'})}else $('reading').scrollIntoView()}}
function roles(){const n=S.room%4;const roles=['felolvasó','nyomkereső','érvelő','kezelő'];if(S.mode==='4')return `Szerepek ezen az állomáson: ${roles.map((r,i)=>`${(i+n)%4+1}. játékos: ${r}`).join(' · ')}. Mindenki mondjon egy észrevételt a döntés előtt.`;if(S.mode==='2')return 'Páros munka: feladatonként cseréljetek! Egyikőtök döntést javasol, a másik megkeresi a bizonyító részletet.';return 'Egyéni munka: előbb keresd meg a nyomot, utána dönts. A bizonyító sort halkan fel is olvashatod.'}
function shell(body){$('main').innerHTML=`<div class="row" style="justify-content:space-between"><p class="stat">${esc(S.team)} · ${{support:'Iránytű',standard:'Nyomozó',challenge:'Műhely'}[S.level]} · ${S.mode==='1'?'egyéni':S.mode==='2'?'páros':'csapat'} küldetés</p><button id="backhome" class="quiet">Kezdőlap</button></div><div class="steps">${names.map((n,i)=>`<span class="step ${i===S.room?'active':S.done.includes(i)?'done':''}">${S.done.includes(i)?'✓ ':''}${i+1}. ${n}</span>`).join('')}</div><div class="bar"><i style="width:${S.done.length/6*100}%"></i></div><div class="roles">${roles()}</div><div class="layout"><section class="panel" id="work" tabindex="-1">${body}</section><aside class="panel sticky"><details id="poemPanel" ${S.level==='support'?'open':''}><summary>A teljes vers · szövegdosszié</summary><p class="small muted">Az első és az utolsó sor önálló szakasz; a középső rész egy hosszú szakasz. A sorszámok keresési segédletek.</p><div class="poem">${poemHTML()}</div></details><details><summary>Szómagyarázat</summary><p class="small">Krikszkraksz: kusza vonal, firka. Viola: itt ibolyaszín. Szemérmetes: szemérmes, visszahúzódó. Ars poetica: költői hitvallás. Lírai én: a vers beszélője.</p></details><p class="small muted">${S.done.map(i=>`<span class="token" style="--c:${colors[i]}"></span>`).join('')}<br>Visszanyert tinták: ${S.done.length} / 6</p><p class="small muted">${sessionSave?'A haladás automatikusan mentődik.':'A böngésző nem enged menteni. Tartsd nyitva ezt a lapot.'}</p></aside></div>`;$('backhome').onclick=home;window.scrollTo(0,0)}

function quiz(){const qs=questions.filter(q=>q.room===S.room),q=qs[S.qi];const ev=S.level==='support'?`<div class="quote">${q.ev.map(i=>esc(POEM[i])).join('\n')}</div>`:'';shell(`<span class="eyebrow">${S.room+1}. állomás / ${S.qi+1} / ${qs.length}</span><h2>${names[S.room]}</h2><p>${S.room===0?'A labor azonosítást kér. Csak olyan állítást fogad el, amelyet a kézirat igazol.':S.room===1?'Fejtsd vissza az üzeneteket. Keresd ki a versből a bizonyító sort is.':S.room===2?'A különös szavakat nem elég felismerni: azt is derítsd ki, hogyan működnek.':'A kijáratnál a nyomokból értelmezést kell alkotnod.'}</p><h3>${esc(q.q)}</h3>${ev}<div class="options" id="opts"></div><div id="feedback" role="status" aria-live="polite"></div><div id="hintBox" class="help hidden"></div><div class="actions" id="actions"><button class="primary" id="check">Döntés ellenőrzése</button><button id="hint">Kapaszkodó</button></div>`);

function ordering(){order=shuffle([16,17,18,19]);shell(`<span class="eyebrow">4. állomás / Kéziratrekonstrukció</span><h2>Szétesett kézirat</h2><p>Négy egymást követő verssor összekeveredett. A nyilakkal állítsd helyre az eredeti sorrendet! Utána olvassátok fel összefüggően.</p><ol id="order" class="orderlist"></ol><div id="feedback" role="status" aria-live="polite"></div><div id="hintBox" class="help hidden"></div><div class="actions" id="actions"><button id="check" class="primary">Sorrend ellenőrzése</button><button id="hint">Kapaszkodó</button></div>`);drawOrder();$('hint').onclick=()=>hint('Az akarásból indulj: előbb a piros tinta, majd a hozzá tartozó hasonlat, aztán az írás vágya, végül a két címzett következik.');let tries=0;$('check').onclick=()=>{tries++;S.checks++;recordAnswer('order',order.every((v,i)=>v===16+i));if(order.every((v,i)=>v===16+i)){locked=true;if(tries===1)S.first++;save();msg('A kézirat újra összeállt. A színvágyból írásvágy lesz, majd megjelennek a címzettek.',true);drawOrder();$('check').disabled=true;$('hint').disabled=true;finishButton()}else{S.attempts++;save();msg('Még nem az eredeti sorrend. Kövesd a gondolatmenetet, vagy ellenőrizd a szövegdossziét.')}}}

function memory(){let [a,b]=chunks[S.chunk];shell(`<span class="eyebrow">5. állomás / Emléknyomat ${S.chunk+1} / 4</span><h2>A tinta eltűnik. A vers marad.</h2><p>Olvasd fel ${a===0?'az':'a'} ${a+1}–${b}. sort. Keress hozzá egy képet vagy mozdulatot. Ha kész vagy, rejtsd el a szöveget, és állítsd vissza a hiányzó szavakat!</p><div id="study" class="quote">${POEM.slice(a,b).map(esc).join('\n')}</div><div id="cloze" class="cloze hidden"></div><div id="feedback" role="status" aria-live="polite"></div><div id="hintBox" class="help hidden"></div><div class="actions" id="actions"><button id="hide" class="primary">Megjegyeztem · tinta elrejtése</button><button id="peek" class="hidden">Újra elolvasom</button><button id="check" class="primary hidden">Emléknyomat ellenőrzése</button></div><p class="small muted">A négy emléknyomat a teljes, 26 soros verset járja be. A részletekre bontás tanulási segédlet, nem új versszakolás.</p>`);
for(let i=a;i<b;i++){let line=POEM[i],word=blanks[i],pos=line.indexOf(word),label=document.createElement('label');label.append(document.createTextNode(line.slice(0,pos)));let control;if(S.level==='challenge'){control=document.createElement('input');control.type='text';control.autocomplete='off';control.spellcheck=false}else{control=document.createElement('select');const empty=document.createElement('option');empty.value='';empty.textContent='Válassz szót…';control.append(empty);let opts=S.level==='support'?[word,distractors[i]]:[word,distractors[i],blanks[(i+7)%26]];shuffle([...new Set(opts)]).forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;control.append(o)})}control.id='blank'+i;control.setAttribute('aria-label',`${i+1}. verssor hiányzó szava`);control.oninput=()=>control.classList.remove('wrong');label.append(control,document.createTextNode(line.slice(pos+word.length)));$('cloze').append(label)}

function finish(){const points=score();const elapsed=Math.max(1,Math.round((Date.now()-S.started)/60000));$('main').innerHTML=`<section class="panel"><span class="eyebrow">A kézirat helyreállt</span><h2>Visszaadtad a színeket.</h2><p>${esc(S.team)}, mind a hat állomást teljesítetted. A vers szövegét, képeit és gondolatmenetét is végigjártad.</p><div class="feedback good"><strong>Pontszám: ${points.earned} / ${points.max} pont (${Math.round(points.earned/points.max*100)}%)</strong><br>${points.earned/points.max>=.85?"Biztos szövegolvasó: többféle nyomot is pontosan összekapcsoltál.":points.earned/points.max>=.6?"Jó úton jársz: a javított döntések bizonyító részleteit érdemes újra átnézned.":"A kitartó újraolvasás segített végigjutni. Ismételd át a színekhez tartozó címzetteket és a költői képeket!"}<br><span class="small">Elsőre helyes: 2 pont; javítás után helyes: 1 pont. A segítségért nincs levonás. A nyitott értelmezések önellenőrzésre valók, pontot nem kapnak.${points.legacy?" A korábban befejezett feladatok első próbáját a régi mentés nem őrizte meg; ezeknél a teljesítést 1 ponttal vettük figyelembe.":""}</span></div><div class="resultgrid"><div><strong>6 / 6</strong>visszanyert tinta</div><div><strong>26 / 26</strong>verssor az emléknyomatban</div><div><strong>${S.hints}</strong>kért kapaszkodó / újraolvasás</div></div><p class="small muted">${elapsed} perc a kezdés óta, a szünetekkel együtt. Javítást igénylő ellenőrzések: ${S.attempts}. Ez gyakorlási visszajelzés, nem osztályzat. A segítség használatáért nincs levonás.</p><h3>Utolsó üzenet: a saját tintád</h3><p>Írj egy rövid képeslapot valakinek, akár egy kitalált címzettnek! Nevezz meg egy saját színt, kapcsolj hozzá érzést, és mondd el, mit adnál vele a címzettnek. Ez saját szöveg, nem Kosztolányi-idézet.</p><label>Saját képeslap<textarea id="card" maxlength="1000" placeholder="Pl. bátorság-kékkel írnék…">${esc(S.card||'')}</textarea></label><p class="small muted">A képeslapot a játék nem minősíti automatikusan. Beszéljétek meg: megvan-e a címzett, a szín, az érzés és az ajándékozó szándék?</p><div class="actions"><button id="keep" class="primary">Képeslap megőrzése</button><button id="download">Eredmény és képeslap letöltése</button><button id="again">Új küldetés</button><button id="practice">Verspróba · teljes szöveg</button><button id="reviewReading">Digitális szövegértés · válaszaim</button></div><p id="cardmsg" role="status"></p><div class="postcard hidden" id="postcard"></div></section><section class="panel"><h3>Amit most már meg tudsz mutatni</h3><p>Visszakeresel adatot és bizonyító idézetet; felismered a vágyat jelző igealakokat; megmagyarázod a néma-szürke szinesztéziáját; értelmezed az írás és az élet kiszínezésének kapcsolatát.</p><p class="muted">A fejből tudást külön próbáld ki: zárd be a szövegdossziét, és mondd el a verset. Ami még nem megy, ahhoz térj vissza másnap. A játék teljesítése önmagában nem bizonyítja a teljes vers biztos memoriterként való tudását.</p></section>`;

 {title:'Miért nem elég száz tinta?',body:choice('more','Mit érzékeltet a száz → ezer → millió növekedése?',[['count','A megvásárolt tinták pontos darabszámát.'],['desire','Fokozással és túlzással az egyre telhetetlenebb vágyat.'],['end','A vágy fokozatos megszűnését.']]),ok:()=>A.more==='desire',why:'A növekvő számok a sokféle szín és az alkotás utáni vágyat erősítik. Nem készletnyilvántartást olvasunk.'}
 ];
 shell(`<span class="eyebrow">Digitális szövegértő műhely / nyomtatás nélkül</span><h2>Állítom – idézem – elmagyarázom</h2><p>Hat ellenőrizhető döntés és két saját értelmezés. A teljes verset bármikor megnyithatod. Válaszaid ezen az eszközön mentődnek.</p><p class="small muted">Pontozás: feladatonként elsőre 2, javítás után 1 pont. A segítségért nincs levonás. A két nyitott választ te ellenőrzöd szempontok alapján.</p>${tasks.map((t,i)=>`<section class="panel"><h3>${i+1}. ${t.title}</h3><fieldset id="readfields${i}" style="border:0;padding:0;margin:0" ${S.results?.['read'+i]?.points?'disabled':''}><legend class="small">${i+1}. szövegértési feladat</legend>${t.body}</fieldset><button id="readcheck${i}" ${S.results?.['read'+i]?.points?'disabled':''}>Válasz ellenőrzése</button><p id="readmsg${i}" role="status" aria-live="polite">${S.results?.['read'+i]?.points?esc(t.why):''}</p></section>`).join('')}<section class="panel"><h3>7. A zárósor próbája</h3><label>Mit jelenthet az élet kiszínezése? Írj egy értelmezést, és kapcsolj hozzá egy korábbi versrészletet!<textarea id="life" maxlength="1500">${esc(A.life||'')}</textarea></label><h3>8. Árnyald az első benyomást!</h3><label>Csak örömteli a vers? Válassz egy árnyaló szót vagy igealakot, és magyarázd el!<textarea id="mood" maxlength="1500">${esc(A.mood||'')}</textarea></label><button id="openReview">Összevetem a szempontokkal</button><div id="reviewGuide" class="hidden feedback"><p>A 7. válasz akkor indokolt, ha megmutatja, mit adhat az írás vagy a képzelet a beszélőnek, és egy tényleges versrészlethez kapcsolódik. Példa lehet az ismételt írnék vagy a vágyott boldogság. Többféle, szöveggel igazolt olvasat elfogadható.</p><p>A 8. válaszban például a szomorú-viola vagy a lennék feltételes alakja árnyalhatja az örömöt. Magyarázd is el a kapcsolatot; egy színhez nem tartozik minden helyzetben ugyanaz a jelentés.</p><label class="row"><input style="width:24px;min-height:24px" type="checkbox" id="selfReview" ${A.selfReview?'checked':''}>Mindkét válaszomat összevetettem a szempontokkal: állítás, szövegbizonyíték, magyarázat.</label><p class="small">Ez önellenőrzés. A program nem dönti el, hogy az értelmezésed helyes-e. Kérdéses esetben beszéljétek meg a tanárral!</p></div></section><p id="readingStatus" role="status" aria-live="polite"></p><button id="readingFinish" class="primary">Záróértékelés megnyitása</button>`);
 for(const el of $('work').querySelectorAll('input,select,textarea'))el.oninput=()=>{A[el.id]=el.type==='checkbox'?el.checked:el.value;if(el.id==='life'||el.id==='mood'){A.selfReview=false;$('selfReview').checked=false}save()};
 tasks.forEach((t,i)=>{$('readcheck'+i).onclick=()=>{const ok=t.ok();recordAnswer('read'+i,ok);$('readmsg'+i).className='feedback '+(ok?'good':'bad');$('readmsg'+i).textContent=ok?t.why:'Még nem pontos. '+['Keresd vissza a 2–4. és a 20. sort!','A feltételes mód jelét keresd; pontosan két alakot jelölj!','Különítsd el azt, amit a vers kimond, attól, amit nem tudunk meg belőle!','Az anya és az arany együtt szerepeljen a bizonyítékban!','A hang és a szín érzékeléséből indulj ki!','Figyeld meg, hogyan változik a vágy ereje a számokkal!'][i];if(ok){$('readfields'+i).disabled=true;$('readcheck'+i).disabled=true}}});
 $('openReview').onclick=()=>{if(!A.life?.trim()||!A.mood?.trim()){$('readingStatus').textContent='Előbb írd le mindkét saját értelmezésedet!';return}$('reviewGuide').classList.remove('hidden');$('reviewGuide').scrollIntoView({block:'center'})};
 if(A.selfReview)$('reviewGuide').classList.remove('hidden');
 $('readingFinish').onclick=()=>{if(!tasks.every((_,i)=>S.results?.['read'+i]?.points)){$('readingStatus').textContent='A zárás előtt ellenőrizd és javítsd mind a hat döntést!';return}if(!A.life?.trim()||!A.mood?.trim()||!A.selfReview){$('readingStatus').textContent='A két saját válasz után nyisd meg az önellenőrzési szempontokat, és jelöld, hogy átnézted őket!';return}S.readingDone=true;save();finish()};
}

function practice(){shell(`<span class="eyebrow">Szabad műhely / memoriter</span><h2>Verspróba</h2><p>Próbáld felidézni a következő sort, majd nyisd ki. Ha újra rákattintasz, eltűnik. Soronként haladj, vagy dolgozzatok váltott sorokkal!</p><div class="options" id="reveal"></div><button id="finishback" class="primary">Vissza az eredményhez</button>`);POEM.forEach((line,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${i+1}. sor · felfedés`;b.setAttribute('aria-expanded','false');b.onclick=()=>{let opened=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!opened));b.textContent=opened?`${i+1}. sor · felfedés`:line};$('reveal').append(b)});$('finishback').onclick=finish}
$('size').onclick=()=>{let on=document.body.classList.toggle('bigtext');$('size').setAttribute('aria-pressed',String(on));$('size').textContent=on?'Normál betűméret':'Nagyobb betűk'};home();
</script></body></html>
