<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rövid leckék</title><style>body{font:18px/1.6 system-ui,sans-serif;background:#f5f8f8;color:#173447;max-width:760px;margin:auto;padding:20px}section,fieldset{background:white;border:1px solid #d9e3e5;border-radius:12px;padding:18px;margin:16px 0}button{font:inherit;padding:10px;margin:5px;border:1px solid #14695e;border-radius:8px;background:white;color:#173447}button:focus-visible,a:focus-visible{outline:3px solid #b36c00}a{color:#14695e}h1{line-height:1.2}legend{font-weight:bold}</style><a href="./">← Tanulóműhely</a><main id="main"></main><script>const data=[["allitmany","Az állítmány","Mit állítunk az alanyról? Az állítmány a mondat egyik fő mondatrésze. Gyakran ige: A kutya ugat. Az állítmány lehet névszói is: A kutya ügyes. Kettős vonallal húzzuk alá.","Keresd meg, mit állít a mondat! A gyerek olvas. → olvas. A virág szép. → szép.",[["A madár repül. Mi az állítmány?",["madár","repül","A"],1],["A leves finom. Mi az állítmány?",["leves","finom","A"],1],["Melyik szó ige?",["fut","piros","asztal"],0]]],["vizozon","A vízözön története","A Biblia történetében Noé bárkát épít Isten útmutatása szerint. Családja és állatok menekülnek meg a vízözöntől. A víz visszahúzódása után a szivárvány a szövetség jele. A történet a bizalomról, felelősségről és újrakezdésről is szól.","Noé kitartott akkor is, amikor nehéz feladatot kapott.",[["Ki építette a bárkát?",["Noé","Mózes","Dávid"],0],["Mi a szövetség jele?",["csillag","szivárvány","hold"],1],["Melyik lehet a történet üzenete?",["A felelősség fontos.","Mindig fel kell adni.","Nem kell segíteni."],0]]],["nepmese","A népmese","A népmese szájhagyomány útján terjedt. Szerzője általában ismeretlen. Gyakoriak a csodás események, próbák, meseszámok és ismétlődő fordulatok. A jó gyakran elnyeri jutalmát.","Mesekezdés: Hol volt, hol nem volt… Gyakori meseszám: három, hét.",[["Hogyan terjedt a népmese?",["szájhagyomány útján","csak újságban","csak filmen"],0],["Melyik gyakori meseszám?",["három","tizenkilenc","negyvenkettő"],0],["Melyik tipikus mesekezdés?",["Hol volt, hol nem volt…","Tisztelt igazgató!","Jó étvágyat!"],0]]],["simple-past","Simple Past – egyszerű múlt idő","Befejezett múltbeli eseményekről beszélünk. Szabályos igék: play → played. Rendhagyó igék: go → went. Tagadás: didn't + az ige alapalakja. Kérdés: Did + alany + az ige alapalakja?","I played yesterday. I didn't play yesterday. Did you play yesterday?",[["Yesterday I ___ football.",["play","played","playing"],1],["She didn't ___ to school.",["went","go","goes"],1],["___ you watch TV yesterday?",["Do","Does","Did"],2]]],["igekotok","Az igekötők","Az igekötő módosíthatja az ige jelentését. Ha közvetlenül az ige előtt áll, egybeírjuk vele. Ha utána áll, különírjuk. Ha más szó kerül közéjük, mindhárom szót különírjuk.","Megírom a levelet. Írd meg a levelet! Meg fogom írni a levelet.",[["Melyik helyes?",["el megy","elmegy","el-megy"],1],["Melyik helyes?",["Menj el!","Menj el! helyett Menjel!","El menj!"],0],["Melyik helyes?",["megfogom írni","meg fogom írni","meg fogomírni"],1]]],["daidalosz","Daidalosz és Ikarosz","A görög mítoszban Daidalosz és fia, Ikarosz Kréta szigetéről szárnyakkal menekülnek. Daidalosz figyelmezteti fiát, hogy ne repüljön túl magasra. Ikarosz a Nap közelébe repül, a viasz megolvad, és a fiú a tengerbe zuhan.","A történet egyik tanulsága: érdemes megfogadni a tapasztaltabbak tanácsát.",[["Milyen műfajú a történet?",["mítosz","népdal","regény"],0],["Mivel rögzítették a tollakat?",["vassal","viasszal","üveggel"],1],["Miért zuhant le Ikarosz?",["Túl magasra repült.","Elaludt.","Nem volt szárnya."],0]]],["csodaszarvas","A csodaszarvas mondája","Hunor és Magyar vadászat közben egy különleges szarvast üldöznek. Új vidékre jutnak, ahol letelepednek. A monda a hunok és a magyarok eredetét magyarázza. A monda történelmi elemeket és csodás eseményeket kapcsol össze.","A csodaszarvas vezeti a két testvért új hazájuk felé.",[["Kik a főszereplők?",["Hunor és Magyar","Noé és Mózes","Toldi és György"],0],["Mi a műfaja?",["eredetmonda","elégia","vígjáték"],0],["Mi vezeti őket?",["egy ló","egy sas","egy szarvas"],2]]],["toldi","Toldi – első ének","Arany János elbeszélő költeményének főhőse Toldi Miklós. Az első énekben a nagy erejű Miklós a mezőn találkozik Laczfi Endre katonáival. Egy nehéz rúddal mutatja meg a Budára vezető utat. Miklós vitézi életre vágyik.","Miklós testi ereje és becsvágya már az első énekben megmutatkozik.",[["Ki írta a Toldit?",["Petőfi Sándor","Arany János","Jókai Mór"],1],["Mivel mutat utat Miklós?",["rúddal","karddal","térképpel"],0],["Mi Miklós vágya?",["vitézzé válni","kereskedni","hajózni"],0]]],["janus","Janus Pannonius","Janus Pannonius (1434–1472) humanista költő, pécsi püspök. Itáliában tanult, latin nyelven írt. Költészetében fontos az antik műveltség és az egyéni élmény. Ismert versei: Pannónia dicsérete, Egy dunántúli mandulafáról.","A korán virágzó mandulafa a költő sorsának jelképeként is értelmezhető.",[["Milyen nyelven írt?",["latinul","angolul","németül"],0],["Melyik korszakhoz kapcsolódik?",["reneszánsz","romantika","barokk"],0],["Melyik az ő műve?",["Toldi","Pannónia dicsérete","János vitéz"],1]]]];const main=document.getElementById('main');function add(p,t,s){const e=document.createElement(t);e.textContent=s;p.append(e);return e}const selected=data.find(x=>x[0]===new URLSearchParams(location.search).get('lecke'));if(!selected){add(main,'h1','Rövid leckék');for(const l of data){const a=add(main,'a',l[1]);a.href='?lecke='+l[0];add(main,'p','');}}else{const [id,title,note,example,qs]=selected;add(main,'h1',title);const s=add(main,'section','');add(s,'h2','Füzetvázlat');add(s,'p',note);add(s,'h2','Példa');add(s,'p',example);add(main,'h2','Próbáld ki!');let done=new Set();const score=add(main,'p','Megoldva: 0 / '+qs.length);score.setAttribute('role','status');qs.forEach(([q,opts,right],i)=>{const f=add(main,'fieldset','');add(f,'legend',q);const feedback=document.createElement('p');feedback.setAttribute('aria-live','polite');opts.forEach((o,j)=>{const b=add(f,'button',o);b.onclick=()=>{if(j===right){feedback.textContent='Helyes!';done.add(i);score.textContent='Megoldva: '+done.size+' / '+qs.length;f.querySelectorAll('button').forEach(x=>x.disabled=true)}else{feedback.textContent='Még nem jó. Próbáld újra!'}}});f.append(feedback)});}</script></html>
