ulatfestő szavak","Jelentésmező","Szövegalkotás és összefoglalás","Ellenőrizd a tudásodat!","Összefoglalás – rendszerezés I.","Összefoglalás – rendszerezés II."],lessons=[[["A **lényegkiemelés** a fontos információk kiválasztása. A **rendszerezés** az összetartozó ismeretek csoportosítása. A **felidézés** során emlékezetből mondjuk el a tanultakat. Az **ismétlés** segít megjegyezni a tananyagot.","Keresd meg a **lényeget**! Csoportosítsd az ismereteket! Mondd el emlékezetből! Ismételj!","Olvass! Keresd meg a **fontos szavakat**! Mondd el, mire emlékszel!"],"A sün éjszaka keresi a táplálékát. Rovarokat és más apró állatokat eszik. Veszély esetén összegömbölyödik. Tegnap egy sünről szóló képet láttam egy füzetben. Ha a sün életmódjáról tanulsz, az első három mondat a lényeges.",[["Mi segít a figyelemben?","Csendes környezet","Folyamatos üzenetváltás","Hangos videó"],["Mi a lényegkiemelés?","A fontos információk kiválasztása","Minden szó lemásolása","A cím kihagyása"],["Mit jelent a felidézés?","Emlékezetből elmondom a tanultakat","Új könyvet veszek","Elrakom a füzetet"],["Mi segíti a rendszerezést?","Gondolattérkép","Véletlen firkálás","A jegyzet eldobása"],["Mi segíti a tartós tudást?","Ismétlés és önellenőrzés","A lecke kihagyása","Csak a cím olvasása"]]],[["A **jel** információt hordoz. A **természetes jel** emberi beavatkozás nélkül keletkezik. A **mesterséges jelet** az ember alkotja. A jelek rendszert alkothatnak.","A **jel** üzen valamit. A füst természetes jel. A STOP tábla mesterséges jel.","A **jel** üzen valamit. A füst tüzet jelezhet. A piros lámpa megállásra int."],"Sötét felhő: eső közeledhet. Piros közlekedési lámpa: meg kell állni.",[["Melyik természetes jel?","Sötét felhő","STOP tábla","Százalékjel"],["Melyik mesterséges jel?","Közlekedési lámpa","Füst","Láz"],["Mit jelez a piros közlekedési lámpa?","Meg kell állni","Szabad az út","Esik a hó"],["Melyik jelrendszer?","A közlekedési táblák rendszere","Egy kavics","Egy pohár víz"],["Miért tanuljuk meg a mesterséges jeleket?","Hogy értsük jelentésüket","Hogy eltűnjenek","Hogy ne használjuk őket"]]],[["A **kommunikáció** információcsere. A **feladó** küldi az üzenetet. A **címzett** fogadja. A **kód** a használt jelrendszer. A **csatorna** közvetíti az üzenetet. A **beszédhelyzet** a közlés körülményeit jelenti. A **zaj** zavarhatja a megértést. A közlés célja lehet tájékoztatás, kérdés, kérés, utasítás, érzelemkifejezés vagy kapcsolattartás.","A **feladó** üzenetet küld. A **címzett** megkapja. A **csatorna** közvetíti. A **zaj** zavarhatja a megértést.","A **feladó** üzen. A **címzett** megkapja az üzenetet."],"Anna telefonon megkérdezi Petitől, mikor ér haza. Anna a feladó, Peti a címzett, a telefon a csatorna.",[["Ki küldi az üzenetet?","Feladó","Címzett","Zaj"],["Ki kapja az üzenetet?","Címzett","Feladó","Csatorna"],["Mi zavarhatja a megértést?","Zaj","Köszönés","Válasz"],["Mi a célja: Hány óra van?","Kérdés","Utasítás","Érzelemkifejezés"],["Mi a célja: Csukd be az ajtót!","Utasítás","Tájékoztatás","Köszönés"],["Mi lehet csatorna?","Telefon","A feladó neve","Az üzenet célja"]]],[["A **nem nyelvi jelek** szavak nélkül is üzennek. A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A tekintet és a testtartás is jelezhet. A térköz, a hangerő, a hangsúly és a beszédtempó is fontos. Az állatok is kommunikálnak.","A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A hangunk is üzen.","A **mosoly** és az **integetés** is üzenhet."],"Ha búcsúzáskor integetsz, a kézmozdulatod helyettesítheti az elköszönést.",[["Melyik nem nyelvi jel?","Integetés","Leírt mondat","Kimondott szó"],["Mi a mimika?","Arcjáték","Levélírás","Telefon"],["Mi a gesztus?","Például kézmozdulat","Betű","Mondat"],["Mivel jelezhet a kutya?","Testtartással","Írott levéllel","Fogalmazással"],["Mi változhat a hangunkban?","Hangerő","Betűrend","Helyesírás"],["Mit jelenthet a mosoly?","Örömöt","Mindig haragot","Mindig félelmet"]]],[["A kapcsolattartás három szakasza a **kapcsolatfelvétel**, a **fenntartás** és a **lezárás**. Köszönéssel kezdünk. Beszélgetünk. Végül elköszönünk. A helyzethez illő megszólítást használunk. Udvariasan kérünk és érdeklődünk.","**Köszönünk**, beszélgetünk, majd elköszönünk. Ismeretlen embernek bemutatkozunk. Udvariasan kérünk.","**Köszönj!** Kérj szépen! Köszönd meg! Köszönj el!"],"A könyvtárban: Jó napot kívánok! Hol találom a mesekönyveket? Köszönöm szépen!",[["Hogyan köszönsz egy ismeretlen felnőttnek?","Jó napot kívánok!","Cső!","Hé!"],["Melyik udvarias kérés?","Kérlek, add ide a füzetet!","Ide vele!","Azonnal add!"],["Mi zárja le a beszélgetést?","Elköszönés","Bemutatkozás","Megszólítás"],["Mit mondasz bemutatkozáskor?","A nevemet","A jelszavamat","Semmit"],["Mit jelent a tudakozódás?","Információt kérünk","Elalszunk","Elrejtünk valamit"],["Mit mondasz, ha segítettek?","Köszönöm!","Mindegy!","Hagyjál!"]]],[["A beszédstílust a helyzethez igazítjuk. A **szleng** egyes csoportokra jellemző nyelvhasználat. Telefonáláskor köszönünk. Szükség esetén bemutatkozunk. Elmondjuk a hívás célját. Végül elköszönünk. Fogalmazáshoz ismert, érdekes témát választunk.","Baráttal másképp beszélünk, mint hivatalos helyen. Telefonáláskor **köszönj**, mutatkozz be, és mondd el a célodat. Ismert témáról írj!","**Köszönj!** Mondd meg a neved! Mondd el, mit szeretnél!"],"Jó napot kívánok! Kiss Anna vagyok. A könyvtár nyitvatartásáról érdeklődöm.",[["Mit teszel ismeretlen ember felhívásakor?","Köszönök és bemutatkozom","Azonnal követelőzöm","Leteszem"],["Melyik köznyelvi megfelelője a király szlengszónak ebben: Ez király!?","Nagyon jó","Uralkodó","Korona"],["Milyen témát válassz fogalmazáshoz?","Amelyet ismerek","Amelyről semmit sem tudok","Véletlenszerűt"],["Mit teszel téves híváskor?","Elnézést kérek","Kiabálok","Sértegetek"],["Mi illik hivatalos beszélgetésbe?","Udvarias köznyelv","Bántó szleng","Gúnyolódás"],["Mit kérdezhetsz elfoglalt ember telefonos hívásakor?","Alkalmas most a beszélgetés?","Miért nem figyelsz?","Miért dolgozol?"]]],[["A nyelvi kommunikáció lehet **szóbeli** vagy **írásbeli**. Lehet közvetlen vagy közvetett. A **kétirányú** közlésben a felek válaszolhatnak egymásnak. Az **egyirányú** közlésben nincs közvetlen válasz. A szöveget a célhoz és a címzetthez igazítjuk.","Beszélhetünk vagy írhatunk. A **párbeszéd** kétirányú. A rádióadás rendszerint egyirányú.","**Beszélhetsz** vagy **írhatsz**. Beszélgetéskor mindketten válaszolhattok."],"A barátoddal beszélgetsz: kétirányú kommunikáció. Egy rádióhírt hallgatsz: rendszerint egyirányú.",[["Melyik írásbeli kommunikáció?","E-mail","Szóbeli felelet","Telefonbeszélgetés"],["Melyik kétirányú?","Párbeszéd","Rádióhír hallgatása","Plakát olvasása"],["Melyik közvetlen?","Személyes beszélgetés","Levélváltás","Rádióadás"],["Mi a plakát célja egy iskolai vásárról?","Tájékoztatás és felhívás","Elhallgatás","Titkosítás"],["A levelezés nyelvi kommunikáció?","Igen","Nem","Csak ha hangos"],["Melyik fejez ki érzelmet?","De örülök!","Hány óra van?","Csukd be az ajtót!"]]],[["Ismételd át a **jeleket**! Idézd fel a **kommunikáció tényezőit** és céljait! Gondolj a nem nyelvi jelekre! Ismételd át az udvarias kapcsolattartást!","Emlékezz a **feladóra**, a címzettre, az üzenetre és a csatornára! Ismételd át az udvarias beszédet!","**Ki üzen?** Kinek? Mit? Hogyan?"],"Bence üzenetet küld Évának: Bence a feladó, Éva a címzett.",[["Mi a kommunikáció?","Információcsere","Betűrend","Szótagolás"],["Mi a kód?","A használt jelrendszer","A zaj","A címzett"],["Melyik természetes jel?","Füst","STOP tábla","Százalékjel"],["Mi zavarja a közlést?","Zaj","Megértés","Udvarias válasz"],["Melyik nem nyelvi jel?","Bólintás","Levél","Kimondott mondat"],["Melyik a kapcsolatfelvétel példája?","Köszönés","Elköszönés","Alvás"],["Melyik kétirányú közlés?","Telefonbeszélgetés","Plakát","Rádióhír"],["Mi segíti a megértést?","Közös jelrendszer","Ismeretlen kód","Erős zaj"]]],[["A magyar helyesírás **betűíró**. Hangokat jelölő betűkkel írunk. Írásunk **latin betűs**. Helyesírásunk **hangjelölő**. A betűk többnyire a kiejtett hangokat jelölik. Helyesírásunk **értelemtükröző**. Az írás a jelentést is megmutatja. A **beszédhangot** kimondjuk és halljuk. A **betű** a beszédhang írott jele. A betűk összessége az **ábécé**. Az **írásjegy** a betű alkotóeleme. A cs kétjegyű, a dzs háromjegyű betű. Az **írásjelek** tagolják a szöveget. Az ékezetek a magánhangzók jelölésében segítenek. A helyesírást olvasással, gyakorlással és szabályok alkalmazásával tanuljuk. Ha bizonytalan vagy, használj **helyesírási szótárt**.","Írásunk **betűíró**, **latin betűs**, **hangjelölő** és **értelemtükröző**. A hangot halljuk. A betűt látjuk. A betűk összessége az **ábécé**. A cs két írásjegyből áll. A dzs három írásjegyből áll. A pont és a kérdőjel **írásjel**. Gyakorolj! Ha bizonytalan vagy, nézz utána a helyesírási szótárban.","A **hangot** halljuk. A **betűt** látjuk. Betűkkel írunk. Latin betűket használunk. Írásunk hangokat és jelentést is jelöl. A cs egy betű, két írásjeggyel. A dzs egy betű, három írásjeggyel. A pont **írásjel**. A betűk együtt alkotják az **ábécét**."],"A „kisfiú” gyermeket jelent. A „kis fiú” kis termetű fiúra utal. A „cs” egy betű, de két írásjegyből áll. A „Hová mész?” végén kérdőjel áll.",[["Mit hallunk?","Beszédhangot","Betűt","Írásjelet"],["Mit látunk a leírt szóban?","Betűket","Beszédhangokat","Hanghullámokat"],["Mi a betűk összessége?","Ábécé","Mondat","Szótár"],["Milyen betűkészletből alakult ki a magyar ábécé?","Latin","Cirill","Görög"],["Miért betűíró a magyar írás?","Hangokat jelölő betűkkel írunk.","Csak képekkel írunk.","Minden szóhoz külön rajz tartozik."],["Mit jelent a hangjelölő jelleg?","A betűk többnyire a kiejtett hangokat jelölik.","A betűk mindig egész mondatokat jelölnek.","A betűk csak számokat jelölnek."],["Mit mutat az értelemtükröző írás?","A jelentést is.","Csak a betűk színét.","Csak a hangerőt."],["Hány írásjegyből áll a cs?","Kettőből","Egyből","Háromból"],["Hány írásjegyből áll a dzs?","Háromból","Kettőből","Egyből"],["Mel q[0]);const opts=q.slice(1,mode.value==='sni'?3:4);if(mode.value==='btmn')b(p,'💡 Segítség',()=>{feedback.textContent=l[0][1].replace(/\*\*/g,'')});for(let j=opts.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[opts[j],opts[k]]=[opts[k],opts[j]]}const buttons=[];const feedback=e(p,'p','');feedback.className='feedback';feedback.setAttribute('aria-live','polite');opts.forEach(o=>{const x=b(p,o,()=>{buttons.forEach(z=>z.disabled=true);if(o===q[1]){done++;feedback.textContent='⭐ Helyes! A kapu kinyílt.'}else{queue.push(q);feedback.textContent='A helyes válasz: '+q[1]+'. Később újra próbálhatod.'}b(p,'Tovább',step)});x.className='answer';buttons.push(x)})}step()}mode.onchange=()=>{document.body.className=mode.value;current<0?map():lesson(current)};map()</script></html>
