/* NyelvtanKaland: accessible adventure visual system */

.lesson-tile:hover{background:#f8fcff}.nk-tile-number{flex:none;background:var(--soft,#e4eff7);color:var(--accent,#174b78);font-weight:800;border-radius:10px;width:36px;height:36px;display:grid;place-items:center}.nk-tile-text{min-width:0;flex:1;overflow-wrap:anywhere}.nk-tile-text small{font-size:.72em;color:#28643e;font-weight:600}

/* Progress and learning rewards: no time pressure, no ranking */

.nk-result{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--tone,#bfdce4);border-radius:20px;background:var(--soft,#e4f6f4);margin:10px 0 16px}.nk-result-ring{flex:none;width:94px;height:94px;display:grid;place-items:center;border-radius:50%;border:7px solid var(--tone,#b2dce2);background:white;color:#20324b;font-size:1.25em;font-weight:800}.nk-result-body{min-width:0;flex:1}.nk-result h3,.nk-result p{margin:3px 0}.nk-result progress{height:14px;margin-top:8px}.nk-new-badge{padding:9px 12px;border-radius:12px;background:#fff5d5;border:1px solid #dfb760;margin:8px 0;font-weight:700;color:#624316}.nk-tip{background:#fff8e5;border-left:4px solid #c89c46;border-radius:12px;padding:10px 14px;margin:12px 0;color:#52401e}
body.sni .nk-path-grid{grid-template-columns:repeat(2,minmax(0,1fr))}body.sni .nk-result{flex-wrap:wrap}body.sni .nk-reward-grid{grid-template-columns:1fr}

/* Focused question cards and learning feedback */
.nk-quiz-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--soft,#e9f5f8);border-radius:14px;margin:8px 0;color:var(--accent,#174b78);font-weight:750}.nk-quiz-head span:first-child{font-size:1.4em}.nk-quiz-head span:last-child{overflow-wrap:anywhere}

.nk-question-dots{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 16px}.nk-question-dot{width:25px;height:25px;border:1px solid #bacddb;border-radius:8px;background:#f2f6fa;color:#455971;font-size:13px;font-weight:750;display:grid;place-items:center}.nk-question-dot.active{border:2px solid var(--accent,#176e65);background:var(--soft,#e0f2ed)}.nk-question-dot.correct{background:#e1f4e7;border-color:#64a57a;color:#174b2a}.nk-question-dot.incorrect{background:#ffefdc;border-color:#c58b4f;color:#704213}
.nk-question-card{border:1px solid var(--tone,#c9dce9);border-radius:20px;padding:clamp(12px,3vw,20px);background:#fcfdff}.nk-question-card h3{font-size:1.18em;line-height:1.45;margin:3px 0 14px;color:#243b56}.nk-question-card .answer{display:flex;align-items:center;gap:12px;padding:12px;margin:9px 0;width:100%;text-align:left;overflow-wrap:anywhere;white-space:normal}.nk-answer-letter{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:#edf3f9;color:#284563;font-size:.85em;font-weight:800}.nk-answer-copy{flex:1;min-width:0}.nk-answer-mark{flex:none;font-size:1.1em;font-weight:800}.nk-unknown{background:#f4f6fa;color:#42536a;border-color:#d2dce6;font-size:.95em}.nk-unknown .nk-answer-letter{background:#e3e9f1}

/* Szócska's mission workshop */

"Keresd meg a **lényeget**! Csoportosítsd az ismereteket! Mondd el emlékezetből! Ismételj!","Olvass! Keresd meg a **fontos szavakat**! Mondd el, mire emlékszel!"],"A sün éjszaka keresi a táplálékát. Rovarokat és más apró állatokat eszik. Veszély esetén összegömbölyödik. Tegnap egy sünről szóló képet láttam egy füzetben. Ha a sün életmódjáról tanulsz, az első három mondat a lényeges.",[["A sün védekezéséről jegyzetelsz. Melyik mondatot emeld ki?","Veszély esetén összegömbölyödik.","Rovarokat és más apró állatokat eszik.","Éjszaka keresi a táplálékát."],["Melyik mondat foglalja össze legjobban a sünről szóló példa lényegét?","Éjszaka keres táplálékot, apró állatokat eszik, veszélyben összegömbölyödik.","Éjszaka keresi a táplálékát, amely főként apró állatokból áll.","A füzetben egy sünről készült kép látható."],["Melyik módszer ellenőrzi, hogy emlékszel-e a szabályra?","Becsukom a könyvet, és saját szavaimmal elmondom.","Nyitott könyvből felolvasom a szabályt.","Aláhúzom a szabály legfontosabb szavait."],["Melyik csoportosítás mutatja a szavak jelentése közötti kapcsolatot?","Gyümölcsök: alma, körte; tanszerek: ceruza, füzet.","Rövid szavak: alma, füzet; hosszabb szavak: körte, ceruza.","Gyümölcsök: alma, füzet; tanszerek: ceruza, körte."],["Holnap felelés lesz. Melyik módszer segít ellenőrizni a tartós tudásodat?","Ma és holnap emlékezetből válaszolok, majd ellenőrzöm a hibáimat.","Ma többször egymás után elolvasom a szabályt.","Holnap felelés előtt egyszer átfutom a leckét."]]],[["A **jel** információt hordoz. A **természetes jel** emberi beavatkozás nélkül keletkezik. A **mesterséges jelet** az ember alkotja. A jelek rendszert alkothatnak.","A **jel** üzen valamit. A füst természetes jel. A STOP tábla mesterséges jel.","A **jel** üzen valamit. A füst tüzet jelezhet. A piros lámpa megállásra int."],"Sötét felhő: eső közeledhet. Piros közlekedési lámpa: meg kell állni.",[["Melyik természetes jel?","Sötét felhő","STOP tábla","Százalékjel"],["Melyik mesterséges jel?","Közlekedési lámpa","Füst","Láz"],["Mit jelez a piros közlekedési lámpa?","Meg kell állni","Szabad az út","Esik a hó"],["Melyik jelrendszer?","A közlekedési táblák rendszere","Egy kavics","Egy pohár víz"],["Miért tanuljuk meg a mesterséges jeleket?","Hogy értsük jelentésüket","Hogy eltűnjenek","Hogy ne használjuk őket"],["Miért kell ismernünk a közlekedési táblák jelentését?","A jelek közös értelmezése teszi lehetővé a tájékozódást.","Minden tábla természetes jel.","A táblák csak díszítenek."],["Melyik párban van előbb természetes, majd mesterséges jel?","Láz – iskolai csengő","STOP tábla – láz","Állatnyom – viharfelhő"]]],[["A **kommunikáció** információcsere. A **feladó** küldi az üzenetet. A **címzett** fogadja. A **kód** a használt jelrendszer. A **csatorna** közvetíti az üzenetet. A **beszédhelyzet** a közlés körülményeit jelenti. A **zaj** zavarhatja a megértést. A közlés célja lehet tájékoztatás, kérdés, kérés, utasítás, érzelemkifejezés vagy kapcsolattartás.","A **feladó** üzenetet küld. A **címzett** megkapja. A **csatorna** közvetíti. A **zaj** zavarhatja a megértést.","A **feladó** üzen. A **címzett** megkapja az üzenetet."],"Anna telefonon megkérdezi Petitől, mikor ér haza. Anna a feladó, Peti a címzett, a telefon a csatorna.",[["Ki küldi az üzenetet?","Feladó","Címzett","Zaj"],["Ki kapja az üzenetet?","Címzett","Feladó","Csatorna"],["Mi zavarhatja a megértést?","Zaj","Köszönés","Válasz"],["Mi a célja: Hány óra van?","Kérdés","Utasítás","Érzelemkifejezés"],["Mi a célja: Csukd be az ajtót!","Utasítás","Tájékoztatás","Köszönés"],["Mi lehet csatorna?","Telefon","A feladó neve","Az üzenet célja"],["Éva telefonon kérdezi meg Bencétől az indulás idejét. Mi a csatorna?","Telefonos hangkapcsolat","Az indulás ideje","A magyar nyelv"],["Két ember nem érti egymás nyelvét. Melyik tényező okozza a nehézséget?","A közös kód hiánya","A címzett hiánya","A feladó hiánya"]]],[["A **nem nyelvi jelek** szavak nélkül is üzennek. A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A tekintet és a testtartás is jelezhet. A térköz, a hangerő, a hangsúly és a beszédtempó is fontos. Az állatok is kommunikálnak.","A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A hangunk is üzen.","A **mosoly** és az **integetés** is üzenhet."],"Ha búcsúzáskor integetsz, a kézmozdulatod helyettesítheti az elköszönést.",[["Melyik nem nyelvi jel?","Integetés","Leírt mondat","Kimondott szó"],["Mi a mimika?","Arcjáték","Levélírás","Telefon"],["Mi a gesztus?","Például kézmozdulat","Betű","Mondat"],["Mivel jelezhet a kutya?","Testtartással","Írott levéllel","Fogalmazással"],["Mi változhat a hangunkban?","Hangerő","Betűrend","Helyesírás"],["Mit jelenthet a mosoly?","Örömöt","Mindig haragot","Mindig félelmet"],["Valaki mosolyogva mondja: „Nagyon örülök!” Hogyan kapcsolódik a mimika a szavakhoz?","Megerősíti a közlés tartalmát.","Megszünteti a közlést.","Mindig ellentmond neki."],["Miért lehet félreérthető egy gesztus?","Jelentése helyzettől és kultúrától is függhet.","Mindenhol pontosan ugyanazt jelenti.","A gesztus mindig írásbeli."]]],[["A kapcsolattartás három szakasza a **kapcsolatfelvétel**, a **fenntartás** és a **lezárás**. Köszönéssel kezdünk. Beszélgetünk. Végül elköszönünk. A helyzethez illő megszólítást használunk. Udvariasan kérünk és érdeklődünk.","**Köszönünk**, beszélgetünk, majd elköszönünk. Ismeretlen embernek bemutatkozunk. Udvariasan kérünk.","**Köszönj!** Kérj szépen! Köszönd meg! Köszönj el!"],"A könyvtárban: Jó napot kívánok! Hol találom a mesekönyveket? Köszönöm szépen!",[["Hogyan köszönsz egy ismeretlen felnőttnek?","Jó napot kívánok!","Cső!","Hé!"],["Melyik udvarias kérés?","Kérlek, add ide a füzetet!","Ide vele!","Azonnal add!"],["Mi zárja le a beszélgetést?","Elköszönés","Bemutatkozás","Megszólítás"],["Mit mondasz bemutatkozáskor?","A nevemet","A jelszavamat","Semmit"],["Mit jelent a tudakozódás?","Információt kérünk","Elalszunk","Elrejtünk valamit"],["Mit mondasz, ha segítettek?","Köszönöm!","Mindegy!","Hagyjál!"],["Valaki eléd áll a sorban. Melyik válasz határozott és udvarias?","Elnézést, én már itt álltam. Kérlek, állj mögém!","Tűnj innen!","Nem szólok, de meglököm."],["Miért változhat a megszólítás a beszédhelyzettől függően?","A résztvevők viszonya és a helyzet befolyásolja.","Mindenkit ugyanúgy kell megszólítani.","Csak a mondat hossza számít."]]],[["A beszédstílust a helyzethez igazítjuk. A **szleng** egyes csoportokra jellemző nyelvhasználat. Telefonáláskor köszönünk. Szükség esetén bemutatkozunk. Elmondjuk a hívás célját. Végül elköszönünk. Fogalmazáshoz ismert, érdekes témát választunk.","Baráttal másképp beszélünk, mint hivatalos helyen. Telefonáláskor **köszönj**, mutatkozz be, és mondd el a célodat. Ismert témáról írj!","**Köszönj!** Mondd meg a neved! Mondd el, mit szeretnél!"],"Jó napot kívánok! Kiss Anna vagyok. A könyvtár nyitvatartásáról érdeklődöm.",[["Mit teszel ismeretlen ember felhívásakor?","Köszönök és bemutatkozom","Azonnal követelőzöm","Leteszem"],["Melyik köznyelvi megfelelője a király szlengszónak ebben: Ez király!?","Nagyon jó","Uralkodó","Korona"],["Milyen témát válassz fogalmazáshoz?","Amelyet ismerek","Amelyről semmit sem tudok","Véletlenszerűt"],["Mit teszel téves híváskor?","Elnézést kérek","Kiabálok","Sértegetek"],["Mi illik hivatalos beszélgetésbe?","Udvarias köznyelv","Bántó szleng","Gúnyolódás"],["Mit kérdezhetsz elfoglalt ember telefonos hívásakor?","Alkalmas most a beszélgetés?","Miért nem figyelsz?","Miért dolgozol?"],["Melyik a hivatalos telefonhívás helyes sorrendje?","Köszönés – bemutatkozás – a hívás célja – elköszönés","Bemutatkozás – elköszönés – kérdés – köszönés","Kérdés – elköszönés – bemutatkozás – köszönés"],["Miért érdemes egy komoly vitát gyakran személyesen rendezni?","A közvetlen visszajelzések segíthetnek a félreértések tisztázásában.","Telefonon tilos véleményt mondani.","Személyesen nem lehet félreértés."]]],[["A nyelvi kommunikáció lehet **szóbeli** vagy **írásbeli**. Lehet közvetlen vagy közvetett. A **kétirányú** közlésben a felek válaszolhatnak egymásnak. Az **egyirányú** közlésben nincs közvetlen válasz. A szöveget a célhoz és a címzetthez igazítjuk.","Beszélhetünk vagy írhatunk. A **párbeszéd** kétirányú. A rádióadás rendszerint egyirányú.","**Beszélhetsz** vagy **írhatsz**. Beszélgetéskor mindketten válaszolhattok."],"A barátoddal beszélgetsz: kétirányú kommunikáció. Egy rádióhírt hallgatsz: rendszerint egyirányú.",[["Melyik írásbeli kommunikáció?","E-mail","Szóbeli felelet","Telefonbeszélgetés"],["Melyik kétirányú?","Párbeszéd","Rádióhír hallgatása","Plakát olvasása"],["Melyik közvetlen?","Személyes beszélgetés","Levélváltás","Rádióadás"],["Mi a plakát célja egy iskolai vásárról?","Tájékoztatás és felhívás","Elhallgatás","Titkosítás"],["A levelezés nyelvi kommunikáció?","Igen","Nem","Csak ha hangos"],["Melyik fejez ki érzelmet?","De örülök!","Hány óra van?","Csukd be az ajtót!"],["Miért fontos pontosan fogalmazni írásban?","Az olvasó gyakran nem tud azonnal visszakérdezni, és nem hallja a hangsúlyt.","Írásban minden mondat kérdés.","Az írásban nincs jelentés."],["Melyik helyzetben változik a feladó és a címzett szerepe?","Két diák egymás kérdéseire válaszol.","Egy diák egy régi plakátot olvas.","Egy diák felvett híradást hallgat."]]],[["Ismételd át a **jeleket**! Idézd fel a **kommunikáció tényezőit** és céljait! Gondolj a nem nyelvi jelekre! Ismételd át az udvarias kapcsolattartást!","Emlékezz a **feladóra**, a címzettre, az üzenetre és a csatornára! Ismételd át az udvarias beszédet!","**Ki üzen?** Kinek? Mit? Hogyan?"],"Bence üzenetet küld Évának: Bence a feladó, Éva a címzett.",[["Mi a kommunikáció?","Információcsere","Betűrend","Szótagolás"],["Mi a kód?","A használt jelrendszer","A zaj","A címzett"],["Melyik természetes jel?","Füst","STOP tábla","Százalékjel"],["Mi zavarja a közlést?","Zaj","Megértés","Udvarias válasz"],["Melyik nem nyelvi jel?","Bólintás","Levél","Kimondott mondat"],["Melyik a kapcsolatfelvétel példája?","Köszönés","Elköszönés","Alvás"],["Melyik kétirányú közlés?","Telefonbeszélgetés","Plakát","Rádióhír"],["Mi segíti a megértést?","Közös jelrendszer","Ismeretlen kód","Erős zaj"]]],[["A magyar helyesírás **betűíró**. Hangokat jelölő betűkkel írunk. Írásunk **latin betűs**. Helyesírásunk **hangjelölő**. A betűk többnyire a kiejtett hangokat jelölik. Helyesírásunk **értelemtükröző**. Az írás a jelentést is megmutatja. A **beszédhangot** kimondjuk és halljuk. A **betű** a beszédhang írott jele. A betűk összessége az **ábécé**. Az **írásjegy** a betű alkotóeleme. A cs kétjegyű, a dzs háromjegyű betű. Az **írásjelek** tagolják a szöveget. Az ékezetek a magánhangzók jelölésében segítenek. A helyesírást olvasással, gyakorlással és szabályok alkalmazásával tanuljuk. Ha bizonytalan vagy, használj **helyesírási szótárt**.","Írásunk **betűíró**, **latin betűs**, **hangjelölő** és **értelemtükröző**. A hangot halljuk. A betűt látjuk. A betűk összessége az **ábécé**. A cs két írásjegyből áll. A dzs három írásjegyből áll. A pont és a kérdőjel **írásjel**. Gyakorolj! Ha bizonytalan vagy, nézz utána a helyesírási szótárban.","A **hangot** halljuk. A **betűt** látjuk. Betűkkel írunk. Latin betűket használunk. Írásunk hangokat és jelentést is jelöl. A cs egy betű, két írásjeggyel. A dzs egy betű, három írásjeggyel. A pont **írásjel**. A betűk együtt alkotják az **ábécét**."],"A „kisfiú” gyermeket jelent. A „kis fiú” kis termetű fiúra utal. A „cs” egy betű, de két írásjegyből áll. A „Hová mész?” végén kérdőjel áll.",[["Mit hallunk?","Beszédhangot","Betűt","Írásjelet"],["Mit látunk a leírt szóban?","Betűket","Beszédhangokat","Hanghullámokat"],["Mi a betűk összessége?","Ábécé","Mondat","Szótár"],["Milyen betűkészletből alakult ki a magyar ábécé?","Latin","Cirill","Görög"],["Miért betűíró a magyar írás?","Hangokat jelölő betűkkel írunk.","Csak képekkel írunk.","Minden szóhoz külön rajz tartozik."],["Mit jelent a hangjelölő jelleg?","A betűk többnyire a kiejtett hangokat jelölik.","A betűk mindig egész mondatokat jelölnek.","A betűk csak számokat jelölnek."],["Mit mutat az értelemtükröző írás?","A jelentést is.","Csak a betűk színét.","Csak a hangerőt."],["Hány írásjegyből áll a cs?","Kettőből","Egyből","Háromból"],["Hány írásjegyből áll a dzs?","Háromból","Kettőből","Egyből"],["Melyik egyjegyű betű?","m","gy","sz"],["Melyik kétjegyű betű?","ny","a","dzs"],["Melyik háromjegyű betű?","dzs","dz","zs"],["Melyik írásjel?","?","a","cs"],["Melyik mondat végére illik kérdőjel?","Hol van a füzeted","Megjött a busz","De szép ez a kép"],["Melyik a hosszú magánhangzó?","ű","ü","u"],["Melyik jelenti a magyar nyelvet tanító tanárt?","magyartanár","magyar tanár","magyar-tanár"],["Melyik jelenti a gyermeket?","kisfiú","kis fiú","kis-fiú"],["Mi segít, ha bizonytalan vagy egy szó írásában?","Helyesírási szótár","Órarend","Térkép"],["Melyik segít a helyesírás megtanulásában?","Olvasás és gyakorlás","A szabályok mellőzése","A találgatás"],["Melyik helyesen írt szó?","barátság","baráccság","barátsák"]]],[["A **képírás** rajzokkal közöl üzenetet. A képjelet piktogramnak nevezzük. A sumerek **ékírása** ék alakú jeleket használt. Az egyiptomi **hieroglifák** szavakat, szótagokat és hangokat is jelöltek. A kínai írás jelei szavakat vagy szóelemeket is jelölnek. A japán írásban szótagjelölő jelek is vannak. A föníciai ábécé 22 jele mássalhangzókat jelölt. A görög, latin és cirill ábécé története ehhez kapcsolódik. A magyar **rovásírás** jobbról balra halad.","A **képírás** képekkel üzen. A sumerek ékírást használtak. Az egyiptomiak hieroglifákkal írtak. A föníciaiak ábécéje 22 jelből állt. Ma latin betűkkel írunk. A **rovásírás** jobbról balra halad.","A **képírás** rajzokkal üzen. Az **ábécé** betűkből áll. Magyarul latin betűkkel írunk. A rovásírás jobbról balra halad."],"☀️ = nap, 🌙 = hold. Ezek mai képi jelek, nem eredeti ókori írásjelek.",[["Melyik nép alkotta meg az ékírást?","Sumerek","Rómaiak","Görögök"],["Mit jelölhettek a hieroglifák?","Szavakat, szótagokat és hangokat","Csak számokat","Csak állatokat"],["Hány jele volt a föníciai ábécének?","22","40","44"],["Melyik irányban halad a magyar rovásírás?","Jobbról balra","Alulról felfelé","Balról jobbra"],["Melyik ábécét használjuk magyarul?","Latin alapút","Cirillt","Görögöt"]]],[["A magyar szavak írásához **40 betűt** használunk. A teljes ábécé 44 betűs: a q, w, x, y is szerepel benne. A **kétjegyű betűk**: cs, dz, gy, ly, ny, sz, ty, zs. A dzs háromjegyű. A betűrendben az első eltérő betű dönt. A kis- és nagybetű azonos értékű. Az egyjegyű betű megelőzi a vele kezdődő többjegyűt. A kettőzött betűket két betűként vesszük figyelembe. A rövid és hosszú magánhangzók azonos értékűek, de ha csak a hosszúság tér el, a rövid kerül előre. A szóhatárokat nem vesszük figyelembe.","A **magyar ábécé** 40 betűből áll. A teljes ábécé 44 betűs. A cs és a gy kétjegyű. A dzs háromjegyű. **Betűrendben** az első eltérő betű dönt. A c megelőzi a cs betűt. Az a és á azonos értékű, de azonos szavaknál a rövid kerül előre.","Az **ábécé** betűk sorrendje. Az a előbb van, mint a b. A c előbb van, mint a cs. A cs egy betű. A dzs is egy betű."],"alma – barack – citrom – csiga. A c a cs előtt áll.",[["Melyik a helyes betűrend?","cica – csiga – dió","csiga – cica – dió","dió – cica – csiga"],["Melyik kerül előre?","akar","akár","Mindegy"],["Melyik a helyes sorrend?","álom – alul","alul – álom","Mindegy"],["Hány betűs a teljes magyar ábécé?","44","40","26"],["Melyik a helyes sorrend?","kopog – koppan","koppan – kopog","Mindegy"],["Melyik a helyes sorrend?","túzok – tyúk","tyúk – túzok","Mindegy"]]],[["A szóban annyi **szótag** van, ahány magánhangzó. A magánhangzó önálló szótag is lehet. Egyszerű szavaknál a szótaghatáron választunk el. Két magánhangzó közötti egy mássalhangzó a következő szótagba kerül. Több mássalhangzó közül csak az utolsó kerül át. A kettőzött többjegyű betűt teljes alakban írjuk ki: hosz-szú. A régies családnévi betűk írásjegyeit nem bontjuk szét. Az idegen szavakat kiejtés szerint választjuk el. Az **összetett szavakat** az összetételi határon választjuk el: vas-út. Az igekötő határán is elválaszthatunk: el-ered.","Annyi **szótag** van, ahány magánhangzó. Például: ci-ca. A ny egy betű, nem bontjuk szét: a-nya. A hosszú sz elválasztva: hosz-szú. Az összetett szó határán is elválasztunk: vas-út.","Tapsolj minden **szótagra**! Ci-ca: két szótag. Al-ma: két szótag. Ba-nán: két szótag. A ny együtt marad: a-nya."],"alma → al-ma; banán → ba-nán; hosszú → hosz-szú; vasút → vas-út.",[["Hogyan választjuk el a hosszú szót?","hosz-szú","hoss-zú","ho-sszú"],["Melyik a helyes elválasztás az összetételi határon?","vas-út","va-sút","v-asút"],["Melyik helyes?","a-nya","an-ya","any-a"],["Melyik helyes?","Szé-che-nyi","Széc-he-nyi","Széch-enyi"],["Hány szótagú a rádió?","Három","Kettő","Négy"]]],[["A **levél** megszólítással kezdődik. A levél tartalmát bekezdésekre tagoljuk. A megszólítás illeszkedik a címzetthez. A végén levélzáró fordulat, elköszönés és aláírás áll. A **keltezés** megadja a helyet és az időt. A dátumban az év és a nap után pont áll. A hónap kiírható, rövidíthető vagy számmal jelölhető. Névutó előtt és birtokviszonyban az évszám után nincs pont. A toldalékot kötőjellel kapcsoljuk: 2026-ban, május 5-én. Az utóirat jele: Ui.","A **levél** részei: megszólítás, tartalom, elköszönés, aláírás, keltezés. A dátumban az év és a nap után pont áll. A hónapot kiírhatjuk. Toldalék előtt kötőjelet írunk: 2026-ban.","A levelet **megszólítással** kezdjük. A végén elköszönünk és aláírjuk. A **dátum** megmutatja, mikor írtuk."],"Kedves Bence! Szombaton kirándulni megyünk. Szeretettel: Anna. Kelt: Szeged, 2026. május 5.",[["Melyik a helyes dátum?","2026. május 5.","2026 május 5","2026. május. 5."],["Melyik helyes?","2026-ban","2026.-ban","2026ban"],["Melyik helyes?","május 5-én","május 5.-én","május 5én"],["Melyik helyes?","2026 óta","2026. óta","2026-óta"],["Melyik helyes?","2026 telén","2026. telén","2026-telén"],["Melyik a hónap római számos jelölése?","2026. V. 5.","2026 V 5","2026. V 5"],["Mi az Ui. jelentése?","Utóirat","Új időpont","Üdvözlet"],["Melyik illik hivatalos levélbe?","Tisztelt Igazgató Úr!","Csá, haver!","Hé!"],["Miért tagoljuk a levelet?","Hogy könnyebb legyen követni a gondolatokat.","Hogy hosszabbnak tűnjön.","Hogy ne lehessen elolvasni."]]],[["A **kiejtés elve** szerint a helyes kiejtést követjük az írásban. A főnevek végén az ó és ő hosszú. A melléknevek végén az ú és ű hosszú: hosszú, gyönyörű. A főnevek végén az ú és ű általában hosszú, de vannak kivételek: kapu, falu, áru, eskü, menü. A szóvégi i általában rövid: kicsi. Kivételek: sí, rí, gyí. Az alakőrző szavak megtartják hosszú magánhangzójukat: szív, szíves. Az alakváltoztató szavak egyes toldalékok előtt rövidülnek: víz, vizet. Az a és e gyakran megnyúlik toldalék előtt: alma, almát. A hang hosszúsága jelentést is változtathat: hal, hall.","A **kiejtés elve** szerint a helyes kiejtést követjük. A hajó és az erdő végén hosszú a magánhangzó. A hosszú és a gyönyörű végén is hosszú. Kivételek: falu, kapu, menü. Figyeld a szó változását: víz – vizet, szív – szíves. A hal és a hall mást jelent.","Figyeld a **rövid és hosszú hangokat**! Hajó, erdő: hosszú a szó vége. Kapu, falu: rövid u. A hal állat. A hall azt jelenti, hogy érzékeli a hangot."],"A hal a vízben úszik. Anna zenét hall. A víz hideg. Vizet iszom.",[["Melyik helyes?","gyönyörű","gyönyörü","gyönyörú"],["Melyik helyes?","savanyúság","savanyuság","savanyússág"],["Melyik kivétel a szóvégi hosszú ú szabálya alól?","kapu","borjú","tanú"],["Melyik helyes?","hegedül","hegedűl","hegedüll"],["Melyik helyes?","vizet","vízet","vizzet"],["Melyik alak őrzi a hosszú magánhangzót?","szíves","vizes","tüzes"],["Melyik helyes?","dicsér","dícsér","dicsérr"],["Melyik illik ide: A madár a levegőben ...?","száll","szál","szálll"],["Melyik helyes?","huszonegy","húszonegy","huszonnegy"],["Melyik helyes?","almát","almat","allmát"]]],[["A **szövegszerkesztés** a mondanivaló megtervezése és elrendezése. Először válassz témát, célt és gondolj az olvasóra. Az **anyaggyűjtés** során olvass, figyelj meg, kérdezz és jegyzetelj. Ellenőrizd a források hitelességét. Jegyezd fel a szerzőt, címet, kiadót, évet és oldalszámot. A **gondolattérkép** összekapcsolja az ötleteket. A **vázlat** rendszerezi őket. A tételmondat a bekezdés lényegét foglalja össze. A címszavas vázlat kulcsszavakból áll. A jó vázlat pontos, arányos és áttekinthető.","Először válassz **témát**. Gyűjts hozzá információkat. Ellenőrizd a forrásokat. Írd le a fontos gondolatokat. A **vázlat** segít sorrendbe tenni őket. A **tételmondat** a bekezdés lényegét mondja el.","Válassz **témát**! Gyűjts ötleteket! Írd le a fontos szavakat! A **vázlat** segít a sorrendben."],"Téma: A mókus. Szöveg: A mókus ügyesen mászik a fákra. Magvakat és diót is eszik. Télre táplálékot gyűjt. Vázlat: mozgás – táplálék – téli készülődés.",[["Mi az anyaggyűjtés célja?","A témához tartozó információk összegyűjtése","A szöveg díszítése","A betűk megszámolása"],["Miért ellenőrizzük az internetes forrásokat?","Lehetnek pontatlanok.","Mindig hibátlanok.","Csak a címük fontos."],["Mi a tételmondat?","A bekezdés lényegét összefoglaló mondat","Az utolsó szó","A szöveg címe minden esetben"],["Melyik a jó címszavas vázlat?","mozgás – táplálék – téli készülődés","mókus – füzet – ceruza","ügyesen – is – a"],["Mit jegyezz fel egy könyv forrásadataiból?","Szerző, cím, kiadó, év, oldalszám","A borító színe","A könyv tömege"],["Mi a gondolattérkép szerepe?","Az ötletek kapcsolatainak ábrázolása","A helyesírási hibák eltüntetése","A mondatok véletlen keverése"],["Melyik a tervezés része?","A cél és az olvasó meghatározása","Minden forrás szó szerinti másolása","A téma figyelmen kívül hagyása"]]],[["A **szóelemzés elve** szerint a szóelemek eredeti alakját felismerhetően írjuk le. A kiejtés eltérhet az írástól: barát + ság = barátság. Az összetett szavak tagjait is megőrizzük: vas + út = vasút. Az együtt szóban egy gy betűt írunk. A kisebbség szóban egy s betűt írunk a két b után. A h végű szavakban a h-t akkor is jelöljük, ha nem ejtjük: méh, méhtől. Egyes alakok kétféleképpen helyesek: méhvel és méhhel. Bizonyos felszólító alakokban a kiejtés változását jelöljük: fut + j = fuss. Az e-mailben is ügyelj a helyesírásra és az udvarias megszólításra.","A **szóelemzés** segít felismerni a szó részeit. Barát + ság = barátság. Kert + ben = kertben. A szó részeit akkor is megőrizzük, ha másképp halljuk. A méh szó végén leírjuk a h-t. A fuss szó felszólító alak.","A szavaknak **részei** vannak. Kert + ben = kertben. Barát + ság = barátság. Figyeld meg a szó részeit!"],"ad + ja = adja; barát + ság = barátság; vas + út = vasút.",[["Melyik helyes?","barátság","baráccság","barátsák"],["Melyik helyes?","adja","aggya","adlya"],["Melyik helyes?","egyetlen","eggyetlen","egyetleny"],["Melyik helyes?","kisebbség","kisebbsség","kissebbség"],["Melyik helyes?","méhtől","métől","méhttől"],["Melyik két alak egyaránt helyes?","méhvel és méhhel","mével és méhel","méhvel és mével"],["Melyik a fut ige felszólító alakja?","fuss","futj","futs"],["Melyik szóelemekből áll a hallhatatlan?","hall + hat + atlan","hal + hat + atlan","hall + hatatlan + ság"],["Melyik helyes?","díszszemle","dísszemle","díszemle"],["Melyik illik az udvarias e-mailbe?","Kedves Tanárnő!","Hé, te!","Add ide!"]]],[["A **hagyomány elve** őrzi a régies családnevek írását. Például Móricz Zsigmond és Kossuth Lajos. A j és az ly ma ugyanazt a hangot jelöli. Az ly-os szavak írását meg kell jegyeznünk. Az **egyszerűsítés elve** szerint toldalékoláskor három egyforma mássalhangzó helyett általában kettőt írunk. Például toll + val = tollal. A hosszú többjegyű mássalhangzóknak csak az első írásjegyét kettőzzük meg. Például meggy + vel = meggyel. Kivétel a kettőzött mássalhangzóra végződő tulajdonnevek és az összetételek határa. Például Kiss-sel, sakk-kör, jegygyűrű.","A **hagyomány** megőrzi a régi nevek és az ly-os szavak írását. Például Móricz, sólyom. Az **egyszerűsítés** miatt toll + val = tollal. Meggy + vel = meggyel. A neveknél és az összetételek határán figyelj a kivételekre: Kiss-sel, sakk-kör.","A j és az ly ugyanazt a hangot jelöli. Az **ly-os szavakat** jegyezd meg! Például sólyom, lyuk. **Egyszerűsítés:** toll + val = tollal. Három l helyett két l-t írunk."],"🦅 sólyom – 🧀 sajt – toll + val = tollal – Kiss + vel = Kiss-sel.",[["Miért írjuk a király szót ly-nal?","A hagyomány miatt.","Mert két hangot ejtünk.","Mert a szó többes számú."],["Melyik családnév őriz régies írásmódot?","Móricz","Nagy","Farkas"],["Melyik szó helyes?","bojtár","bolytár","bojtárr"],["Melyik szó helyes?","sólyom","sójom","sóllyom"],["Melyik helyes? (toll + val)","tollal","tolllal","toll-lal"],["Melyik helyes? (meggy + vel)","meggyel","megygyel","meggyvel"],["Melyik helyes? (Kiss családnév + -vel)","Kiss-sel","Kissel","Kisssel"],["Melyik helyes? (sakk + kör)","sakk-kör","sakkör","sakkkör"],["Melyik helyes? (jegy + gyűrű)","jegygyűrű","jeggyűrű","jeggygyűrű"],["Melyik elv szerint írjuk a hosszú sz hangot a hosszú szóban?","Egyszerűsítés","Hagyomány","Szóelemzés"]]],[["A jó **cím** rövid, érdekes és kapcsolódik a tartalomhoz. A **bevezetés** előkészíti a témát. Bemutathatja a szereplőket, az időt és a helyszínt. A **tárgyalás** fejti ki a témát vagy az eseményeket. A **befejezés** lezárja a szöveget. Tartalmazhat véleményt, tanulságot. A **vázlat** a fő gondolatokat foglalja össze. A nyelvhelyességhez a szavak pontos és a helyzethez illő használata is hozzátartozik. Én olvasnék, ők olvasnák a könyvet.","A **cím** utal a témára. A **bevezetés** elindítja a történetet. A **tárgyalás** elmondja, mi történt. A **befejezés** lezárja a történetet. A vázlatban csak a lényeget írjuk le.","A történetnek három része van. **Bevezetés:** hol és kivel? **Tárgyalás:** mi történt? **Befejezés:** hogyan ért véget? A cím a történethez illik."],"Cím: Az elveszett sapka. Bevezetés: Reggel a buszmegállóba siettem. Tárgyalás: Észrevettem, hogy eltűnt a sapkám. Visszamentem, és a kapunál megtaláltam. Befejezés: Megkönnyebbültem.",[["Melyik cím illik egy elázott kirándulás történetéhez?","A váratlan zápor","Az erdő növényvilága","Az iskolai órarend"],["Mire szolgál a bevezetés?","Előkészíti a témát, bemutatja a kiinduló helyzetet.","Részletesen kifejti az összes eseményt.","Levonja a tanulságot."],["Melyik részben bontjuk ki az eseményeket?","Tárgyalás","Bevezetés","Befejezés"],["Melyik jó befejezés egy segítségnyújtásról szóló történethez?","Megértettem, milyen sokat jelenthet egy apró segítség.","Kora reggel indultunk el.","A második kanyar után megálltunk."],["Melyik mondat illik egy ismeretterjesztő szöveg elejére?","A sün alkonyat után indul táplálékot keresni.","Egyszer volt, hol nem volt, volt egy sün.","Hát képzeld, milyen vicces volt a sün!"],["Egészítsd ki: Én most szívesen … egy mesét.","olvasnék","olvasnák","olvasnál"],["Egészítsd ki: Ők is … ezt a mesét, ha volna idejük.","elolvasnák","elolvasnék","elolvasnál"],["Milyen a jó vázlat?","Rövid, pontos, a lényegre figyel.","Minden mondatot változatlanul tartalmaz.","A részleteket véletlenszerűen sorolja fel."]]],[["A magyar írás **betűíró és hangjelölő**. A négy helyesírási alapelv segít a szabályok alkalmazásában. **Kiejtés:** ahol lehet, a helyes kiejtést követjük. **Szóelemzés:** a szóelemek alakját felismerhetően megőrizzük. **Hagyomány:** megtartjuk a régies nevek és a j vagy ly hagyományos írásmódját. **Egyszerűsítés:** bizonyos betűkapcsolatokat rövidebben írunk. Figyelj a kivételekre is! Egy szó írásában több alapelv is érvényesülhet.","Négy **helyesírási alapelv** van. Kiejtés: figyelj a hangokra! Szóelemzés: keresd a szó részeit! Hagyomány: jegyezd meg a j és ly írását, a régi neveket! Egyszerűsítés: például sakk + vá = sakká.","**Kiejtés:** szúnyog. **Szóelemzés:** dob + ta = dobta. **Hagyomány:** erkély. **Egyszerűsítés:** sakk + vá = sakká. Figyeld meg a példákat!"],"Kiejtés: derűs. Szóelemzés: fogja. Hagyomány: páholy. Egyszerűsítés: füttyel.",[["A szót a kiejtés szerint írjuk. Melyik helyes?","szúnyog","szunyog","szúnnyog"],["A szót a kiejtés szerint írjuk. Melyik helyes?","sűrűség","sürüség","sűrüség"],["Melyik szó helyes?","derűs","derüs","derűss"],["Melyik alak helyes? A kerekek mozognak a … .","sínen","sinen","sínnen"],["Melyik helyes? fog + ja","fogja","foggya","fogyja"],["Melyik helyes? út + jelző","útjelző","úttyelző","út-tyelző"],["Melyik helyes? dob + ta","dobta","dopta","dobtta"],["Melyik helyes? fog + ság","fogság","fokság","fogg ság"],["Melyik helyes? A virágok illatától … lesz a kert.","bájos","bályos","bájjos"],["Melyik helyes? A ház oldalából kiugró, korlátos rész.","erkély","erkéj","erkélly"],["Melyik helyes? A színház emeleti ülőhelye.","páholy","páhoj","páholly"],["Melyik helyes? A vízen úszó jelzőeszköz.","bója","bólya","bójja"],["Melyik helyes? (fütty + vel)","füttyel","fütytyel","füttyvel"],["Melyik helyes? (sakk + vá)","sakká","sakkká","sakk-ká"],["Melyik helyes? (balett + tanár)","balett-tanár","balettanár","baletttanár"],["Melyik helyes? (Bernadett + től)","Bernadett-től","Bernadettől","Bernadetttől"]]],[["Az **állandósult szókapcsolat** több szóból álló, megszokott alakú kifejezés. Ilyen a társalgási fordulat és a közhely is. A **szólás** képszerű kifejezés. Jelentése gyakran átvitt: két legyet üt egy csapásra. A **szóláshasonlat** összehasonlítást tartalmaz. A **közmondás** általános tapasztalatot vagy tanácsot fogalmaz meg. A közmondásként idézett felszólító alakú mondat végére is pont kerülhet az általános tanács miatt. A **szállóige** ismert irodalmi, történelmi vagy más forrásból elterjedt idézet. A **közhely** elcsépelt fordulat.","A **szólás** képszerű kifejezés. Például: lógatja az orrát. Ez azt jelenti, hogy szomorú. A **szóláshasonlat** összehasonlít: lassú, mint a csiga. A **közmondás** tanácsot vagy tapasztalatot közöl. A **szállóige** ismert idézet. A köszönés is lehet állandósult fordulat.","A **szólás** jelentését nem mindig szó szerint értjük. Lógatja az orrát = szomorú. A **szóláshasonlat** összehasonlít. Lassú, mint a csiga. A **közmondás** tanácsot ad. A **szállóige** ismert idézet."],"🐌 Lassú, mint a csiga. 💡 Két legyet üt egy csapásra = egy tettével két célt ér el.",[["Mi az állandósult szókapcsolat?","Rendszerint megszokott alakban használt több szóból álló kifejezés.","Bármilyen véletlenül egymás mellé írt két szó.","Egyetlen betűből álló jel."],["Mit jelent: kardoskodik valami mellett?","Kitartóan védi az álláspontját.","Kardot készít.","Megváltoztatja a véleményét."],["Melyik szólás?","Falra hányt borsó.","Amit ma megtehetsz, ne halaszd holnapra.","Jó utat kívánok!"],["Melyik közmondás?","Nem mind arany, ami fénylik.","Szívébe zár.","Légy szíves!"],["Melyik közmondás illik ahhoz, aki a látszat alapján ítél?","Nem mind arany, ami fénylik.","Aki mer, az nyer.","Gyakorlat teszi a mestert."],["Mit jelent: olaj a tűzre?","Olyasmi, ami tovább súlyosbít egy konfliktust.","Olyasmi, ami megold egy vitát.","Olyasmi, ami megszünteti a veszélyt."],["Melyik kifejezés szóláshasonlat?","Ravasz, mint a róka.","Félvállról veszi.","Türelem rózsát terem."],["Mi különbözteti meg a közmondást a szólástól?","A közmondás általános tapasztalatot vagy tanácsot fejez ki.","A közmondás sosem áll mondatból.","A szólás mindig idézet egy könyvből."],["Melyik szállóige származik Madách Imre Az ember tragédiája című művéből?","Ember, küzdj és bízva bízzál!","Talpra magyar, hí a haza!","Gondolkodom, tehát vagyok."],["Mi a közhely?","Elcsépelt, túl gyakran használt fordulat.","Minden régi közmondás.","Minden idézet."],["Mit jelent: két legyet üt egy csapásra?","Egy cselekvéssel két célt ér el.","Két feladatot félbehagy.","Két hibát követ el."],["Melyik közmondás végére kerül pont az általános tanácsot kifejező felszólító alak ellenére?","Amit ma megtehetsz, ne halaszd holnapra.","Csukd be az ajtót!","Hozd ide a füzetet!"]]],[["A **könyvtár** dokumentumokat gyűjt, rendez és hozzáférhetővé tesz. Lehet iskolai, települési, egyetemi vagy szakkönyvtár. A **katalógus** megmutatja a gyűjtemény adatait. A **raktári jelzet** segít megtalálni a könyvet. A **szabadpolcon** közvetlenül kereshetünk. Az olvasójegy a könyvtári tagsághoz kapcsolódik. A szótár szavakról, a lexikon és az enciklopédia ismeretekről tájékoztat. A kereséskor jegyezd fel a szerzőt, címet és a forrást. Ellenőrizd, megbízható-e az információ.","A **könyvtárban** könyveket és más dokumentumokat találunk. A **katalógusban** keresünk. A **raktári jelzet** megmutatja, hol keressük a könyvet. A szótár a szavakhoz, az enciklopédia a témákhoz ad segítséget. Jegyezd fel, honnan származik az információ!","A **könyvtáros** segít keresni. A **katalógus** a könyvek adatait mutatja. A **jelzet** segít megtalálni a könyvet. A szótárban szavakat keresünk."],"Példa: A vidám szó rokon értelmű párját a szinonimaszótárban keresem. A könyv címét megkeresem a katalógusban, majd a jelzet alapján a polcon.",[["Melyik adat segít a könyv pontos azonosításában?","Szerző, cím, kiadási adatok","A polc színe és a kölcsönző életkora","Csak a könyv mérete"],["Mi különbözteti meg az olvasójegyet a könyvjelzőtől?","Az olvasójegy a tagsághoz, a könyvjelző az olvasás helyéhez kapcsolódik.","Mindkettő a könyv helyét jelzi a polcon.","Mindkettő a könyv árát mutatja."],["Mi a szabadpolc?","Az olvasó közvetlenül válogathat a polcon lévő könyvekből.","Bármely könyvet örökre elvihetünk.","A könyvtár üres raktára."],["Melyik dokumentumtípus is előfordulhat könyvtárban?","Hangfelvétel és elektronikus dokumentum","Kizárólag nyomtatott könyv","Kizárólag kézirat"],["Melyik forrás célszerű a madarak életmódjáról szóló előadáshoz?","Természettudományos enciklopédia","Helyesírási szabályzat","Szinonimaszótár"],["Mit ellenőrzöl, amikor két forrás eltérő adatot közöl?","A szerzőt, kiadót, dátumot és az állítás alapját.","A hosszabb szöveget automatikusan igaznak veszem.","A színesebb borítót választom."],["Melyik forrásban keresed a cikkely szó jelentését?","Értelmező szótárban","Verseskötetben","Történelmi atlaszban"],["Melyik forrásban keresed a cikkely szó helyes írásmódját?","Helyesírási szótárban","Népmesegyűjteményben","Földrajzi lexikonban"],["Miért jegyezzük fel az adat forrását?","Hogy visszakereshető és ellenőrizhető legyen.","Hogy hosszabb legyen a vázlat.","Hogy ne kelljen elolvasni a szöveget."],["Melyik a helyes keresési sorrend?","Téma meghatározása, katalógusban keresés, találat kiválasztása, könyv megkeresése.","Kölcsönzés, találat keresése, téma választása.","Polc véletlen kiválasztása, könyv elvitele, téma keresése."]]],[["A szólásokat és közmondásokat **a helyzethez illően** használjuk. A szólás jelentését gyakran átvitt értelemben kell megérteni. Az állandósult szókapcsolatok megszokott alakját megőrizzük. A **történet** eseményei kapcsolódjanak a közmondás tanulságához. A jó fogalmazásnak van eleje, közepe és vége. Ha egy közmondást választasz címnek, a történet mutassa meg a jelentését. A befejezésben fogalmazd meg a tanulságot.","A **szólás** illeszkedjen a történethez. Ne cseréld fel a szólás szavait! A **közmondás** lehet a történet címe vagy tanulsága. Az eseményeket érthető sorrendben mondd el.","Figyeld meg, mit jelent a **szólás**! Válaszd a történethez illő mondást! A történetnek legyen eleje, közepe és vége."],"Példa: Áron és barátai külön-külön nem tudták elmozdítani a padot. Együtt sikerült. Sok lúd disznót győz.",[["Zsófi egyszerre vitt könyvet a könyvtárba és vásárolt kenyeret. Melyik szólás illik ide?","Két legyet ütött egy csapásra.","Falra hányt borsó volt.","Olajat öntött a tűzre."],["Melyik közmondás illik ahhoz, aki bonyolult feladatot kisebb lépésekben old meg?","Sok kicsi sokra megy.","Nem mind arany, ami fénylik.","Aki másnak vermet ás, maga esik bele."],["Melyik szólás állandósult alakja helyes?","Köti az ebet a karóhoz.","Köti a macskát a karóhoz.","Köti az ebet az asztalhoz."],["Melyik a legjobb cím egy történethez, amelyben a türelmes gyakorlás meghozza az eredményt?","Gyakorlat teszi a mestert.","A szép csomagolás.","A váratlan találkozás."],["A társak vitatkoznak. Ákos gúnyos megjegyzése még nagyobb vitát okoz. Mit tett?","Olajat öntött a tűzre.","Fején találta a szöget.","Egy cipőben járt velük."],["Mi a baj ezzel a mondattal: Bori a győzelme után lógatta az orrát, mert nagyon örült?","A szólás jelentése ellentmond a helyzetnek.","A mondatban nincs állítmány.","A mondat nem tartalmaz személynevet."],["Melyik javítás őrzi meg Bori örömét?","Bori a győzelem után majd kibújt a bőréből.","Bori a győzelem után félvállról vette.","Bori a győzelem után felkötötte a nyúlcipőt."],["Melyik a történet logikus lezárása? Három barát közösen épített madáretetőt.","Rájöttek, hogy együtt könnyebb dolgozni.","Először megkeresték a szerszámokat.","A munka közben fát fűrészeltek."],["Melyik szókapcsolat fejez ki pontos felismerést?","Fején találja a szöget.","Félvállról veszi.","Köti az ebet a karóhoz."],["Melyik mondat használja átvitt értelemben a kifejezést?","A hír hallatán nagy kő esett le a szívéről.","A kő legurult a hegyről.","A kertben egy nagy kő hevert."],["Melyik közmondás mondanivalója illik a látszat alapján való téves ítélethez?","Nem mind arany, ami fénylik.","Ki korán kel, aranyat lel.","Gyakorlat teszi a mestert."],["Mitől jó egy közmondással záruló történet?","Az eseményekből érthetően következik a tanulság.","A közmondás akkor is belekerül, ha nem kapcsolódik a történethez.","A történet minden mondata közmondás."]]],[["Az **elbeszélés** történetet mond el. Bemutatja a szereplőket, a helyszínt és az események idejét. A cselekményt általában időrendben mutatjuk be. Saját élményt gyakran egyes szám első személyben, mások történetét egyes szám harmadik személyben mondunk el. A **dialógus** párbeszéd, a **monológ** egy szereplő hosszabb önálló megszólalása. A **bevezetés** megteremti a kiinduló helyzetet. A **tárgyalás** kibontja az eseményeket. A **befejezés** lezárja a történetet. A párhuzamos szerkesztés hasonló vagy ellentétes élményeket állít egymás mellé.","Az **elbeszélés** egy történet. Mondd el, kivel, hol és mikor történt! Rendezd időrendbe az eseményeket! Saját élményedről mondhatod: elindultam. Más történetéről: elindult. A dialógus párbeszéd. A monológ egy szereplő önálló megszólalása.","Az **elbeszélés** történetet mond el. Ki? Hol? Mikor? Mi történt? A történetnek van eleje, közepe és vége. A párbeszédben a szereplők beszélgetnek."],"Szombat reggel a kertben voltam. Egy kismadár berepült a fészerbe. Kinyitottam az ajtót, és a madár kirepült. Megkönnyebbültem.",[["Mi az elbeszélés fő jellemzője?","Eseményeket, cselekményt mond el.","Csak egy tárgy tulajdonságait sorolja fel.","Kizárólag egy személy külső jegyeit mutatja be."],["Melyik mondat segít a bevezetésben tájékozódni?","Szombat délelőtt a testvéremmel a tóhoz mentem.","Megértettem, hogy figyelmesebbnek kell lennem.","Hirtelen kiszakadt a táskám."],["Melyik részben bontjuk ki a cselekményt?","Tárgyalás","Cím","Befejezés"],["Melyik mondat alkalmas lezárásnak?","Azóta mindig előre megnézem a menetrendet.","A buszmegálló mellett találkoztunk.","A busz késett tíz percet."],["Alakítsd át harmadik személybe: Megpillantottam a mókust.","Megpillantotta a mókust.","Megpillantottad a mókust.","Megpillantottuk a mókust."],["Alakítsd át első személybe: Bálint elolvasta a levelet.","Elolvastam a levelet.","Elolvastad a levelet.","Elolvasta a levelet."],["Melyik példában szerepel párbeszéd?","– Megtaláltad? – Igen, itt van.","A fiú sokáig gondolkodott.","A lány egyedül mesélt az élményeiről."],["Melyik példa monológ?","A szereplő egyedül elmondja, mitől tart és mit remél.","Két barát kérdez és felel.","Az elbeszélő felsorolja a helyszíneket."],["Melyik mondat mutat párhuzamos szerkesztést?","Tavaly siettünk és eltévedtünk, idén térképpel készültünk.","A térkép a táskámban volt.","A kirándulás délben ért véget."],["Mire jó a párbeszéd az elbeszélésben?","Életszerűbbé teszi a szereplők közötti kapcsolatot.","Minden esetben helyettesíti a befejezést.","Megszünteti az események sorrendjét."],["Melyik mondat illik a történetbe, ha az elbeszélő megijedt?","A váratlan zajra összerezzentem.","A táskám kék színű volt.","A falon három kép függött."],["Miért készítünk vázlatot az elbeszélés előtt?","Hogy megtervezzük a szereplőket, helyszínt és eseményeket.","Hogy ne kelljen összefüggő szöveget írni.","Hogy a történetből kimaradjon a befejezés."]]],[["A **leírás** tárgyat, élőlényt, helyszínt vagy tájat mutat be. A **tulajdonságokat** pontos szavakkal fejezzük ki. Figyelj a színekre, alakokra, hangokra és más érzékelhető részletekre. Használj kifejező igéket: magasodik, kanyarog, csillog. A **térbeli sorrend** segít követni a látványt. Haladhatsz közelről távolra, távolról közelre vagy az egésztől a részletek felé.","A **leírás** megmutatja, milyen valami. Használj pontos szavakat a színére, alakjára és méretére! Haladj választott sorrendben, például közelről távolra.","A **leírás** megmutatja, milyen egy tárgy, állat vagy hely. Milyen a színe? Milyen az alakja? Hol van? Figyeld meg a részleteket!"],"A pad előtt apró virágok nyílnak. Mögötte keskeny patak csillog. A távolban zöld domb magasodik.",[["Mit mutat be a leírás?","Egy dolog tulajdonságait.","Események időrendjét.","Egy levél címzettjét."],["Melyik szó jelöl színt?","aranybarna","keskeny","érdes"],["Melyik szó jelöl alakot?","kerek","zöld","illatos"],["Melyik mondat leíró?","A tó partján magas nádas húzódik.","Tegnap a tóhoz mentünk.","Holnap indulunk a tóhoz."],["Melyik szó fejezi ki pontosabban egy torony látványát?","magasodik","van","történik"],["Melyik sorrend halad közelről távolra?","A lábam előtt a fű, mögötte a tó, a távolban a hegy.","A távoli hegy, majd a tó, végül a lábam előtt a fű.","A tó, a lábam előtt a fű, majd a hegy."],["Melyik mondat utal hangra?","A patak halkan csobog.","A patak vize átlátszó.","A patak vize hideg."],["Melyik mondat utal tapintásra?","A kő felülete érdes.","A kő szürke.","A kő a pad mellett hever."],["Melyik a legpontosabb színleírás?","A levél széle rozsdabarna.","A levél szép.","A levél érdekes."],["Melyik szó illik a keskeny ösvényhez?","kanyarog","magasodik","kolompol"],["Mi a térbeli sorrend célja?","Segít elképzelni a részletek helyét.","Megadja az események dátumát.","Megmutatja a szereplők életkorát."],["Melyik mondat mutatja be először az egész tárgyat?","A hátizsák kicsi, téglalap alakú.","A bal oldali zseb cipzárja fekete.","A vállpánt csatja ezüstszínű."],["Melyik leírás tárgyilagos?","A doboz 20 cm széles, fedele kék.","Ez a világ legszebb doboza.","Nagyon szeretem ezt a dobozt."],["Melyik szó jelöl hangulatot?","barátságos","háromszögletű","kétszintes"]]],[["Az **állandósult szókapcsolatok** közé tartoznak a társalgási fordulatok, a szólások, a szóláshasonlatok, a közmondások és a szállóigék. Az **elbeszélés** eseményeket mond el, általában időrendben. A **leírás** tulajdonságokat mutat be, gyakran térbeli sorrendben. A **jellemzés** egy személy külső és belső tulajdonságait tárja fel. A szöveg megalkotását vázlattal készítjük elő. A könyvtárban a katalógus és a megfelelő segédkönyv segíti az információkeresést.","A **szólás** képszerű kifejezés, a **közmondás** tapasztalat vagy tanács. Az elbeszélés történetet mond el. A leírás megmutatja, milyen valami. A jellemzés személyt mutat be. A szöveg előtt készíts vázlatot!","**Elbeszélés:** mi történt? **Leírás:** milyen valami? **Jellemzés:** milyen valaki? A közmondás tanácsot ad. A szólás gyakran képszerűen fejez ki valamit."],"Elbeszélés: Elmentem a tóhoz. Leírás: A tó vize zöldeskék. Jellemzés: A barátom figyelmes és türelmes.",[["Melyik társalgási fordulat?","Jó utat kívánok!","Köti az ebet a karóhoz.","Türelem rózsát terem."],["Melyik szólás fejezi ki a nagy örömöt?","Majd kibújik a bőréből.","Lógatja az orrát.","Félvállról veszi."],["Melyik szóláshasonlat?","Szelíd, mint a bárány.","Sok kicsi sokra megy.","Viszontlátásra!"],["Melyik közmondás illik a türelmes várakozáshoz?","Türelem rózsát terem.","Aki mer, az nyer.","Nem mind arany, ami fénylik."],["Melyik szállóige irodalmi idézet?","Ember, küzdj és bízva bízzál!","Jó étvágyat!","Félvállról veszi."],["Melyik mondat elbeszélő?","Délután átmentem a barátomhoz.","A kertben magas fenyők állnak.","A pad felszíne érdes."],["Melyik mondat leíró?","A ház teteje vörös, az ablaka keskeny.","Tegnap meglátogattuk a nagymamát.","Holnap indulunk a kirándulásra."],["Mi az elbeszélés legfontosabb rendező elve általában?","Az események időrendje.","A betűrend.","A szavak hosszúsága."],["Mi segíti a tájleírás követhetőségét?","A térbeli sorrend.","A szereplők életkora.","Az események dátuma."],["Mi a jellemzés célja?","Egy személy külső és belső tulajdonságainak bemutatása.","Kizárólag a helyszín bemutatása.","Egy tárgy használatának ismertetése."],["Melyik belső tulajdonság?","Kitartó.","Barna hajú.","Magas termetű."],["Melyik külső tulajdonság?","Szeplős.","Bátor.","Türelmes."],["Melyik szótár segít a szóismétlés elkerülésében?","Szinonimaszótár.","Helyesírási szótár.","Idegen szavak szótára."],["Miben keresheted egy könyv raktári jelzetét?","A könyvtári katalógusban.","Egy könyvjelzőn.","Egy olvasási naplóban."],["Mi a jó vázlat feladata?","A fő gondolatok és a sorrend megtervezése.","A teljes szöveg szó szerinti lemásolása.","Csak a cím kiírása."],["Melyik cím illik egy olyan elbeszéléshez, amelyben valaki lekéste a buszt?","Az elszalasztott járat.","A busz műszaki adatai.","A megálló külseje."],["Melyik mondat illik a tárgyalásba?","A dobozban végül megtaláltam a keresett kulcsot.","Szombat reggel minden a szokásosan kezdődött.","Szombat reggel minden a megszokott módon kezdődött."],["Melyik mondat következtet egy tettből belső tulajdonságra?","Lili megosztotta az uzsonnáját, ezért segítőkésznek ismertük meg.","Lili kék pulóvert viselt.","Lili a második padban ült."]]],[["A nyelv egymásra épülő egységeit **nyelvi szinteknek** nevezzük. A **hangokat** kimondjuk és halljuk, írásban betűkkel jelöljük őket. A **szóelemek** közé tartoznak a szótövek és toldalékok: kert + ben. A **szavakból** szószerkezeteket alkothatunk: zöld kert. A szavak és szószerkezetek **mondatokká** rendeződnek. Az összetartozó mondatokból **szöveg** épülhet. A palindrom olyan szó vagy kifejezés, amely megfelelő olvasási szabály szerint visszafelé is ugyanúgy olvasható. Például radar.","A **nyelvi szintek** egymásra épülnek. Hangok → szóelemek → szavak → szószerkezetek → mondatok → szöveg. A szóelem lehet szótő vagy toldalék. Például kert + ben = kertben. A hangot halljuk, a betűt látjuk.","A **hangot** kimondjuk. A hangokból szóelemek és szavak épülnek. Kert + ben = kertben. A szavakból szószerkezetek és mondatok állnak össze. Az összetartozó mondatok szöveget alkothatnak."],"k, e, r, t → kert + ben → kertben → szép kertben → A szép kertben játszunk. → A szép kertben játszunk. Később bemegyünk a házba.",[["Melyik a nyelvi szintek helyes sorrendje a legkisebbtől a legnagyobbig?","Hangok – szóelemek – szavak – szószerkezetek – mondatok – szöveg","Hangok – szavak – szóelemek – mondatok – szószerkezetek – szöveg","Szóelemek – hangok – szavak – szöveg – mondatok – szószerkezetek"],["Melyik tartozik a szóelemek szintjéhez?","-ban","kék ég","A nap süt."],["Melyik a szótő a csónakban szóban?","csónak","csóna","-ban"],["Melyik a toldalék a polcról szóban?","-ról","polc","-cról"],["Melyik a szószerkezet?","széles út","út","Az út széles."],["Melyik példa a szöveg szintjére?","Kinyílt az ajtó. A kutya beszaladt a szobába.","beszaladt","a szobába"],["Mi különbözteti meg a hangot a betűtől?","A hangot ejtjük és halljuk, a betűt írjuk és olvassuk.","A betűt halljuk, a hangot csak írjuk.","Mindkettő kizárólag írásjel."],["Melyik szó áll két szótőből?","hóember","hóban","havas"],["Melyik szó áll szótőből és toldalékból?","asztalon","asztallap","asztal"],["Melyik szó palindrom?","radar","rádió","robot"],["Melyik mondatban szerepel a parkban szó?","Délután a parkban sétáltunk.","Délután a parkba sétáltunk.","A park előtt találkoztunk."],["Miért fontos a szavak sorrendje és a központozás?","Befolyásolhatja a mondat értelmét és hangsúlyát.","Minden sorrend mindig ugyanazt jelenti.","Csak a betűk számát változtatja meg."]]],[["A **fonéma** a nyelv legkisebb jelentésmegkülönböztető hangegysége. Önálló jelentése általában nincs, de cseréje megváltoztathatja a szó jelentését: kar – kár. Az iskolai felosztás szerint a magyarban 39 beszédhang van, a j és ly ugyanazt a hangot jelöli. Beszédkor a levegő a tüdőből a légcsövön át a gégébe, majd a garatba jut. Innen a szájüregen vagy az orrüregen át távozik. A nyelv, az ajkak, a fogak és a szájpadlás alakítják a hangokat. A **zöngés** hangoknál rezegnek a hangszalagok. A **zöngétlen** hangoknál nincs ilyen rezgés. Magánhangzóink zöngések. A mássalhangzók képzésekor zár vagy szűkület alakulhat ki. Az m, n, ny orrhangok.","A **beszédhang** segít megkülönböztetni a szavakat. Például kar – kár. A levegő a tüdőből a légcsövön át a gégébe jut. A szánkon vagy az orrunkon át távozik. A hangszalagok rezgése adja a zöngét. Próbáld ki: zzz és szszsz! A z hangnál érezheted a rezgést. A magánhangzók zöngések.","A **beszédhangokat** a beszélőszerveinkkel képezzük. A levegő a tüdőből indul. A hangszalagok rezeghetnek. Mondd ki: zzz! Most: szszsz! Figyeld meg a különbséget!"],"Tüdő → légcső → gége → garat → szájüreg vagy orrüreg. A z zöngés, az sz zöngétlen.",[["Mi a fonéma?","A nyelv legkisebb jelentésmegkülönböztető hangegysége.","Egy teljes mondat.","A hang írott jele."],["Hány beszédhangot különböztetünk meg az iskolai felosztás szerint a magyarban?","39","40","44"],["Miért nem két külön fonéma a j és a ly?","A mai köznyelvben azonos hangot jelölnek.","Mindkettő magánhangzó.","Azonos betűalakjuk van."],["Melyik párban változik meg a jelentés egyetlen fonéma cseréjével?","tál – táj","tál – tányér","tál – tálak"],["Melyik a levegő útjának helyes sorrendje?","Tüdő – légcső – gége – garat – szájüreg vagy orrüreg.","Szájüreg – tüdő – fogak – gége.","Gége – tüdő – ajkak – légcső."],["Mi történik a zöngés hangok képzésekor?","A hangszalagok rezegnek.","A fogak rezegnek.","A levegő nem áramlik."],["Melyik zöngétlen mássalhangzó?","k","g","b"],["Melyik zöngés mássalhangzó?","v","f","p"],["Melyik három magyar mássalhangzó orrhang?","m, n, ny","b, d, g","sz, s, h"],["Mi jellemző a magánhangzók képzésére?","A szájüregben nincs szűkületből vagy zárból eredő akadály.","A levegő mindig az orron át távozik.","A hangszalagok nem rezegnek."],["Mi a fő különbség a magán- és a mássalhangzók képzése között?","A mássalhangzóknál zár vagy szűkület alakíthatja a levegő útját.","Csak a magánhangzókat halljuk.","Minden mássalhangzó zöngétlen."],["Melyik hangpár különbözik zöngésségében?","f – v","m – n","a – á"]]],[["A magyar nyelvben **14 magánhangzó** van. Képzésükkor a hangszalagok rezegnek, a szájüregben a levegő nem ütközik zárba vagy szűkületbe. Időtartam szerint rövidek: a, e, i, o, ö, u, ü; hosszúak: á, é, í, ó, ő, ú, ű. A nyelv vízszintes helyzete szerint magasak: e, é, i, í, ö, ő, ü, ű; mélyek: a, á, o, ó, u, ú. Ajakműködés szerint **ajakkerekítésesek**: a, o, ó, ö, ő, u, ú, ü, ű; **ajakrésesek**: á, e, é, i, í. Az a–á és e–é párok képzése nemcsak időtartamban tér el.","**14 magánhangzónk** van. Rövidek: a, e, i, o, ö, u, ü. Hosszúak: á, é, í, ó, ő, ú, ű. Magasak: e, é, i, í, ö, ő, ü, ű. Mélyek: a, á, o, ó, u, ú. Figyeld meg az ajkad: az ö kerekített, az é ajakréses.","A **magánhangzókat** akadály nélkül ejtjük. Rövid például az o, hosszú az ó. Magas például az é, mély az a. Figyeld meg a hangokat!"],"öt – őt: a hang hosszúsága megváltoztatja a szó jelentését. A tűz szóban egy hosszú, magas, ajakkerekítéses magánhangzó van.",[["Mi jellemzi a magánhangzók képzését?","A szájüregben nincs a levegő útját elzáró akadály.","Mindig az orron át távozik a levegő.","A hangszalagok sosem rezegnek."],["Melyik a magas magánhangzók teljes sora?","e, é, i, í, ö, ő, ü, ű","a, á, o, ó, u, ú","e, é, i, í, u, ú"],["Melyik a mély magánhangzók teljes sora?","a, á, o, ó, u, ú","a, á, e, é, o, ó","o, ó, ö, ő, u, ú"],["Melyik a rövid magánhangzók teljes sora?","a, e, i, o, ö, u, ü","á, é, í, ó, ő, ú, ű","a, e, í, o, ő, u, ü"],["Melyik párban különbözik csak a magánhangzó időtartama?","öt – őt","kert – kart","tél – dél"],["Melyik hang hosszú, magas és ajakréses?","í","ű","ú"],["Melyik hang rövid, mély és ajakkerekítéses?","o","ö","á"],["Melyik hang hosszú, mély és ajakréses?","á","ó","é"],["Melyik hang rövid, magas és ajakkerekítéses?","ü","i","u"],["Hány magánhangzó van a gyönyörűség szóban?","4","3","5"],["Melyik szóban csak hosszú magánhangzók szerepelnek?","hűtő","füzet","tükör"],["Melyik állítás igaz?","Az a–á és e–é hangpárok képzése az időtartamon kívül is eltér.","Minden rövid és hosszú hangpár csak az időtartamban tér el.","Az á ajakkerekítéses."]]],[["A **hangrend** a szó magánhangzóinak rendje. Magas hangrendű: csak magas magánhangzót tartalmaz (fenyő). Mély hangrendű: csak mélyet (galamb). Vegyes hangrendű: magasat és mélyet is (zsiráf). Az **illeszkedés** során a többalakú toldalék alakja igazodik a szóhoz. Mély: házban. Magas: kertben. A vegyes hangrendű szavak gyakran mély, de olykor magas toldalékot kapnak: papírban, októberben. Összetett szónál az utolsó tag a meghatározó: napfényben, üvegpohárban. Háromalakú toldaléknál az ajakműködés is számít: házhoz, székhez, tükörhöz. Az egyalakú toldalék alakja nem változik: házig, kertig.","**Magas** hangrend: csak magas magánhangzók (körte). **Mély** hangrend: csak mélyek (alma). **Vegyes** hangrend: mindkettő (ceruza). Az illeszkedésnél a toldalék alakját választjuk ki: házban, kertben. A vegyes szavaknál figyelj a megszokott alakra. Összetett szónál az utolsó tag számít.","Alma: mély. Körte: magas. Ceruza: vegyes. A megfelelő toldalékot válaszd: házban, kertben. Ez az **illeszkedés**."],"asztalhoz – székhez – tükörhöz. papírban – októberben. napfényben – üvegpohárban.",[["Milyen hangrendű a szamóca?","Mély","Magas","Vegyes"],["Milyen hangrendű a gyöngyvirág?","Vegyes","Mély","Magas"],["Milyen hangrendű a fenyő?","Magas","Mély","Vegyes"],["Mi a hangrend?","A szó magánhangzóinak magas vagy mély hangok szerinti csoportosítása.","A mássalhangzók zöngéssége.","A betűk ábécébeli sorrendje."],["Melyik illeszkedik helyesen?","papírhoz","papírhez","papírhöz"],["Melyik illeszkedik helyesen?","októberben","októberban","októberbön"],["Melyik alak helyes?","könyvszekrényhez","könyvszekrényhöz","könyvszekrényhoz"],["Melyik alak helyes?","virágcserépben","virágcserépban","virágcserépbön"],["Melyik alak helyes?","üvegpohárból","üvegpohárből","üvegpohárbel"],["Miért háromalakú a -hoz/-hez/-höz toldalék?","Mély, magas ajakréses és magas ajakkerekítéses alakja van.","Három külön jelentése van.","Mindig három szóhoz kapcsolódik."],["Melyik toldalék nem vált alakot a hangrend szerint?","-kor","-ban/-ben","-on/-en/-ön"],["Miért nem mondhatjuk, hogy minden vegyes hangrendű szó mély toldalékot kap?","Vannak magas toldalékot kapó vegyes hangrendű szavak is.","Minden vegyes szó csak magas toldalékot kap.","A vegyes szavakhoz nem járulhat toldalék."]]],[["A **mássalhangzók** képzésekor a levegő útjában zár vagy szűkület alakul ki. Időtartamuk lehet rövid vagy hosszú. A hosszú egyjegyű betűt megkettőzzük: l → ll. A hosszú két- és háromjegyű betű első írásjegyét kettőzzük: ny → nny, dzs → ddzs. Összetételi határon megőrizzük mindkét tag alakját: kulcscsomó. A mássalhangzók zöngések vagy zöngétlenek. A képzés helye szerint a tankönyvi felosztásban ajakhangok, foghangok, szájpadláshangok és gégehang szerepelnek. A képzés módja szerint például zárhangokat, réshangokat és zár-réshangokat különböztetünk meg.","A **mássalhangzó** lehet rövid vagy hosszú, zöngés vagy zöngétlen. A hosszú betűt kettőzzük: l → ll, ny → nny. A b zöngés, a p zöngétlen. A hang képzésében az ajkak, fogak, szájpadlás és gége is részt vehet.","A **mássalhangzó** lehet rövid (l) vagy hosszú (ll). A hosszúságot írásban is jelöljük. Hal: állat. Hall: érzékeli a hangot. A b és p hang különbözik zöngésségében."],"hal – hall; megy – meggy; vér – fér. ny → nny; sz → ssz; dzs → ddzs.",[["Melyik a mássalhangzók négy fő jellemzője?","Időtartam, képzés helye, képzés módja, zöngésség.","Hangrend, illeszkedés, ajakkerekítés, szófaj.","Betűrend, szótagszám, szótő, toldalék."],["Melyik szóban van hosszú kétjegyű mássalhangzó?","hattyú","határ","hatalom"],["Melyik a hosszú dzs helyes írásmódja?","ddzs","dzsdzs","dzzs"],["Melyik pár jelentése különbözik a mássalhangzó időtartama miatt?","megy – meggy","kép – gép","szél – szel"],["Melyik párban az első hang zöngés, a második zöngétlen?","zs – s","t – d","ny – n"],["Melyik zöngés hangnak nincs zöngétlen párja?","r","z","g"],["Melyik zöngétlen hangnak nincs zöngés párja az iskolai felosztás szerint?","h","f","k"],["Melyik sorban csak ajakhangok vannak?","b, p, m, v, f","b, d, g, m, n","p, t, k, h, f"],["Melyik sorban csak szájpadláshangok vannak a tankönyvi felosztás szerint?","g, k, gy, ty, j, ny","d, t, z, sz, r, l","b, p, m, v, f"],["Melyik hang foghang az iskolai felosztás szerint?","d","m","k"],["Melyik a helyes alak?","hallgat","halgat","hallggat"],["Melyik a helyes alak?","kulccsal","kulcscsal","kulcsal"],["Melyik a helyes összetétel?","kulcscsomó","kulccsomó","kulcs-csomó"],["Melyik párban a zöngésség változtatja meg a jelentést?","vér – fér","hal – hall","tál – tél"]]],[["A **szövegértés** során megkeressük az adatokat, összekapcsoljuk őket és következtetünk belőlük. Táblázat olvasásakor figyelj a sorokra, oszlopokra és a jelmagyarázatra. A **kiselőadás** egy témát mutat be a hallgatóságnak. Gyűjts megbízható információkat, válogasd ki a lényeget, készíts vázlatot! Szólítsd meg a hallgatóságot, vezesd be a témát, fejtsd ki, majd foglald össze! A lecke 3–4 perces előadást javasol. A **beszámoló** egy eseményről vagy elvégzett munkáról tájékoztat, szóban vagy írásban. Az élménybeszámoló személyesebb.","A **kiselőadás** egy téma bemutatása. Keress információkat, készíts rövid vázlatot, és gyakorolj! Az előadásnak van bevezetése, tárgyalása és befejezése. A **beszámoló** elmondja, mi történt vagy milyen munkát végeztünk. A táblázatban a sorokat és oszlopokat együtt olvasd!","A **kiselőadásban** bemutatsz egy témát. Először készülj fel! Mondd el érthetően a lényeget! A **beszámolóban** elmondod, mi történt. A táblázat segít megtalálni az adatokat."],"Téma: A kert madarai. Vázlat: 1. Milyen madarakat látunk? 2. Mit esznek? 3. Hogyan figyelhetjük meg őket? A végén összefoglalom a lényeget.",[["Mi különbözteti meg a kiselőadást a beszámolótól?","A kiselőadás egy témát fejt ki, a beszámoló eseményről vagy elvégzett munkáról tájékoztat.","Mindkettő kizárólag személyes élményeket mesél.","A beszámolóban nem lehetnek tények."],["Melyik cím figyelemfelkeltő és témához illő a madarak téli etetéséről?","Vendégek a téli madáretetőnél","A madarak nyári fészkelése","Az erdő növényzete"],["Mi a jó vázlat jellemzője?","Tömör, pontos és logikus.","A teljes szöveg szó szerinti másolata.","Csak egymástól független szavakat tartalmaz."],["Melyik a felkészülés helyes sorrendje?","Téma – adatgyűjtés – válogatás – vázlat – gyakorlás.","Vázlat – előadás – adatgyűjtés – témaválasztás.","Előadás – összegzés – forráskeresés."],["Melyik mondat illik egy kiselőadás bevezetésébe?","Ma azt mutatom be, hogyan készülnek fel a madarak a télre.","Végül összefoglalva három fontos dolgot emelnék ki.","Köszönöm, hogy végighallgattatok."],["Miért célszerű több megbízható forrásból tájékozódni?","Az információkat összevethetjük és ellenőrizhetjük.","Hogy a vázlat minél hosszabb legyen.","Hogy ne kelljen a témát megérteni."],["Melyik információ fontos egy osztályprogramról szóló beszámolóban?","Milyen tevékenységeket végeztek, és mi lett az eredményük.","Milyen színű volt minden résztvevő cipője.","Milyen esemény történhetne tíz év múlva."],["Melyik a megfelelő kiselőadási szokás?","Érthetően beszélek, a vázlat segít a sorrendben.","A képeket magyarázat nélkül mutatom.","Csak a címeket olvasom fel."],["Miért gyakoroljuk hangosan az előadást?","Ellenőrizhetjük az érthetőséget és az időtartamot.","Így nem kell vázlatot készíteni.","Így nem kell ismernünk a témát."],["Melyik állítás igaz a beszámolóra?","Szóban és írásban is elkészíthető.","Kizárólag versben írható.","Minden beszámolónak kitalált eseményről kell szólnia."],["Melyik mondat fejezi ki egy bekezdés fő gondolatát?","A madáretető gondozása rendszeres figyelmet igényel.","Az etető mellett egy kék lapát hever.","Kedden három szem magot láttam a földön."],["Miért fontos, hogy az előadó értse a témáját?","Így a hallgatóság kérdéseire is tud válaszolni.","Így kihagyhatja az összes magyarázatot.","Így nem kell felkészülnie."]]],[["Az egymás mellett álló mássalhangzók hatnak egymásra. **Zöngésség szerinti részleges hasonulás:** az első mássalhangzó zöngés vagy zöngétlen párját ejtjük a következő hang hatására. Például népdal: p → b; jégpálya: g → k. A v az előtte álló hangot nem teszi zöngéssé: hetven. **Képzés helye szerinti részleges hasonulás:** az n képzési helye megváltozik, például szénpor: n → m; ponty: n → ny. Ezeket a változásokat rendszerint nem jelöljük írásban. Ritka, rögzült kivétel például a lélegzik és a kesztyű.","A **részleges hasonulás** során a két egymás mellé kerülő mássalhangzó közül az egyik megváltozik. Népdal: p helyett b-t ejtünk. Jégpálya: g helyett k-t ejtünk. Ez zöngésség szerinti hasonulás. Szénpor: n helyett m-et ejtünk. Ez képzés helye szerinti hasonulás. A példákban az eredeti betűket írjuk le.","Két egymás melletti mássalhangzó hat egymásra. **Népdal:** p-t írunk, b-t ejtünk. **Színpad:** n-t írunk, m-et ejtünk. Figyeld meg a különbséget!"],"népdal: p → b; jégpálya: g → k; színpad: n → m; ponty: n → ny.",[["Mi a részleges hasonulás lényege?","Az egyik hang valamely képzési tulajdonsága megváltozik a másik hatására.","Mindkét hang mindig eltűnik.","Mindig új betűt kell írni."],["Melyik hang változik a jégpálya kiejtésekor?","g → k","p → b","j → gy"],["Melyik hang változik a kékben kiejtésekor?","k → g","b → p","n → ny"],["Melyik hang változik a méztea kiejtésekor?","z → sz","t → d","m → n"],["Melyik hang változik a késdoboz kiejtésekor?","s → zs","d → t","z → sz"],["Melyik hang változik a szénbánya kiejtésekor?","n → m","b → p","ny → n"],["Melyik hang változik a ponty szó kiejtésekor?","n → ny","ty → gy","p → b"],["Melyik törvény érvényesül a jégpálya szóban?","Zöngésség szerinti részleges hasonulás","Képzés helye szerinti részleges hasonulás","Egyik sem"],["Melyik törvény érvényesül a szénbánya szóban?","Képzés helye szerinti részleges hasonulás","Zöngésség szerinti részleges hasonulás","Egyik sem"],["Melyik törvény érvényesül a hetven szó t és v hangjának találkozásakor?","Egyik részleges hasonulás sem","Zöngésség szerinti részleges hasonulás","Képzés helye szerinti részleges hasonulás"],["Miért ejtjük a vasgolyó s hangját zs-ként?","Az utána álló g zöngés.","Az előtte álló a hosszú.","Az utána álló g zöngétlen."],["Melyik szó a részleges hasonulás írásban is megjelenő, tankönyvi példája?","lélegzik","népdal","szénpor"],["Melyik szóban nincs részleges hasonulás?","kalap","jégpálya","ponty"],["Melyik a helyes írásmód, ha kiejtéskor a dob szó végén p-t hallunk?","dobpergés","doppergés","dobbergés"]]],[["**Teljes hasonulás** történik, ha két egymás mellett álló mássalhangzó közül az egyik teljesen azonossá válik a másikkal. Írásban jelölt teljes hasonulás: a változást le is írjuk. Például pad + -val → paddal; tündér + -vé → tündérré; ez + -ben → ebben. Írásban jelöletlen teljes hasonulás: csak a kiejtésben történik változás, írásban megtartjuk az eredeti szóelemeket. Például üljön [üjjön], hagyja [haggya], egészség [egésség]. Magánhangzó után a -val/-vel v-je megmarad: ceruzával.","**Teljes hasonulás:** az egyik mássalhangzó ugyanolyan lesz, mint a másik. Írásban jelölt: pad + val = paddal. Írásban jelöletlen: üljön; ejtve üjjön. A jelöletlen változást nem írjuk le!","Pad + val = paddal. A v d-vé változik. Ezt le is írjuk. Üljön: üjjönnek ejtjük, de üljönnek írjuk. Ez a **teljes hasonulás** két fajtája."],"szék + -vel → székkel; hagy + -ja → hagyja, kiejtve [haggya].",[["Mi a teljes hasonulás?","Az egyik mássalhangzó teljesen azonossá válik a másikkal.","Csak a zöngésség változik meg.","Mindig egy harmadik hang keletkezik."],["Melyik szóban van írásban jelölt teljes hasonulás?","zsákkal","ponty","egészség"],["Melyik szóban van írásban jelöletlen teljes hasonulás?","beszéljük","népdal","sünnel"],["Melyik a helyes alak? tündér + -vé","tündérré","tündérvé","tündérrvé"],["Melyik a helyes alak? az + -tól","attól","aztól","azttól"],["Melyik a helyes alak? az + -hoz","ahhoz","azhoz","azhhhoz"],["Melyik a helyes írásmód?","igazság","igasság","igazzság"],["Melyik a helyes írásmód?","átcsap","áccsap","átccsap"],["Melyik hangkapcsolatból ejtünk hosszú gy-t a hagyja szóban?","gy + j","g + j","gy + a"],["Melyik hangkapcsolatból ejtünk hosszú s-t az egészség szóban?","sz + s","z + s","s + j"],["Melyik szóban nincs teljes hasonulás?","ceruzával","ecsettel","hagyja"],["Melyik szóban részleges hasonulás történik?","jégpálya","paddal","üljön"],["Miért írjuk helyesen a beszéljük szót l és j betűvel?","A teljes hasonulást csak kiejtéskor érvényesítjük, írásban nem jelöljük.","A kiejtés és az írás mindig egyezik.","Az l és j ugyanazt a hangot jelöli."],["Melyik szóban a mutató névmás z hangja hasonul a rag első hangjához?","ebben","sünnel","székkel"]]],[["**Összeolvadás:** két különböző mássalhangzó találkozásakor egy harmadik hangot ejtünk. Például adjon [aggyon], tanítja [taníttya]. **Rövidülés:** a hosszú mássalhangzó egy másik mássalhangzó mellett kiejtve rövidülhet: varrt [vart]. **Kiesés:** mássalhangzók torlódásakor az egyik, gyakran a középső hang elmaradhat: mondta [monta]. **Nyúlás:** egy rövid mássalhangzó kiejtve hosszabbá válhat: szalag [szallag]. Ezeket a változásokat nem jelöljük írásban. A szögletes zárójel a szemléltető kiejtett alakot jelzi.","**Összeolvadás:** d + j → hosszú gy (adjon). **Rövidülés:** hallgat [halgat]. **Kiesés:** mondta [monta]. **Nyúlás:** szalag [szallag]. A kiejtés változásait nem írjuk le.","Adjon: aggyon. Hallgat: halgat. Mondta: monta. Szalag: szallag. A bal oldali alak a helyes írásmód. Kiejtéskor a hangok megváltozhatnak."],"tanítja [taníttya]; jobbra [jobra]; nézd meg [néz meg]; utána [utánna].",[["Mi az összeolvadás lényege?","Két különböző mássalhangzó helyett egy harmadik hang keletkezik.","Az egyik hang teljesen azonossá válik a másikkal.","Csak egy magánhangzó változik."],["Melyik hangkapcsolatból lesz hosszú c a látsz szóban?","t + sz","t + s","l + t"],["Melyik hangkapcsolatból lesz hosszú ny a menj szóban?","n + j","ny + j","m + j"],["Melyik szóban van összeolvadás?","segítség","község","népdal"],["Melyik szóban van rövidülés?","többször","hagyja","színpad"],["Mi történik a szebbre szóban?","A bb kiejtve rövidül a mellette álló r miatt.","A b zöngétlenedik.","Az r kiesik."],["Melyik szóban figyelhető meg kiesés?","rajzszög","paddal","szalag"],["Melyik hang eshet ki a rajzszög szóban?","z","j","sz"],["Mi történhet a minél szó kiejtésében?","Az n megnyúlhat.","Az n kiesik.","Az n ny-vé hasonul."],["Melyik írásmód helyes?","rövidebbre","rövidebre","rövidebbre rr"],["Melyik a helyes alak?","kisebb","kissebb","kiseb"],["Mi a különbség az összeolvadás és a teljes hasonulás között?","Összeolvadáskor új hang keletkezik, teljes hasonuláskor az egyik a másikkal válik azonossá.","Mindkettőben mindig kiesik az összes mássalhangzó.","Nincs köztük különbség."],["Melyik jelenség lehet a természetes beszédben, de nem kötelező minden ejtésben?","Mássalhangzó-nyúlás","A betűrend megváltozása","A hangrend szerinti szótagszám"],["Miért írjuk a mondta alakot d-vel?","A kiesést nem jelöljük írásban, megőrizzük a szóelemeket.","Mert mindig hosszan ejtjük a d-t.","Mert a d magánhangzó."]]],[["A **beszédhangokat betűkkel jelöljük**. Egy betű több írásjegyből is állhat: cs, dzs. A kiejtés és a helyesírás nem mindig azonos. A magánhangzók időtartamuk, képzésük helye és ajakműködésük szerint csoportosíthatók. A hangrend és az illeszkedés a magánhangzók kapcsolatára vonatkozik. A mássalhangzók kapcsolatában részleges és teljes hasonulás, összeolvadás, rövidülés, kiesés vagy nyúlás fordulhat elő. Ismételd át az írásban jelölt és jelöletlen változásokat!","A **hangot ejtjük**, a betűt írjuk. A magánhangzók lehetnek rövidek, hosszúak, magasak vagy mélyek. A hangrend a szó magánhangzóinak rendje. A mássalhangzók találkozásakor változhat a kiejtés. A legtöbb változást nem írjuk le.","A **hangot halljuk, a betűt látjuk**. A hangok találkozásakor megváltozhat a kiejtés. Népdal: nébdal. Székkel: így ejtjük és írjuk. Tanítja: taníttya. Írásban a helyes alakot kell használni."],"népdal [nébdal] – részleges hasonulás; székkel – írásban jelölt teljes hasonulás; tanítja [taníttya] – összeolvadás.",[["Hány magyar betűből áll a csónak szó?","5","6","4"],["Hány írásjegyből áll a dzsem szó?","5","3","4"],["Melyik állítás igaz a j és ly betűre?","Két betű, azonos hang.","Két betű, két külön hang.","Egy betű, két külön hang."],["Melyik hang hosszú és magas?","ő","ö","ó"],["Melyik hang rövid és mély?","u","ú","ü"],["Melyik szópárban csak a magánhangzó hosszúsága tér el?","kor – kór","hal – hall","vár – vér"],["Egészítsd ki: A tűzhelyen fő a leves, a fa ága pedig …","törhet","tőrhet","törhét"],["Milyen hangrendű a fenyő szó?","Magas","Mély","Vegyes"],["Milyen hangrendű a zsiráf szó?","Vegyes","Magas","Mély"],["Melyik a helyes alak? üvegpohár + -ból/-ből","üvegpohárból","üvegpohárből","üvegpohárbel"],["Melyik a helyes alak? szék + -hoz/-hez/-höz","székhez","székhöz","székhoz"],["Melyik a gy zöngétlen párja?","ty","cs","k"],["Melyik a hosszú sz helyes jelölése egy szó belsejében?","ssz","szsz","szs"],["Melyik hangot ejtjük a népdal p-je helyett?","b","p","d"],["Melyik hangot ejtjük a szénpor n-je helyett?","m","ny","n"],["Melyik törvény érvényesül a tűzfal szó z hangjánál?","Zöngésség szerinti részleges hasonulás","Képzés helye szerinti részleges hasonulás","Teljes hasonulás"],["Melyik a helyes toldalékos alak? ecset + -vel","ecsettel","ecsetvel","ecsetvvel"],["Melyik szóban van írásban jelöletlen teljes hasonulás?","hagyja","székkel","tanítja"],["Melyik a helyes írásmód a [beszéjjük] ejtés ellenére?","beszéljük","beszéjjük","beszéjljük"],["Melyik törvényre példa a tanítja [taníttya]?","Összeolvadás","Teljes hasonulás","Rövidülés"],["Melyik két hang olvad össze a látsz szóban?","t + sz","l + t","t + s"],["Melyik törvény érvényesül a varrt [vart] példában?","Rövidülés","Kiesés","Nyúlás"],["Melyik a helyes írásmód?","szebbre","szebre","szebbrre"],["Melyik hang eshet ki a mondta kiejtésekor?","d","n","t"],["Melyik a helyes alak a [rajszög] ejtés ellenére?","rajzszög","rajszög","rajszszög"],["Melyik a helyes írásmód?","minél","minnél","mínél"],["Milyen jelenség a szalag [szallag] ejtése?","Nyúlás","Rövidülés","Összeolvadás"]]],[["A magyar nyelvben az iskolai felosztás szerint **14 magánhangzó és 25 mássalhangzó** van. A magánhangzó önmagában is alkothat szótagot: a-pa. A mássalhangzó a magyar szótagban magánhangzóhoz kapcsolódik. A magánhangzókat időtartam, nyelvhelyzet és ajakműködés, a mássalhangzókat időtartam, zöngésség, képzési hely és mód szerint csoportosítjuk. A magánhangzótörvények közül a hangrendet és illeszkedést, a mássalhangzótörvények közül a hasonulást, összeolvadást, rövidülést, kiesést és nyúlást ismételjük. A helyesírásban figyelj a szóelemekre!","A magyarban 14 magánhangzót és 25 mássalhangzót különböztetünk meg. A hangrend lehet magas, mély vagy vegyes. A toldalék alakját az illeszkedés szabályai szerint választjuk ki. A mássalhangzók egymásra hatnak: hasonulhatnak, összeolvadhatnak, rövidülhetnek vagy kieshetnek. A kiejtett alak nem mindig azonos a helyes írásmóddal.","**Magánhangzók:** a, e, i, o, u és társaik. **Mássalhangzók:** például b, p, sz, ny. Mondd ki és figyeld meg a hangokat! A helyes szóalakot írd le: üljön, székkel, tanítja."],"apa → a-pa; fenyőhöz → illeszkedés; zsebkendő → b helyett p; fordítja → t + j helyett tty.",[["Hány magánhangzó van a magyar nyelvben?","14","25","39"],["Hány mássalhangzó-fonémát különböztetünk meg az iskolai felosztás szerint?","25","26","30"],["Melyik hangot ejtjük a hangszalagok rezgésével?","z","sz","f"],["Melyik hang zöngétlen?","k","g","m"],["Melyik hang hosszú, magas és ajakkerekítéses?","ű","ú","í"],["Melyik hang rövid, mély és ajakkerekítéses?","a","á","e"],["Melyik hang hosszú, magas és ajakréses?","é","ő","á"],["Melyik hang rövid, magas és ajakréses?","i","ü","u"],["Melyik szóban alkot önmagában szótagot a kezdő magánhangzó?","apa","körte","szilva"],["Melyik szó magas hangrendű?","tücsök","katica","hangya"],["Melyik szó vegyes hangrendű?","katica","tücsök","hangya"],["Melyik a helyes toldalékos alak? fenyő + -hoz/-hez/-höz","fenyőhöz","fenyőhez","fenyőhoz"],["Melyik a helyes alak? kőfal + -ban/-ben","kőfalban","kőfalben","kőfalbön"],["Melyik hangpár zöngés–zöngétlen?","dzs – cs","ny – n","l – r"],["Melyik a hosszú zs jelölése?","zzs","zszs","zss"],["Melyik hang változik meg a zsebkendő szóban?","b → p","k → g","zs → s"],["Melyik hang változik meg a lenből szóban?","n → m","b → p","l → j"],["Melyik szóban van írásban jelölt teljes hasonulás?","cipőssé","üljön","segítség"],["Melyik szóban van írásban jelöletlen teljes hasonulás?","fogyjon","tollal","fáradsz"],["Melyik hangkapcsolat olvad össze a fáradsz szóban?","d + sz","r + d","f + á"],["Melyik törvény érvényesül a fordítja szó t + j hangkapcsolatában?","Összeolvadás","Teljes hasonulás","Rövidülés"],["Melyik törvény érvényesül a felvarrt szó rr + t hangkapcsolatában?","Rövidülés","Nyúlás","Kiesés"],["Melyik hang eshet ki a nézd meg kiejtésekor?","d","z","m"],["Melyik szó egészíti ki helyesen: Már … állunk az indulásra.","készen","késszen","kézen"],["Melyik szó helyes?","utána","utánna","utánná"],["Melyik alak helyes? A fiú a ceruzát a padra …","tette","tete","tettte"],["Miért fontos a szóelemek felismerése?","Segít a kiejtéstől eltérő helyes írásmód megértésében.","Minden mássalhangzó hosszú lesz.","Minden szó egyetlen betűből áll."]]],[["Szerkezetük szerint a szavak **egyszerűek** vagy **összetettek**. Az egyszerű szó egy szótőre épül: kert (tőszó), kertben (toldalékos szó). A szótő a jelentés alapját hordozza. A toldalékok a szótőhöz vagy már toldalékolt alakhoz kapcsolódnak. Három fajtájuk a képző, a jel és a rag. Az **összetett szó** legalább két tagból áll: kép + keret = képkeret. Az első tag az előtag, a második az utótag. Többszörös összetételnél valamelyik tag maga is összetett: iskolatáska + pánt. Összetett szót is toldalékolhatunk: képkeretben. A szóösszetétel jelentése eltérhet a különírt szószerkezetétől: nagykabát és nagy kabát.","Az **egyszerű szó** egy szótőre épül: ház, házban. Az **összetett szó** legalább két tagból áll: hó + ember = hóember. Az első tag az előtag, a második az utótag. A toldalék a szóhoz kapcsolódik: hóembernek. Képző, jel és rag a toldalék három fajtája.","Kert: egyszerű szó. Kert + kapu = kertkapu: összetett szó. Kert + ben = kertben: toldalékos szó. A **szótő** a szó alapja. A **toldalék** hozzá kapcsolódik."],"ház + tető = háztető; háztető + n = háztetőn. ház | tető | n: előtag, utótag, toldalék.",[["Mi a különbség az egyszerű és az összetett szó között?","Az egyszerű szó egy szótőre, az összetett legalább két szótőre épül.","Az egyszerű szó mindig egy szótagból áll.","Az összetett szóban mindig van rag."],["Melyik egyszerű tőszó?","ablak","ablakok","ablakkeret"],["Melyik egyszerű, toldalékos szó?","tollal","tolltartó","toll"],["Melyik toldalékos összetett szó?","könyvespolcon","könyvben","polcon"],["Melyik a virágcserép előtagja?","virág","cserép","virágcserép"],["Melyik a szótő a virágos szóban?","virág","-os","virá"],["Melyik szóban van egynél több toldalék?","kertekben","kertben","kert"],["Melyik szó két tagja a jégvirág?","jég + virág","jégvi + rág","jé + gvirág"],["Melyik a többszörösen összetett szó?","autóbuszmegálló","autóbusz","ablakkeret"],["Melyik jelentése a nagykabát szónak?","Vastag, hideg időben viselt kabát.","Bármely, túl nagy méretű kabát.","Kabát nélküli ruházat."],["Melyik mondatban jelenti a nagy
