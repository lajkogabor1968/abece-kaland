<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyelvtanKaland 5</title><style>*{box-sizing:border-box}body{margin:auto;max-width:900px;padding:16px;font:18px/1.6 system-ui;background:#edf5f4;color:#163b40}body.sni{font-size:24px}body.btmn{font-size:20px}header,section{background:white;padding:20px;border-radius:18px;margin:12px 0;box-shadow:0 3px 12px #163b4012}button,select{font:inherit;min-height:48px;padding:10px 16px;border:1px solid #176e65;border-radius:12px;background:white;color:#163b40;margin:4px;cursor:pointer}button:hover,button:focus-visible{background:#d8f3e9;outline:2px solid #176e65}button:disabled{opacity:.65}h1,h2{line-height:1.2}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.map button{text-align:left}.answer{display:block;width:100%;text-align:left;margin:8px 0}.hero{background:linear-gradient(135deg,#145b63,#23436f);color:white}progress{width:100%;accent-color:#168477}small{display:block}.feedback{font-weight:bold}@media(max-width:500px){body{padding:8px}section,header{padding:14px}.map{grid-template-columns:1fr}}</style><header class="hero"><h1>🧭 NyelvtanKaland 5.</h1><p>Fedezd fel a magyar nyelvet!</p><a style="color:white" href="./">← Digitális Tanulóműhely</a></header><label>Tanulási mód <select id="mode"><option value="normal">Normál</option><option value="btmn">BTMN – támogatott</option><option value="sni">SNI – segített</option></select></label><main id="root"></main><script>const topics=["Tanulni tanulunk","A jelek világa","Az emberi kommunikáció fogalma, tényezői és célja","A kommunikáció nem nyelvi jelei","A kommunikációs kapcsolat","Beszélgetés, telefonálás, témaválasztás","Kommunikáció szóban és írásban","Ellenőrizd a tudásodat!","A magyar helyesírás jellemzői","Az írás és az ábécé kialakulása","A levél és a keltezés","A kiejtés szerinti írásmód","Szövegszerkesztés","Szóelemző írásmód","A hagyomány szerinti és az egyszerűsítő írásmód","Nyelvhelyesség, szövegalkotás/szövegértés","Összefoglalás","Szólások, közmondások, szállóigék","Könyvtárhasználat","Gyakoroljunk!","Az elbeszélés","A leírás","Összefoglalás","A nyelvi szintek","Hangképzés, fonéma","A magánhangzók","Magánhangzótörvények","Mássalhangzók","Szövegértés, szövegalkotás","Mássalhangzók hangkapcsolódási szabályszerűségei I.","Mássalhangzók hangkapcsolódási szabályszerűségei II.","Mássalhangzók hangkapcsolódási szabályszerűségei III.","Részösszefoglalás I.","Részösszefoglalás II.","A szavak szerkezete","A toldalékok: a képzők","A toldalékok: a jelek és a ragok","Összefoglalás","Hangalak és jelentés","Egyjelentésű és többjelentésű szavak","Az azonos alakú és hasonló alakú szavak","A rokon értelmű és ellentétes jelentésű szavak","Hangutánzó és hangulatfestő szavak","Jelentésmező","Szövegalkotás és összefoglalás","Ellenőrizd a tudásodat!","Összefoglalás – rendszerezés I.","Összefoglalás – rendszerezés II."],lessons=[[["A tanulásban segít a lényegkiemelés, a rendszerezés, a felidézés és az ismétlés.","Olvasd el a leckét. Írd le a lényeget. Mondd el saját szavaiddal. Ismételd át.","Olvass! Emeld ki a fontos szavakat! Mondd el, mit tanultál!"],"Egy állatokról szóló leckéből írd ki a fontos neveket, majd csukd be a könyvet és idézd fel őket.",[["Mi segít a figyelemben?","Csendes környezet","Folyamatos üzenetváltás","Hangos videó"],["Mi a lényegkiemelés?","A fontos információk kiválasztása","Minden szó lemásolása","A cím kihagyása"],["Mit jelent a felidézés?","Emlékezetből elmondom a tanultakat","Új könyvet veszek","Elrakom a füzetet"],["Mi segíti a rendszerezést?","Gondolattérkép","Véletlen firkálás","A jegyzet eldobása"],["Mi segíti a tartós tudást?","Ismétlés és önellenőrzés","A lecke kihagyása","Csak a cím olvasása"]]],[["A jel információt hordoz. A természetes jeleket megfigyeljük, a mesterséges jeleket emberek alkotják. A jelek rendszert alkothatnak.","A jel közöl valamit. A füst természetes jel. A közlekedési tábla mesterséges jel.","A jel üzen valamit. A füst tüzet jelezhet. A piros lámpa megállásra int."],"Sötét felhő: eső közeledhet. Piros közlekedési lámpa: meg kell állni.",[["Melyik természetes jel?","Sötét felhő","STOP tábla","Százalékjel"],["Melyik mesterséges jel?","Közlekedési lámpa","Füst","Láz"],["Mit jelez a piros közlekedési lámpa?","Meg kell állni","Szabad az út","Esik a hó"],["Melyik jelrendszer?","A közlekedési táblák rendszere","Egy kavics","Egy pohár víz"],["Miért tanuljuk meg a mesterséges jeleket?","Hogy értsük jelentésüket","Hogy eltűnjenek","Hogy ne használjuk őket"]]],[["A kommunikáció információcsere. Tényezői a feladó, címzett, üzenet, kód, csatorna, beszédhelyzet; a zaj zavarhatja a közlést. Célja lehet tájékoztatás, érzelemkifejezés, kérés, utasítás, kérdés vagy kapcsolattartás.","A feladó üzenetet küld a címzettnek. A csatorna közvetíti az üzenetet. A zaj zavarhatja a megértést.","Valaki üzen. Valaki megkapja. Például telefonon beszélgetünk."],"Anna telefonon megkérdezi Petitől, mikor ér haza. Anna a feladó, Peti a címzett, a telefon a csatorna.",[["Ki küldi az üzenetet?","Feladó","Címzett","Zaj"],["Ki kapja az üzenetet?","Címzett","Feladó","Csatorna"],["Mi zavarhatja a megértést?","Zaj","Köszönés","Válasz"],["Mi a célja: Hány óra van?","Kérdés","Utasítás","Érzelemkifejezés"],["Mi a célja: Csukd be az ajtót!","Utasítás","Tájékoztatás","Köszönés"],["Mi lehet csatorna?","Telefon","A feladó neve","Az üzenet célja"]]]];const root=document.getElementById('root'),mode=document.getElementById('mode');let current=-1;const e=(p,t,s)=>{const x=document.createElement(t);x.textContent=s;p.append(x);return x};const b=(p,s,f)=>{const x=e(p,'button',s);x.onclick=f;return x};function read(s){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(s);u.lang='hu-HU';speechSynthesis.cancel();speechSynthesis.speak(u)}function audio(p,s){if(window.speechSynthesis)b(p,'🔊 Felolvasás',()=>read(s))}function map(){current=-1;root.replaceChildren();const p=e(root,'section','');e(p,'h2','Kalandtérkép');e(p,'p','Az első három lecke kipróbálható. A további leckék fejlesztés alatt állnak.');const g=e(p,'div','');g.className='map';topics.forEach((t,i)=>{const x=b(g,(i<lessons.length?'🟢 ':'🔒 ')+t,()=>lesson(i));x.disabled=i>=lessons.length})}function lesson(i){current=i;root.replaceChildren();const p=e(root,'section','');b(p,'← Leckék',map);e(p,'h2',topics[i]);const l=lessons[i],m=mode.value==='sni'?2:mode.value==='btmn'?1:0;e(p,'h3','Jegyezd meg!');e(p,'p',l[0][m]);audio(p,l[0][m]);e(p,'h3','Példa');e(p,'p',l[1]);audio(p,l[1]);b(p,'🎮 Küldetés indítása',()=>game(i))}function game(i){const l=lessons[i],queue=l[2].slice();let done=0;function step(){root.replaceChildren();const p=e(root,'section','');b(p,'← Magyarázat',()=>lesson(i));e(p,'h2','🔑 Tudáskapuk');const pr=e(p,'progress','');pr.max=l[2].length;pr.value=done;e(p,'p',done+' / '+l[2].length+' kapu');if(!queue.length){e(p,'h2','🏆 Küldetés teljesítve!');b(p,'Kalandtérkép',map);if(i+1<lessons.length)b(p,'Következő lecke',()=>lesson(i+1));return}const q=queue.shift();e(p,'h3',q[0]);audio(p,q[0]);const opts=q.slice(1,mode.value==='sni'?3:4);for(let j=opts.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[opts[j],opts[k]]=[opts[k],opts[j]]}const buttons=[];const feedback=e(p,'p','');feedback.className='feedback';feedback.setAttribute('aria-live','polite');opts.forEach(o=>{const x=b(p,o,()=>{buttons.forEach(z=>z.disabled=true);if(o===q[1]){done++;feedback.textContent='⭐ Helyes! A kapu kinyílt.'}else{queue.push(q);feedback.textContent='A helyes válasz: '+q[1]+'. Később újra próbálhatod.'}b(p,'Tovább',step)});x.className='answer';buttons.push(x)})}step()}mode.onchange=()=>{document.body.className=mode.value;current<0?map():lesson(current)};map()</script></html>
