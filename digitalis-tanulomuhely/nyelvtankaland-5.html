kabát azt, hogy a ruha mérete túl nagy?","A nagy kabát lecsúszott a vállamról.","Télen nagykabátot hordok.","A nagykabátot a fogasra akasztottam."],["Melyik a helyes elválasztás az összetételi határon?","vas-út","va-sút","vasú-t"],["Melyik szóban van két szótő és toldalék is?","madárházban","madárban","madárház"],["Melyik a helyes állítás?","Az összetett szavakhoz is kapcsolódhat toldalék.","Minden összetett szó toldalék nélküli.","A toldalék önálló szó."]]],[["A **képző** olyan toldalék, amely új jelentésű szót alkot. Megváltoztathatja a szó szófaját is: olvas (ige) → olvasás (főnév). De a szófaj változatlan is maradhat: olvas → olvasgat. A képző a szótőhöz vagy már képzett tőhöz kapcsolódik: szép | ség | es. Megnevező szavakat (kertész, futás), tulajdonságot kifejező szavakat (sós), mennyiséget kifejező szavakat (hatodik) és cselekvést kifejező szavakat (szépít) alkothatunk. A szokásos sorrend: szótő + képző + jel + rag. Az előhangzó nem önálló toldalék: kert | ész | e | k | nek. Az e előhangzó, a -k jel, a -nek rag.","A **képző** új szót hoz létre: kert + -ész = kertész. A szó jelentése megváltozik. Néha a szófaja is: fut → futás. Több képző is lehet egymás után: szép + -ség + -es. A képző után jel és rag állhat.","A **képző** új szót alkot. Kert + ész = kertész. Fut + ás = futás. Szép + ség = szépség. Figyeld meg, mit jelent az új szó!"],"kert | ész | e | k | nek: szótő, képző, előhangzó, többesjel, rag. Az e előhangzó.",[["Melyik állítás igaz a képzőre?","Új szót alkot, és a szófajt is megváltoztathatja.","Mindig csak a többes számot jelzi.","Mindig változatlanul hagyja a szó jelentését."],["Melyik a képző a szépség szóban?","-ség","-ég","-g"],["Melyik szóban van két egymást követő képző?","szépséges","szépség","szépek"],["Melyik a helyes elemzés?","szép | ség | es","szép | séges (egyetlen képző)","szé | pség | es"],["Melyik az olvas igéből képzett főnév?","olvasmány","olvasnak","olvastok"],["Melyik a tiszta melléknévből képzett ige?","tisztít","tisztaság","tiszták"],["Melyik a porol szó képzője a tankönyvi elemzés szerint?","-l","-ol (az o-val együtt)","-r"],["Mi az o szerepe a por | o | l elemzésben?","Előhangzó.","Többesjel.","Tárgyrag."],["Melyik képzővel alkotunk foglalkozásnevet a juh szóból?","-ász","-ban","-t"],["Melyik szó felel a Hányadik? kérdésre?","hatodik","hatos","hatszor"],["Melyik a képző a tanulás szóban?","-ás","-s","-ulás (egyetlen képző)"],["Melyik szóban marad ige a képzés után?","olvasgat","olvasás","olvasmány"],["Melyik a rajzol szó alapszava?","rajz","raj","rajzo"],["Melyik szóban található képző, többesjel és rag is?","kertészeknek","kerteknek","kertész"]]],[["A **jel** módosítja a szó jelentését, de nem változtatja meg az alapjelentését vagy szófaját. Jelek például a többes szám -k jele (hajók), a múlt idő -t/-tt jele (írt, futott), a felszólító mód -j jele (kérj), a feltételes mód -na/-ne/-ná/-né jele (futna), a középfok -bb jele (szebb), a birtokjel -é (Annáé), a birtokos személyjel (könyvem) és a birtoktöbbesítő jel -i (autóim). A **rag** a szavak mondatbeli kapcsolatát jelöli: könyvet (-t tárgyrag), kertben (-ben határozórag), olvasunk (-unk személyrag). A rag a toldaléksor végén áll. A szokásos sorrend: szótő + képző + jel + rag. Az előhangzó nem külön toldalék: kert | ész | e | k | nek.","A **jel** módosítja a szó jelentését: hajók (többes szám), írt (múlt idő), szebb (középfok). A **rag** segít mondatba illeszteni a szót: könyvet, kertben, futunk. A képző után jel, majd rag következhet. Az előhangzót külön is megjelölhetjük.","A **jel** például többes számot mutat: hajó + k. A **rag** segít a mondatban: kert + ben. A képző új szót alkot: kert + ész. Figyeld meg a három toldalékfajtát!"],"hajó | k | ban: szótő + jel + rag. kert | ész | e | k | nek: szótő + képző + előhangzó + jel + rag.",[["Melyik állítás igaz a jelre?","A szó alapjelentését módosítja, de szófaját nem változtatja meg.","Mindig új szótári szót alkot.","Mindig a szó végén áll, utána nem állhat rag."],["Melyik a rag feladata?","A szó mondatbeli szerepének, kapcsolatainak jelölése.","Mindig új foglalkozásnév alkotása.","Kizárólag a többes szám jelölése."],["Melyik a múlt idő jele a kérdezett (tegnap) alakban?","-tt","-e","-ett"],["Melyik szóban van feltételes mód jele?","kérné","kéri","kérte"],["Melyik szóban van felszólító mód jele?","tanulj","tanuló","tanulna"],["Melyik szóban van birtokos személyjel?","könyvem","könyvek","könyvben"],["Melyik szóban van birtokjel?","Annáé","Annának","Annával"],["Melyik szóban van birtoktöbbesítő jel?","autóim","autók","autóval"],["Melyik szó felsőfokú melléknév?","legmagasabb","magasabb","magasság"],["Melyik szóban a -k személyrag?","(én) olvasok","(a) hajók","(a) kertek"],["Melyik mondatban a -t múltidőjel?","Tegnap írt.","Lát egy házat.","Keres egy kulcsot."],["Melyik mondatban a -t tárgyrag?","Olvas egy könyvet.","Péter futott.","Anna nevetett."],["Melyik a helyes elemzés?","kert | ész | e | k | nek","kert | észek | nek","kertész | eknek"],["Melyik szóban van képző és rag, de nincs jel?","szépségben","házakban","szépségek"],["Melyik szóban van jel és rag, de nincs képző?","padokon","kertésznek","szépség"],["Melyik alakban van két jel és egy rag?","autóimban","autókban","autómban"]]],[["A **nyelvi szintek** kisebb egységekből nagyobb egységekhez vezetnek: hang, szóelem, szó, szószerkezet, mondat, szöveg. A beszédhangokat képzésük és időtartamuk szerint jellemezzük. A magánhangzók hangrendje és illeszkedése, illetve a mássalhangzók egymásra hatása a helyesírásban is fontos. A szavak egyszerűek vagy összetettek lehetnek. A **szótő** hordozza az alapjelentést; a **képző** új szót alkot, a **jel** módosítja a jelentést, a **rag** a mondatbeli szerepet jelöli. A szokásos sorrend: szótő, képző, jel, rag. Az előhangzó nem önálló toldalék. Az összefoglalásban a hangtan és a szavak szerkezete együtt szerepel.","Ismételd át a beszédhangokat és hangtörvényeket! A szavak egyszerűek vagy összetettek. A **szótő** a szó alapja. A **képző** új szót alkot, a **jel** módosítja a jelentését, a **rag** mondatba illeszti. A szokásos sorrend: szótő + képző + jel + rag.","Kert: szótő. Kertész: képzett szó. Kertészek: többes szám. Kertészeknek: ragos szó. Ismételd át a hangokat, a helyesírást és a szóelemeket!"],"kert | ész | e | k | nek: szótő, képző, előhangzó, jel, rag. A kertkapu összetett szó.",[["Melyik sorrend halad a kisebb egységtől a nagyobb felé?","Hang – szóelem – szó – szószerkezet – mondat – szöveg","Hang – mondat – szó – szöveg – szóelem","Szó – hang – szóelem – mondat – szöveg"],["Melyik példa szószerkezet?","piros alma","alma","A fiú almát eszik."],["Melyik szerv rezgése hozza létre a zöngét?","Hangszalagok","Fogak","Ajkak"],["Melyik magánhangzó hosszú, mély és ajakkerekítéses?","ú","ű","u"],["Melyik magánhangzó rövid, magas és ajakréses?","e","é","ö"],["Melyik szó vegyes hangrendű?","béka","tücsök","galamb"],["Melyik a helyes alak: tükör + -hoz/-hez/-höz?","tükörhöz","tükörhez","tükörhoz"],["Melyik a g zöngétlen párja?","k","t","gy"],["Melyik hang változik meg a fogkrém szóban a g + k találkozásakor?","g → k","k → g","r → l"],["Melyik hang változik meg a különben szó n + b kapcsolatában?","n → m","b → p","n → ny"],["Melyik szóban jelöljük írásban a teljes hasonulást?","kézzel","beszélj","tanítja"],["Melyik jelenségre példa a tanítja [taníttya]?","Összeolvadás","Kiesés","Teljes hasonulás"],["Melyik jelenségre példa a hallgat [halgat]?","Rövidülés","Nyúlás","Összeolvadás"],["Melyik hang maradhat ki a mondta kiejtéséből?","d","n","t"],["Melyik a helyes írásmód?","szalag","szallag","szalagg"],["Melyik egyszerű, toldalék nélküli szó?","tükör","tükrök","tükörkép"],["Melyik toldalékos egyszerű szó?","asztalon","asztal","íróasztal"],["Melyik toldalékos összetett szó?","kertkapunál","kapunál","kertkapu"],["Melyik a vízimalom utótagja?","malom","vízi","víz"],["Melyik összetett szó határán helyes az elválasztás?","nap-fény","na-pfény","napfé-ny"],["Melyik szóban van képző?","boldogság","boldogok","boldognak"],["Melyik szóban található két képző?","szépséges","szépség","szépségben"],["Melyik szó képzője változtatja igéből főnévvé az alapszót?","festés","festett (tegnap)","festünk"],["Melyik a többes szám jele a fák szóban?","-k","-á","-ák (az egész végződés)"],["Melyik a középfok jele a kisebb szóban?","-bb","-e","-ebb (az előhangzóval együtt)"],["Melyik szóban van feltételes mód jele?","futna","futás","futunk"],["Melyik szóban van birtokjel?","Máriáé","Máriával","Máriának"],["Melyik a tárgyrag a labdát szóban?","-t","-á","-át"],["Melyik szó válaszol a Honnan? kérdésre?","iskolából","iskolában","iskolába"],["Melyik szóban van igei személyrag?","rajzolunk","rajzok","rajzban"],["Melyik a helyes szóelemsorrend?","Szótő – képző – jel – rag","Szótő – jel – rag – képző","Szótő – rag – jel – képző"],["Melyik szóban van képző, jel és rag is?","kertészekkel","kertészek","kertekkel"],["Melyik szóban van képző és rag, de nincs jel?","olvasásról","olvasások","könyvekről"],["Melyik szóban van két jel és rag?","hajóimra","hajókra","hajómra"],["Melyik szóelem az e a kert | ész | e | k | nek elemzésben?","Előhangzó","Képző","Rag"],["Melyik mondatban szerepel múltidőjel?","Tegnap olvasott.","Képet rajzol.","Könyvet keres."]]],[["A **hangalak** (H) a szó kimondott hangjainak sora. A **jelentés** (J) az, amit a szó kifejez, amire a szó hallatán gondolunk. A tankönyvi képlet: SZÓ = H + J. A nyelvben jelentéssel rendelkező hangsorokat használunk. Egy jelentéshez több hangalak is tartozhat: kerékpár, bicikli. Egy hangalakhoz több jelentés is kapcsolódhat: ég (az égbolt), ég (lángol). A szövegkörnyezet segít kiválasztani a megfelelő jelentést. Átvitt jelentésben is használhatunk szavakat: a lelkesedés tüze. Az értelmező szótár a szavak jelentését, az idegen szavak szótára az idegen eredetű szavak jelentését, a szinonimaszótár a rokon értelmű szavakat, a helyesírási szótár a szabályos írásmódot segít megismerni. Fogalmazásunkat olvassuk át, javítsuk a jelentésbeli, nyelvtani és helyesírási hibákat.","A **hangalak** az, ahogyan kimondjuk a szót. A **jelentés** az, amit a szó kifejez. SZÓ = H + J. A kerékpár és bicikli más hangalakú, de hasonló jelentésű szó. Az ég szónak eltérő jelentései lehetnek. A mondat segít megérteni, melyik jelentésről van szó. Ismeretlen szó jelentését szótárban keresheted meg.","A **hangalak** a szó hangjainak sora. A **jelentés** az, amit megértünk a szóból. Például: kutya – egy háziállat. Ha nem érted a szót, keresd meg az értelmező szótárban!"],"SZÓ = H + J. A kutya hangalakja k-u-ty-a, jelentése egy háziasított állat. A kerékpár és bicikli eltérő hangalakú, hasonló jelentésű.",[["Miért nyelvi jel a szó?","Mert hangalakhoz jelentés kapcsolódik.","Mert minden szó egyetlen hangból áll.","Mert minden szó egy tárgy rajza."],["Melyik állítás igaz?","Ugyanazt a fogalmat több eltérő hangalak is jelölheti.","Egy fogalomnak csak egyetlen elnevezése lehet.","Minden nyelv hangalakjai azonosak."],["Melyik kifejezésben átvitt a tűz szó jelentése?","A lelkesedés tüze.","A kandalló tüze.","A tábortűz lángja."],["Melyik mondatban használjuk az ég szót igeként?","A gyertya ég.","Felhős az ég.","Kék az ég."],["Melyik szópárban kapcsolódik eltérő hangalakhoz hasonló jelentés?","bicikli – kerékpár","ég – ég","alma – körte"],["Mit jelent a szilaj ló kifejezésben a szilaj?","Fékezhetetlen, nehezen megzabolázható.","Beteg, erőtlen.","Lassan mozgó."],["Mit jelent a petrence a hagyományos szóhasználatban?","Összegyűjtött széna kisebb rakása.","Egy lovas ruhadarabja.","Egy szántóföldi szerszám éle."],["Melyik szótárból tudhatod meg, hogyan írjuk helyesen a kilogramm szót?","Helyesírási szótár.","Szinonimaszótár.","Idegen szavak szótára."],["Melyik szótár segít megkeresni a derűs rokon értelmű szavait?","Szinonimaszótár.","Helyesírási szótár.","Idegen szavak szótára."],["Melyik állítás igaz a jelentésről?","A szövegkörnyezet segít eldönteni, mire utal a szó.","A szó jelentését mindig a betűk száma határozza meg.","A szövegkörnyezetnek nincs szerepe."],["Melyik a köznyelvi, választékosabb változata ennek: A csapat elhúzott a pályáról?","A csapat elment a pályáról.","A csapat elhúzta a pályát.","A csapat húzódozott a pályán."],["Melyik a helyes javítás? A gyerekek vidáman játszik.","A gyerekek vidáman játszanak.","A gyerekek vidám játszik.","A gyerekek vidáman játszom."],["Melyik mondatban helyes az időhasználat?","Tegnap esett, ma süt a nap.","Tegnap esik, ma sütött a nap.","Tegnap esni fog, ma süt a nap."],["Miért kell átolvasni egy elkészült fogalmazást?","A tartalmi, nyelvi és helyesírási hibák javításáért.","Azért, hogy minden mondat ugyanolyan hosszú legyen.","Azért, hogy minden szót idegen eredetűre cseréljünk."]]],[["Az **egyjelentésű szó** hangalakjához egy jelentés tartozik. Jelölése: H – J. Ilyen például a milliliter, nitrogén, hektoliter. A **többjelentésű szó** egy hangalakjához több, egymással összefüggő jelentés kapcsolódik: H → J1, J2, J3. Például a zebra csíkos állat és csíkos gyalogátkelőhely. Az alapjelentésből hasonlóság vagy más jelentésbeli kapcsolat alapján új jelentés alakulhat ki. A kosár füle alakja miatt kapta a fül nevet. A mondat szövegkörnyezete segít felismerni, melyik jelentésről van szó. A többjelentésű szó jelentései között kapcsolat van.","Az **egyjelentésű szó** egy dolgot vagy fogalmat jelöl: milliliter. A **többjelentésű szó** több dolgot jelölhet, de a jelentései összefüggnek. Zebra: csíkos állat és gyalogátkelőhely. Mindkettő csíkos. A mondatból tudjuk meg, melyik jelentésről van szó.","Egyjelentésű: egy jelentés. Például milliliter. Többjelentésű: több összefüggő jelentés. Zebra: 🦓 csíkos állat vagy gyalogátkelőhely. Mindkettő csíkos."],"H – J: liter. H → J1, J2: fül (hallószerv; edény fogantyúja).",[["Mi a többjelentésű szó meghatározása?","Egy hangalakhoz több, egymással összefüggő jelentés kapcsolódik.","Egy hangalakhoz több, egymással semmilyen kapcsolatban nem álló jelentés kapcsolódik.","Több hangalakhoz egyetlen jelentés kapcsolódik."],["Melyik szó egyjelentésű a tankönyvi felosztás szerint?","centiliter","daru","száj"],["Melyik szó többjelentésű?","körte","nitrogén","milliliter"],["Mi kapcsolja össze a daru madár és a daru emelőgép jelentését?","A hosszú nyakra emlékeztető szerkezet.","Az emelőgép tollazata.","Azonos élőhelyük."],["Mit jelent a nyelv szó: A cipő nyelve becsúszott?","A cipőfűző alatt található részt.","Az ember beszédszervét.","Egy közösség jelrendszerét."],["Melyik mondatban a száj jelentése nyílás?","A barlang szája szűk volt.","A gyermek kinyitotta a száját.","A fiú befogta a száját."],["Mi a kapcsolat a folyó torkolata és az ember torka között?","Mindkettő átjáróhoz vagy nyíláshoz kapcsolódik.","Mindkettő folyadékból áll.","Mindkettő ugyanolyan méretű."],["Melyik mondatban jelenti a vezet szó azt, hogy első helyen áll?","A csapat két góllal vezet.","A sofőr autót vezet.","A túravezető a forráshoz vezet bennünket."],["Mit jelent a lap szó: A sakktábla lapja sima?","Egy tárgy sík felületét.","Egy újságot.","Egy növény levelét."],["Miért többjelentésű a fül?","A hallószerv és a fogantyú jelentése között formai kapcsolat van.","Két különböző szó hangalakja véletlenül azonos.","Mert két füle van az embernek."],["Miért fontos a szövegkörnyezet?","Segít eldönteni, hogy a szó melyik jelentésben szerepel.","Mindig megváltoztatja a szó betűit.","Minden szót egyjelentésűvé tesz."],["Melyik pár szemléltet többjelentésű szót?","Az üveg nyaka – az ember nyaka","A vár (épület) – vár (valakire)","A bicikli – a kerékpár"],["Melyik mondatban van átvitt jelentésű gyökér?","A vita gyökerét keressük.","A tölgy gyökere mélyre nyúlik.","A gyökér vizet vesz fel."],["Melyik ábra jelöli a többjelentésű szót?","H → J1, J2 (összefüggő jelentések)","H → J","H1, H2 → J"],["Melyik szó illik mindkét mondatba: A kosár … leszakadt. Az ember … érzékeli a hangokat.","füle","szeme","lába"]]],[["Az **azonos alakú szavak** hangalakja megegyezik, de jelentéseik között nincs összefüggés: vár (épület) és vár (várakozik). Azonos lehet két szótári alak (dob), egy szótári és egy toldalékos alak (fánk: sütemény; a mi fánk), vagy két toldalékos alak (sírok: temetkezési helyek; könnyezem). Csak kiejtésükben is lehetnek azonosak: fogja – foglya. A többjelentésű szó jelentései viszont összefüggnek: fül (testrész; fogantyú). A **hasonló alakú szavak** hangalakja közel áll egymáshoz. Az **alakváltozatok** jelentése azonos: fenn – fent, zsemle – zsömle. Az **alakpárok** jelentése eltér: helység (település) – helyiség (épület elkülönített része); egyelőre (most még) – egyenlőre (egyenlő nagyságúra). A mondat szövegkörnyezete segít a megfelelő szó kiválasztásában.","Az **azonos alakú szavak** egyformán hangzanak, de a jelentéseik nem függnek össze: nyúl (állat), nyúl (a kezével valamiért). A többjelentésű szó jelentései összefüggnek: egér (állat, számítógépes eszköz). A **hasonló alakú szavak** csak kis mértékben térnek el. Fent és fenn ugyanazt jelenti. Helység és helyiség mást jelent. A mondat alapján válaszd ki a jó alakot!","Vár: 🏰 épület vagy valakire várakozik. A jelentések nem függnek össze: **azonos alakú** szavak. Fenn és fent: hasonló alakú, azonos jelentésű szavak. Helység: település. Helyiség: szoba vagy más elkülönített épületrész."],"vár (épület) – vár (várakozik); fül (testrész) – fül (fogantyú); fenn – fent; helység – helyiség.",[["Melyik meghatározás igaz az azonos alakú szavakra?","Azonos hangalakú, egymással össze nem függő jelentésű szavak.","Hasonló hangalakú, azonos jelentésű szavak.","Egy szó egymással összefüggő jelentései."],["Melyik pár mutat két egymástól független jelentésű azonos alakú szót?","vár (épület) – vár (várakozik)","láb (testrész) – láb (asztal része)","fül (testrész) – fül (fogantyú)"],["Melyik két szótári alak egyezik meg?","dob (hangszer) – dob (hajít)","fánk (sütemény) – fánk (a mi fánk)","sírok (temetkezési helyek) – sírok (könnyezem)"],["Melyik példában egyezik meg egy szótári és egy toldalékos alak?","fánk (sütemény) – fánk (a mi fánk)","ég (mennybolt) – ég (lángol)","sírok (temetkezési helyek) – sírok (könnyezem)"],["Melyik példában egyezik meg két toldalékos alak?","sírok (temetkezési helyek) – sírok (könnyezem)","fog (testrész) – fog (tart)","fánk (sütemény) – fánk (a mi fánk)"],["Melyik pár csak kiejtésben azonos?","fojt – folyt","vár – vár","benn – bent"],["Melyik mondatban jelenti a fűz szó azt, hogy cérnára helyez?","Anna gyöngyöt fűz.","A patakparton fűz nő.","A fűz árnyékot ad."],["Melyik hasonló alakú szópárnak azonos a jelentése?","zsemle – zsömle","szível – szívlel","tanulság – tanúság"],["Melyik szópár tagjainak különbözik a jelentése?","fáradság – fáradtság","kinn – kint","lenn – lent"],["Melyik szó illik a mondatba? A házban négy különálló … van.","helyiség","helység","helyeség"],["Melyik szó illik a mondatba? A tortát … osztottuk, mindenki ugyanakkora szeletet kapott.","egyenlőre","egyelőre","egy előre"],["Melyik szó illik a mondatba? A hosszú túra után … vett erőt rajtam.","fáradtság","fáradság","fárasztás"],["Melyik a történetből levonható következtetést jelentő szó?","tanulság","tanúság","tanú"],["Melyik szó illik a mondatba? A szavazók … döntöttek, mindenki igennel szavazott.","egyhangúlag","egyhangúan","egyhanguan"],["Melyik szó illik a mondatba? A tó itt nagyon …, alig ér bokáig.","sekély","csekély","sekélyes"],["Melyik szó jelenti azt, hogy valakit kedvel?","szível","szívlel","szívelel"],["Melyik mondatban helyes a köznyelvi feltételes mód?","Adnék neked egy almát.","Adnák neked egy almát.","Adnák én neked egy almát."],["Melyik alak illik a mondatba? A szervezők péntekre … a találkozót.","elhalasztják","elhalasszák","elhalasztja"]]],[["A **rokon értelmű szavak**, más néven szinonimák hangalakja eltér, jelentésük azonos vagy hasonló. Például kerékpár – bicikli; vidám – jókedvű. Lehetnek eltérő stílusúak (pénz – lóvé), tájnyelviek (burgonya – pityóka), vagy különböző jelentésárnyalatúak (sétál – bandukol – rohan). A mondat és a beszédhelyzet alapján válassz megfelelő szót! A szinonimák segítenek elkerülni a szóismétlést. Az **ellentétes jelentésű szavak**, más néven antonimák jelentése egymással ellentétes: magas – alacsony, öröm – bánat. Fosztóképzővel is alkothatunk ellentétes jelentésű szót: sós – sótlan, barátságos – barátságtalan, türelmes – türelmetlen. Egy többjelentésű szó különböző jelentéseihez eltérő szinonimák és ellentétek tartozhatnak: könnyű feladat – egyszerű feladat, könnyű csomag – kis súlyú csomag.","A **rokon értelmű szavak** jelentése azonos vagy hasonló: vidám – jókedvű, bicikli – kerékpár. Segítenek elkerülni a szóismétlést. Az **ellentétes jelentésű szavak** egymás ellenkezőjét fejezik ki: hideg – meleg, gyors – lassú. A mondat alapján válaszd ki a megfelelő szót!","Rokon értelmű: vidám – jókedvű. Mindkettő hasonlót jelent. Ellentétes jelentésű: hideg – meleg. A két szó egymás ellentéte."],"vidám – jókedvű (rokon értelmű); vidám – szomorú (ellentétes jelentésű).",[["Mi a rokon értelmű szavak közös jellemzője?","Eltérő hangalakjukhoz azonos vagy hasonló jelentés tartozik.","Hangalakjuk azonos, jelentésük mindig különböző.","Hangalakjuk különböző, jelentésük mindig ellentétes."],["Melyik párban különbözik a stílus, de az alapjelentés közel azonos?","pénz – lóvé","pénz – pénztár","pénz – gazdag"],["Melyik szópár tájnyelvi és köznyelvi megfelelő?","pityóka – burgonya","burgonya – sárgarépa","burgonya – krumplileves"],["Melyik szó fejezi ki a legpontosabban a fáradt, nehézkes gyaloglást?","vánszorog","szökell","száguld"],["Melyik a csöndesen nevet szókapcsolat legpontosabb megfelelője?","kuncog","hahotázik","zokog"],["Melyik szó illik a mondatba: A kisgyerek nagyokat … a viccen, az egész szoba zengett?","hahotázott","mosolygott","suttogott"],["Melyik a világos szoba ellentéte?","sötét szoba","érthetetlen szoba","homályos magyarázat"],["Melyik a világos magyarázat rokon értelmű megfelelője?","érthető magyarázat","fényes magyarázat","fehér magyarázat"],["Melyik a kemény párna ellentéte?","puha párna","nehéz párna","keményebb párna"],["Melyik szópár fejez ki ellentétet?","bőkezű – fukar","bőkezű – nagylelkű","fukar – zsugori"],["Melyik szóban van fosztóképző?","sótlan","sózás","sós"],["Melyik alak a remény szó fosztóképzős származéka?","reménytelen","reményes","reménnyel"],["Melyik mondatban megfelelőbb a választékos szóhasználat egy iskolai beszámolóban?","A versenyzők nagyon igyekeztek.","A versenyzők ezerrel nyomták.","A versenyzők totál beindultak."],["Melyik ige adja vissza a mondat értelmét: Alig hallhatóan mondta el a titkot?","súgta","kiabálta","szavalta"],["Melyik kifejezés jelentése: valamikor biztosan megtörténik?","előbb-utóbb","több-kevesebb","ide-oda"],["Melyik szótárból kereshetsz rokon értelmű szavakat?","Szinonimaszótárból.","Helyesírási szótárból.","Idegen szavak szótárából."]]],[["A **hangutánzó szavak** hangalakjukkal valódi hangokat utánoznak: nyávog, csobog, ketyeg. A hangalak és a jelentés között szoros kapcsolat van. A kakukk madár neve is hangutánzó eredetű. A **hangulatfestő (hangfestő) szavak** hangalakjukkal egy mozgás, cselekvés vagy tulajdonság hangulatát, látványát idézik fel: cammog, totyog, hebehurgya. A hangutánzó szónál arra figyelj, mit hallasz; a hangulatfestőnél arra, milyen mozgást vagy tulajdonságot képzelsz el. Mindkét csoport szavai érzékletesebbé teszik a fogalmazást.","A **hangutánzó szó** egy valódi hangot utánoz: nyávog, csobog, ketyeg. A **hangulatfestő szó** mozgást vagy tulajdonságot idéz fel: cammog, totyog, lomha. A kétféle szó színesebbé teszi a beszédet.","Hangutánzó: 🐱 nyávog, 💧 csobog. Hangulatfestő: 🐢 cammog, 👶 totyog. Az első hangot utánoz. A második azt érzékelteti, hogyan mozog vagy milyen valaki."],"A patak csobog: hangutánzó. A fáradt vándor cammog: hangulatfestő.",[["Melyik állítás különíti el legpontosabban a két csoportot?","A hangutánzó szó hangot utánoz, a hangulatfestő szó hangulatot vagy látványt idéz fel.","Mindkét csoport kizárólag állathangokat jelöl.","A hangulatfestő szó mindig hangosabb a hangutánzónál."],["Melyik szópár mindkét tagja hangutánzó?","csobog – csörren","ballag – cammog","piszmog – mekeg"],["Melyik szópár mindkét tagja hangulatfestő?","totyog – kullog","brummog – gágog","ketyeg – zakatol"],["Melyik szó illik a poharak összeütődésének hangjára?","csörren","sziszeg","ropog"],["Melyik szó illik a száraz ág eltörésének hangjára?","reccsen","csobban","zümmög"],["Melyik szó illik a vonat kerekeinek ritmikus hangjára?","zakatol","nyávog","susog"],["Melyik szó jellemzi a túl sokáig apró részletekkel foglalkozó embert?","piszmog","száguld","dörög"],["Melyik szó jellemzi a fürge, élénk gyereket?","virgonc","lomha","pipogya"],["Melyik szó illik a jelentéshez: lassan, kedvetlenül megy?","kullog","vágtat","szökell"],["Melyik szó érzékelteti, hogy valaki észrevétlenül igyekszik elhaladni?","lopakodik","trappol","rohan"],["Melyik mondatban a kiemelt hangutánzó szó a természet hangját utánozza?","A patak csobog.","A vekker ketyeg.","A mozdony zakatol."],["Melyik mondatban szerepel hangulatfestő szó?","A kisgyerek totyogott a fűben.","Az ajtó nyikorgott.","A veréb csiripelt."],["Melyik szóval tehető érzékletesebbé a mozgás leírása: A fáradt vándor lassan ment?","cammogott","beszélt","pihent"],["Miért hasznosak ezek a szavak egy fogalmazásban?","Érzékletesebbé és szemléletesebbé teszik a leírást.","Feleslegessé teszik a mondatokat.","Mindig egyetlen szótagúvá teszik a szavakat."]]],[["A **jelentésmező** egy adott szóval jelentésük alapján logikai kapcsolatban álló szavak köre. A központi szóhoz kapcsolódhat **fölérendelt fogalom** (gyűjtőfogalom), **mellérendelt fogalom** (ugyanabba a csoportba tartozó szó) és a tankönyvi ábrákon **alárendelt fogalomként** megjelenő, szorosan kapcsolódó részlet, eszköz vagy fogalom. Például hegedű: fölérendelt fogalma a hangszer, mellérendelt fogalma a fuvola, kapcsolódó fogalma a vonó. A jelentésmező tágabb körébe képzett és összetett szavak, rokon értelmű és ellentétes jelentésű szavak, valamint más jelentésbeli kapcsolatok is tartozhatnak. A jelentésmező segít rendszerezni és bővíteni a szókincset.","A **jelentésmező** olyan szavakból áll, amelyek jelentésük alapján összetartoznak. Például hegedű: hangszer (gyűjtőfogalom), fuvola (ugyanabba a csoportba tartozik), vonó (kapcsolódó eszköz). Képzett szavak, összetett szavak és ellentétek is tartozhatnak a jelentésmezőbe.","A **jelentésmező** összetartozó szavak csoportja. Például alma, körte, szilva: mind gyümölcs. Az almához kapcsolódhat még az almafa, a mag és az almalé szó is."],"hegedű → hangszer (fölérendelt); fuvola (mellérendelt); vonó (kapcsolódó, alárendelt fogalom a tankönyvi ábrán).",[["Mi jellemzi a jelentésmezőt?","A szavak jelentésük alapján logikai kapcsolatban állnak.","A szavak hangalakja mindig azonos.","A szavak kizárólag azonos szófajúak."],["Melyik a tölgy fölérendelt fogalma?","fa","bükk","makk"],["Melyik a tölgy mellérendelt fogalma a fák között?","bükk","fa","makk"],["Melyik kapcsolódik a tölgyhöz mint termése?","makk","nyírfa","növény"],["Melyik szó a közlekedési eszközök gyűjtőfogalma alá tartozik?","villamos","megálló","utazás"],["Melyik szó a villamos mellérendelt fogalma a közlekedési eszközök között?","autóbusz","közlekedés","sín"],["Melyik a villamoshoz kapcsolódó infrastruktúra?","sín","repülőgép","jármű"],["Melyik a zseblámpa fölérendelt fogalma?","világítóeszköz","izzó","gyertya"],["Melyik a zseblámpa mellérendelt fogalma a világítóeszközök között?","fejlámpa","elem","világítóeszköz"],["Melyik szó a kéz képzett alakja?","kézi","kézfogás","kézben"],["Melyik szó a kéz szóból alkotott összetett szó?","kézírás","kézi","kezes"],["Melyik a vidám jelentésmezőjéhez tartozó ellentétes jelentésű szó?","szomorú","jókedvű","derűs"],["Melyik a vidám jelentésmezőjéhez tartozó rokon értelmű szó?","derűs","szomorú","keserű"],["Melyik szó az iskola jelentésmezőjében személyt jelöl?","pedagógus","tanterem","füzet"],["Melyik szó az iskola jelentésmezőjében helyet jelöl?","tanterem","tanuló","matematika"],["Melyik szó az iskola jelentésmezőjében tantárgyat jelöl?","matematika","tábla","folyosó"]]],[["A **jellemzés** a leíráshoz hasonló szövegfajta, de nemcsak a külsőt mutatja be, hanem a belső tulajdonságokat, szokásokat és viselkedést is. A belső tulajdonságokat cselekedetekkel, párbeszédekkel, jellemző szófordulatokkal, mások véleményével támaszthatjuk alá. A cím után a bevezetésben bemutatjuk a személyt és a választás okát. A tárgyalásban rendezetten ismertetjük a külső és belső tulajdonságokat, példákkal. A befejezésben összegzünk, megfogalmazzuk a személyhez fűződő kapcsolatunkat. Használjunk pontos, változatos szavakat, szinonimákat és hangulatfestő kifejezéseket. A saját véleményünk ne legyen sértő vagy személyeskedő. Az önjellemzésben saját tulajdonságainkat vizsgáljuk.","A **jellemzés** egy személy külsejét, belső tulajdonságait és szokásait mutatja be. Külső: például göndör haj. Belső: például kitartó, segítőkész. A tulajdonságokhoz mondj példát a személy viselkedéséből! Bevezetés: kiről írok és miért. Tárgyalás: tulajdonságok és példák. Befejezés: összegzés, vélemény.","A **jellemzés** elmondja, milyen valaki. Külső tulajdonság: amit látsz (barna haj). Belső tulajdonság: amit a viselkedéséből ismersz meg (kedves). Mondd el példával, miért gondolod így! Ne bánts meg másokat a szavaiddal."],"Lili türelmes: megvárja, amíg a társa befejezi a mondatát. A türelmes belső tulajdonság, a kivárás ezt igazoló cselekedet.",[["Mi a jellemzés célja?","Egy személy külső és belső tulajdonságainak bemutatása.","Csak a ruházat felsorolása.","Egy tárgy működésének ismertetése."],["Melyik külső tulajdonság?","göndör hajú","segítőkész","kitartó"],["Melyik belső tulajdonság?","türelmes","barna szemű","magas termetű"],["Melyik cselekedet utal segítőkészségre?","Elmagyarázza a feladatot a társának.","Megjegyzi, hány oldalból áll a könyv.","Kiválasztja a kék ceruzát."],["Mi illik a jellemzés bevezetésébe?","Bemutatom, kiről írok, és miért választottam őt.","Összegzem a jellemzést.","Részletesen felsorolom a szokásait."],["Mi illik a jellemzés tárgyalásába?","Tulajdonságok és azokat igazoló példák.","Csak a cím.","A már elmondottak rövid lezárása."],["Mi illik a jellemzés befejezésébe?","Összegzés, személyes vélemény.","Új, hosszú eseménysor.","A cím megismétlése magyarázat nélkül."],["Melyik mondat támasztja alá a kitartó tulajdonságot?","Minden délután gyakorolt, amíg sikerült a feladat.","Minden délután az ablak mellett ült.","A feladatlapja kék színű volt."],["Melyik megfogalmazás tárgyilagosabb és tiszteletteljes?","Néha túl gyorsan dönt, ezért hibázik.","Mindig egy szerencsétlen balfék.","Semmihez sem ért, reménytelen."],["Miért érdemes párbeszédet idézni egy jellemzésben?","A szereplő beszéde is megmutathatja a tulajdonságait.","Mert így nem kell bemutatni a személyt.","Mert minden jellemzés kötelezően párbeszédből áll."],["Melyik rokon értelmű a derűs szóval?","jókedvű","borús","szótlan"],["Melyik a figyelmes szó ellentéte?","figyelmetlen","gondos","körültekintő"],["Melyik hangulatfestő szó jellemezheti a lassan, nehézkesen haladó embert?","cammog","ketyeg","csörren"],["Melyik szó illik a barátság jelentésmezejébe?","bizalom","térfogat","szorzat"],["Melyik kifejezés illik a szövegbe: A barátom nem adta fel, hanem … folytatta a munkát.","kitartóan","közömbösen","gondatlanul"],["Melyik mondatban ismerünk meg belső tulajdonságot a beszédből?","„Próbáld újra, segítek!” – biztatta a társát.","„A füzet az asztalon van.” – mondta.","„Kedd van.” – felelte."]]],[["Ellenőrizd a tudásodat a **hangalak és jelentés** teljes fejezetéből! Ismételd át a H és J jelölést, az egyjelentésű és többjelentésű, az azonos alakú és hasonló alakú, a rokon értelmű és ellentétes jelentésű szavakat, valamint a hangutánzó és hangulatfestő szavakat és a jelentésmezőt. A többjelentésű szavaknál van jelentésbeli kapcsolat, az azonos alakúaknál nincs. A hasonló alakú szavaknál különböztesd meg az alakváltozatokat és az eltérő jelentésű alakpárokat. A szinonimák kiválasztásakor figyelj a mondat jelentésére és stílusára. A tudáspróba végén nézd meg, melyik témakört hegedű","hangszer","fúvóka"],["Melyik kapcsolódik az úszáshoz mint eszköz?","úszószemüveg","síbot","vonó"],["Melyik szó a hó szóból alkotott összetett szó?","hólapát","havas","hóban"],["Melyik szó a fény képzett alakja?","fényes","fénysugár","fényben"],["Mi a jelentésmező?","Jelentésük szerint logikailag kapcsolódó szavak köre.","Azonos betűszámú szavak köre.","Csak ellentétes jelentésű szavak köre."]]],[["A **kommunikáció** során üzenetet adunk át. A feladó küldi, a címzett fogadja az üzenetet. Nyelvi jelekkel (szavakkal) és nem nyelvi jelekkel (mozdulatokkal, arckifejezéssel) is kommunikálhatunk. A **helyesírás négy alapelve**: kiejtés, szóelemzés, hagyomány és egyszerűsítés. A magyar ábécé többjegyű betűit egy betűként kezeljük. A **magánhangzókat** a nyelv vízszintes helyzete szerint magas és mély, időtartamuk szerint rövid és hosszú magánhangzókra osztjuk. A szavak hangrendjét a bennük lévő magánhangzók határozzák meg. A toldalékok illeszkedésében szerepet játszik a hangrend. A mássalhangzók találkozásakor hasonulás, összeolvadás, rövidülés, kiesés vagy nyúlás történhet. A szabályokat a szóalakok és a kiejtés összehasonlításával idézd fel.","A **feladó** küldi, a **címzett** fogadja az üzenetet. A helyesírásban figyelj a hosszú hangokra, a j és ly betűkre és a szóelemekre. A magánhangzók lehetnek magasak vagy mélyek. A toldalékok illeszkednek a szóhoz: kertben, házban. A mássalhangzók kiejtéskor megváltozhatnak.","Az üzenetet valaki küldi, valaki fogadja. Figyelj a helyesírásra: gólya, meggy. Magas hang: e, i, ü. Mély hang: a, o, u. Kertben, házban: így helyes."],"Dóri integet Bencének. Nem nyelvi jelzést használ. A kertben szóban a -ben illeszkedik a magas hangrendhez.",[["Dóri üzenetet küld Bencének. Ki a feladó?","Dóri","Bence","Mindketten"],["Mi a beszélgetés csatornája telefonhíváskor?","A telefonkapcsolat","A beszélgetés témája","A beszélgetőpartner"],["A társad integet. Milyen jelzést használ?","Nem nyelvi jelet","Írott nyelvi jelet","Beszélt nyelvi jele
