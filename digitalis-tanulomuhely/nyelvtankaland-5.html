x-shadow:0 2px 0 #176e6520}progress{height:18px}body.sni .lesson-art{max-width:420px}body.sni button{min-height:56px} @media(max-width:500px){.lesson-art{margin:8px 0}.animal-scene{font-size:42px}}.study-note{background:#f3f9ff;border-left:5px solid #168477;border-radius:12px;padding:12px 18px}.study-note p{margin:8px 0}.study-note strong{color:#000;font-weight:800}</style><header class="hero"><h1>🧭 NyelvtanKaland 5.</h1><p>Fedezd fel a magyar nyelvet!</p><a style="color:white" href="./">← Digitális Tanulóműhely</a></header><label>Tanulási mód <select id="mode"><option value="normal">Normál</option><option value="btmn">BTMN – támogatott</option><option value="sni">SNI – segített</option></select></label><main id="root"></main><script>const topics=["Tanulni tanulunk","A jelek világa","Az emberi kommunikáció fogalma, tényezői és célja","A kommunikáció nem nyelvi jelei","A kommunikációs kapcsolat","Beszélgetés, telefonálás, témaválasztás","Kommunikáció szóban és írásban","Ellenőrizd a tudásodat!","A magyar helyesírás jellemzői","Az írás kialakulása","A magyar ábécé és a betűrend","Szótagolás és elválasztás","A levél és a keltezés","A kiejtés szerinti írásmód","Szövegszerkesztés","Szóelemző írásmód","A hagyomány szerinti és az egyszerűsítő írásmód","Nyelvhelyesség, szövegalkotás/szövegértés","Összefoglalás","Szólások, közmondások, szállóigék","Könyvtárhasználat","Gyakoroljunk!","Az elbeszélés","A leírás","Összefoglalás","A nyelvi szintek","Hangképzés, fonéma","A magánhangzók","Magánhangzótörvények","Mássalhangzók","Szövegértés, szövegalkotás","Mássalhangzók hangkapcsolódási szabályszerűségei I.","Mássalhangzók hangkapcsolódási szabályszerűségei II.","Mássalhangzók hangkapcsolódási szabályszerűségei III.","Részösszefoglalás I.","Részösszefoglalás II.","A szavak szerkezete","A toldalékok: a képzők","A toldalékok: a jelek és a ragok","Összefoglalás","Hangalak és jelentés","Egyjelentésű és többjelentésű szavak","Az azonos alakú és hasonló alakú szavak","A rokon értelmű és ellentétes jelentésű szavak","Hangutánzó és hangulatfestő szavak","Jelentésmező","Szövegalkotás és összefoglalás","Ellenőrizd a tudásodat!","Összefoglalás – rendszerezés I.","Összefoglalás – rendszerezés II."],lessons=[[["A **lényegkiemelés** a fontos információk kiválasztása. A **rendszerezés** az összetartozó ismeretek csoportosítása. A **felidézés** során emlékezetből mondjuk el a tanultakat. Az **ismétlés** segít megjegyezni a tananyagot.","Keresd meg a **lényeget**! Csoportosítsd az ismereteket! Mondd el emlékezetből! Ismételj!","Olvass! Keresd meg a **fontos szavakat**! Mondd el, mire emlékszel!"],"A sün éjszaka keresi a táplálékát. Rovarokat és más apró állatokat eszik. Veszély esetén összegömbölyödik. Tegnap egy sünről szóló képet láttam egy füzetben. Ha a sün életmódjáról tanulsz, az első három mondat a lényeges.",[["Mi segít a figyelemben?","Csendes környezet","Folyamatos üzenetváltás","Hangos videó"],["Mi a lényegkiemelés?","A fontos információk kiválasztása","Minden szó lemásolása","A cím kihagyása"],["Mit jelent a felidézés?","Emlékezetből elmondom a tanultakat","Új könyvet veszek","Elrakom a füzetet"],["Mi segíti a rendszerezést?","Gondolattérkép","Véletlen firkálás","A jegyzet eldobása"],["Mi segíti a tartós tudást?","Ismétlés és önellenőrzés","A lecke kihagyása","Csak a cím olvasása"]]],[["A **jel** információt hordoz. A **természetes jel** emberi beavatkozás nélkül keletkezik. A **mesterséges jelet** az ember alkotja. A jelek rendszert alkothatnak.","A **jel** üzen valamit. A füst természetes jel. A STOP tábla mesterséges jel.","A **jel** üzen valamit. A füst tüzet jelezhet. A piros lámpa megállásra int."],"Sötét felhő: eső közeledhet. Piros közlekedési lámpa: meg kell állni.",[["Melyik természetes jel?","Sötét felhő","STOP tábla","Százalékjel"],["Melyik mesterséges jel?","Közlekedési lámpa","Füst","Láz"],["Mit jelez a piros közlekedési lámpa?","Meg kell állni","Szabad az út","Esik a hó"],["Melyik jelrendszer?","A közlekedési táblák rendszere","Egy kavics","Egy pohár víz"],["Miért tanuljuk meg a mesterséges jeleket?","Hogy értsük jelentésüket","Hogy eltűnjenek","Hogy ne használjuk őket"],["Miért kell ismernünk a közlekedési táblák jelentését?","A jelek közös értelmezése teszi lehetővé a tájékozódást.","Minden tábla természetes jel.","A táblák csak díszítenek."],["Melyik párban van előbb természetes, majd mesterséges jel?","Láz – iskolai csengő","STOP tábla – láz","Állatnyom – viharfelhő"]]],[["A **kommunikáció** információcsere. A **feladó** küldi az üzenetet. A **címzett** fogadja. A **kód** a használt jelrendszer. A **csatorna** közvetíti az üzenetet. A **beszédhelyzet** a közlés körülményeit jelenti. A **zaj** zavarhatja a megértést. A közlés célja lehet tájékoztatás, kérdés, kérés, utasítás, érzelemkifejezés vagy kapcsolattartás.","A **feladó** üzenetet küld. A **címzett** megkapja. A **csatorna** közvetíti. A **zaj** zavarhatja a megértést.","A **feladó** üzen. A **címzett** megkapja az üzenetet."],"Anna telefonon megkérdezi Petitől, mikor ér haza. Anna a feladó, Peti a címzett, a telefon a csatorna.",[["Ki küldi az üzenetet?","Feladó","Címzett","Zaj"],["Ki kapja az üzenetet?","Címzett","Feladó","Csatorna"],["Mi zavarhatja a megértést?","Zaj","Köszönés","Válasz"],["Mi a célja: Hány óra van?","Kérdés","Utasítás","Érzelemkifejezés"],["Mi a célja: Csukd be az ajtót!","Utasítás","Tájékoztatás","Köszönés"],["Mi lehet csatorna?","Telefon","A feladó neve","Az üzenet célja"],["Éva telefonon kérdezi meg Bencétől az indulás idejét. Mi a csatorna?","Telefonos hangkapcsolat","Az indulás ideje","A magyar nyelv"],["Két ember nem érti egymás nyelvét. Melyik tényező okozza a nehézséget?","A közös kód hiánya","A címzett hiánya","A feladó hiánya"]]],[["A **nem nyelvi jelek** szavak nélkül is üzennek. A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A tekintet és a testtartás is jelezhet. A térköz, a hangerő, a hangsúly és a beszédtempó is fontos. Az állatok is kommunikálnak.","A **mimika** az arcjáték. A **gesztus** például kézmozdulat. A hangunk is üzen.","A **mosoly** és az **integetés** is üzenhet."],"Ha búcsúzáskor integetsz, a kézmozdulatod helyettesítheti az elköszönést.",[["Melyik nem nyelvi jel?","Integetés","Leírt mondat","Kimondott szó"],["Mi a mimika?","Arcjáték","Levélírás","Telefon"],["Mi a gesztus?","Például kézmozdulat","Betű","Mondat"],["Mivel jelezhet a kutya?","Testtartással","Írott levéllel","Fogalmazással"],["Mi változhat a hangunkban?","Hangerő","Betűrend","Helyesírás"],["Mit jelenthet a mosoly?","Örömöt","Mindig haragot","Mindig félelmet"],["Valaki mosolyogva mondja: „Nagyon örülök!” Hogyan kapcsolódik a mimika a szavakhoz?","Megerősíti a közlés tartalmát.","Megszünteti a közlést.","Mindig ellentmond neki."],["Miért lehet félreérthető egy gesztus?","Jelentése helyzettől és kultúrától is függhet.","Mindenhol pontosan ugyanazt jelenti.","A gesztus mindig írásbeli."]]],[["A kapcsolattartás három szakasza a **kapcsolatfelvétel**, a **fenntartás** és a **lezárás**. Köszönéssel kezdünk. Beszélgetünk. Végül elköszönünk. A helyzethez illő megszólítást használunk. Udvariasan kérünk és érdeklődünk.","**Köszönünk**, beszélgetünk, majd elköszönünk. Ismeretlen embernek bemutatkozunk. Udvariasan kérünk.","**Köszönj!** Kérj szépen! Köszönd meg! Köszönj el!"],"A könyvtárban: Jó napot kívánok! Hol találom a mesekönyveket? Köszönöm szépen!",[["Hogyan köszönsz egy ismeretlen felnőttnek?","Jó napot kívánok!","Cső!","Hé!"],["Melyik udvarias kérés?","Kérlek, add ide a füzetet!","Ide vele!","Azonnal add!"],["Mi zárja le a beszélgetést?","Elköszönés","Bemutatkozás","Megszólítás"],["Mit mondasz bemutatkozáskor?","A nevemet","A jelszavamat","Semmit"],["Mit jelent a tudakozódás?","Információt kérünk","Elalszunk","Elrejtünk valamit"],["Mit mondasz, ha segítettek?","Köszönöm!","Mindegy!","Hagyjál!"],["Valaki eléd áll a sorban. Melyik válasz határozott és udvarias?","Elnézést, én már itt álltam. Kérlek, állj mögém!","Tűnj innen!","Nem szólok, de meglököm."],["Miért változhat a megszólítás a beszédhelyzettől függően?","A résztvevők viszonya és a helyzet befolyásolja.","Mindenkit ugyanúgy kell megszólítani.","Csak a mondat hossza számít."]]],[["A beszédstílust a helyzethez igazítjuk. A **szleng** egyes csoportokra jellemző nyelvhasználat. Telefonáláskor köszönünk. Szükség esetén bemutatkozunk. Elmondjuk a hívás célját. Végül elköszönünk. Fogalmazáshoz ismert, érdekes témát választunk.","Baráttal másképp beszélünk, mint hivatalos helyen. Telefonáláskor **köszönj**, mutatkozz be, és mondd el a célodat. Ismert témáról írj!","**Köszönj!** Mondd meg a neved! Mondd el, mit szeretnél!"],"Jó napot kívánok! Kiss Anna vagyok. A könyvtár nyitvatartásáról érdeklődöm.",[["Mit teszel ismeretlen ember felhívásakor?","Köszönök és bemutatkozom","Azonnal követelőzöm","Leteszem"],["Melyik köznyelvi megfelelője a király szlengszónak ebben: Ez király!?","Nagyon jó","Uralkodó","Korona"],["Milyen témát válassz fogalmazáshoz?","Amelyet ismerek","Amelyről semmit sem tudok","Véletlenszerűt"],["Mit teszel téves híváskor?","Elnézést kérek","Kiabálok","Sértegetek"],["Mi illik hivatalos beszélgetésbe?","Udvarias köznyelv","Bántó szleng","Gúnyolódás"],["Mit kérdezhetsz elfoglalt ember telefonos hívásakor?","Alkalmas most a beszélgetés?","Miért nem figyelsz?","Miért dolgozol?"],["Melyik a hivatalos telefonhívás helyes sorrendje?","Köszönés – bemutatkozás – a hívás célja – elköszönés","Bemutatkozás – elköszönés – kérdés – köszönés","Kérdés – elköszönés – bemutatkozás – köszönés"],["Miért érdemes egy komoly vitát gyakran személyesen rendezni?","A közvetlen visszajelzések segíthetnek a félreértések tisztázásában.","Telefonon tilos véleményt mondani.","Személyesen nem lehet félreértés."]]],[["A nyelvi kommunikáció lehet **szóbeli** vagy **írásbeli**. Lehet közvetlen vagy közvetett. A **kétirányú** közlésben a felek válaszolhatnak egymásnak. Az **egyirányú** közlésben nincs közvetlen válasz. A szöveget a célhoz és a címzetthez igazítjuk.","Beszélhetünk vagy írhatunk. A **párbeszéd** kétirányú. A rádióadás rendszerint egyirányú.","**Beszélhetsz** vagy **írhatsz**. Beszélgetéskor mindketten válaszolhattok."],"A barátoddal beszélgetsz: kétirányú kommunikáció. Egy rádióhírt hallgatsz: rendszerint egyirányú.",[["Melyik írásbeli kommunikáció?","E-mail","Szóbeli felelet","Telefonbeszélgetés"],["Melyik kétirányú?","Párbeszéd","Rádióhír hallgatása","Plakát olvasása"],["Melyik közvetlen?","Személyes beszélgetés","Levélváltás","Rádióadás"],["Mi a plakát célja egy iskolai vásárról?","Tájékoztatás és felhívás","Elhallgatás","Titkosítás"],["A levelezés nyelvi kommunikáció?","Igen","Nem","Csak ha hangos"],["Melyik fejez ki érzelmet?","De örülök!","Hány óra van?","Csukd be az ajtót!"],["Miért fontos pontosan fogalmazni írásban?","Az olvasó gyakran nem tud azonnal visszakérdezni, és nem hallja a hangsúlyt.","Írásban minden mondat kérdés.","Az írásban nincs jelentés."],["Melyik helyzetben változik a feladó és a címzett szerepe?","Két diák egymás kérdéseire válaszol.","Egy diák egy régi plakátot olvas.","Egy diák felvett híradást hallgat."]]],[["Ismételd át a **jeleket**! Idézd fel a **kommunikáció tényezőit** és céljait! Gondolj a nem nyelvi jelekre! Ismételd át az udvarias kapcsolattartást!","Emlékezz a **feladóra**, a címzettre, az üzenetre és a csatornára! Ismételd át az udvarias beszédet!","**Ki üzen?** Kinek? Mit? Hogyan?"],"Bence üzenetet küld Évának: Bence a feladó, Éva a címzett.",[["Mi a kommunikáció?","Információcsere","Betűrend","Szótagolás"],["Mi a kód?","A használt jelrendszer","A zaj","A címzett"],["Melyik természetes jel?","Füst","STOP tábla","Százalékjel"],["Mi zavarja a közlést?","Zaj","Megértés","Udvarias válasz"],["Melyik nem nyelvi jel?","Bólintás","Levél","Kimondott mondat"],["Melyik a kapcsolatfelvétel példája?","Köszönés","Elköszönés","Alvás"],["Melyik kétirányú közlés?","Telefonbeszélgetés","Plakát","Rádióhír"],["Mi segíti a megértést?","Közös jelrendszer","Ismeretlen kód","Erős zaj"]]],[["A magyar helyesírás **betűíró**. Hangokat jelölő betűkkel írunk. Írásunk **latin betűs**. Helyesírásunk **hangjelölő**. A betűk többnyire a kiejtett hangokat jelölik. Helyesírásunk **értelemtükröző**. Az írás a jelentést is megmutatja. A **beszédhangot** kimondjuk és halljuk. A **betű** a beszédhang írott jele. A betűk összessége az **ábécé**. Az **írásjegy** a betű alkotóeleme. A cs kétjegyű, a dzs háromjegyű betű. Az **írásjelek** tagolják a szöveget. Az ékezetek a magánhangzók jelölésében segítenek. A helyesírást olvasással, gyakorlással és szabályok alkalmazásával tanuljuk. Ha bizonytalan vagy, használj **helyesírási szótárt**.","Írásunk **betűíró**, **latin betűs**, **hangjelölő** és **értelemtükröző**. A hangot halljuk. A betűt látjuk. A betűk összessége az **ábécé**. A cs két írásjegyből áll. A dzs három írásjegyből áll. A pont és a kérdőjel **írásjel**. Gyakorolj! Ha bizonytalan vagy, nézz utána a helyesírási szótárban.","A **hangot** halljuk. A **betűt** látjuk. Betűkkel írunk. Latin betűket használunk. Írásunk hangokat és jelentést is jelöl. A cs egy betű, két írásjeggyel. A dzs egy betű, három írásjeggyel. A pont **írásjel**. A betűk együtt alkotják az **ábécét**."],"A „kisfiú” gyermeket jelent. A „kis fiú” kis termetű fiúra utal. A „cs” egy betű, de két írásjegyből áll. A „Hová mész?” végén kérdőjel áll.",[["Mit hallunk?","Beszédhangot","Betűt","Írásjelet"],["Mit látunk a leírt szóban?","Betűket","Beszédhangokat","Hanghullámokat"],["Mi a betűk összessége?","Ábécé","Mondat","Szótár"],["Milyen betűkészletből alakult ki a magyar ábécé?","Latin","Cirill","Görög"],["Miért betűíró a magyar írás?","Hangokat jelölő betűkkel írunk.","Csak képekkel írunk.","Minden szóhoz külön rajz tartozik."],["Mit jelent a hangjelölő jelleg?","A betűk többnyire a kiejtett hangokat jelölik.","A betűk mindig egész mondatokat jelölnek.","A betűk csak számokat jelölnek."],["Mit mutat az értelemtükröző írás?","A jelentést is.","Csak a betűk színét.","Csak a hangerőt."],["Hány írásjegyből áll a cs?","Kettőből","Egyből","Háromból a. A hosszú sz elválasztva: hosz-szú. Az összetett szó határán is elválasztunk: vas-út.","Tapsolj minden **szótagra**! Ci-ca: két szótag. Al-ma: két szótag. Ba-nán: két szótag. A ny együtt marad: a-nya."],"alma → al-ma; banán → ba-nán; hosszú → hosz-szú; vasút → vas-út.",[["Hogyan választjuk el a hosszú szót?","hosz-szú","hoss-zú","ho-sszú"],["Melyik a helyes elválasztás az összetételi határon?","vas-út","va-sút","v-asút"],["Melyik helyes?","a-nya","an-ya","any-a"],["Melyik helyes?","Szé-che-nyi","Széc-he-nyi","Széch-enyi"],["Hány szótagú a rádió?","Három","Kettő","Négy"]]],[["A **levél** megszólítással kezdődik. A levél tartalmát bekezdésekre tagoljuk. A megszólítás illeszkedik a címzetthez. A végén levélzáró fordulat, elköszönés és aláírás áll. A **keltezés** megadja a helyet és az időt. A dátumban az év és a nap után pont áll. A hónap kiírható, rövidíthető vagy számmal jelölhető. Névutó előtt és birtokviszonyban az évszám után nincs pont. A toldalékot kötőjellel kapcsoljuk: 2026-ban, május 5-én. Az utóirat jele: Ui.","A **levél** részei: megszólítás, tartalom, elköszönés, aláírás, keltezés. A dátumban az év és a nap után pont áll. A hónapot kiírhatjuk. Toldalék előtt kötőjelet írunk: 2026-ban.","A levelet **megszólítással** kezdjük. A végén elköszönünk és aláírjuk. A **dátum** megmutatja, mikor írtuk."],"Kedves Bence! Szombaton kirándulni megyünk. Szeretettel: Anna. Kelt: Szeged, 2026. május 5.",[["Melyik a helyes dátum?","2026. május 5.","2026 május 5","2026. május. 5."],["Melyik helyes?","2026-ban","2026.-ban","2026ban"],["Melyik helyes?","május 5-én","május 5.-én","május 5én"],["Melyik helyes?","2026 óta","2026. óta","2026-óta"],["Melyik helyes?","2026 telén","2026. telén","2026-telén"],["Melyik a hónap római számos jelölése?","2026. V. 5.","2026 V 5","2026. V 5"],["Mi az Ui. jelentése?","Utóirat","Új időpont","Üdvözlet"],["Melyik illik hivatalos levélbe?","Tisztelt Igazgató Úr!","Csá, haver!","Hé!"],["Miért tagoljuk a levelet?","Hogy könnyebb legyen követni a gondolatokat.","Hogy hosszabbnak tűnjön.","Hogy ne lehessen elolvasni."]]],[["A **kiejtés elve** szerint a helyes kiejtést követjük az írásban. A főnevek végén az ó és ő hosszú. A melléknevek végén az ú és ű hosszú: hosszú, gyönyörű. A főnevek végén az ú és ű általában hosszú, de vannak kivételek: kapu, falu, áru, eskü, menü. A szóvégi i általában rövid: kicsi. Kivételek: sí, rí, gyí. Az alakőrző szavak megtartják hosszú magánhangzójukat: szív, szíves. Az alakváltoztató szavak egyes toldalékok előtt rövidülnek: víz, vizet. Az a és e gyakran megnyúlik toldalék előtt: alma, almát. A hang hosszúsága jelentést is változtathat: hal, hall.","A **kiejtés elve** szerint a helyes kiejtést követjük. A hajó és az erdő végén hosszú a magánhangzó. A hosszú és a gyönyörű végén is hosszú. Kivételek: falu, kapu, menü. Figyeld a szó változását: víz – vizet, szív – szíves. A hal és a hall mást jelent.","Figyeld a **rövid és hosszú hangokat**! Hajó, erdő: hosszú a szó vége. Kapu, falu: rövid u. A hal állat. A hall azt jelenti, hogy érzékeli a hangot."],"A hal a vízben úszik. Anna zenét hall. A víz hideg. Vizet iszom.",[["Melyik helyes?","gyönyörű","gyönyörü","gyönyörú"],["Melyik helyes?","savanyúság","savanyuság","savanyússág"],["Melyik kivétel a szóvégi hosszú ú szabálya alól?","kapu","borjú","tanú"],["Melyik helyes?","hegedül","hegedűl","hegedüll"],["Melyik helyes?","vizet","vízet","vizzet"],["Melyik alak őrzi a hosszú magánhangzót?","szíves","vizes","tüzes"],["Melyik helyes?","dicsér","dícsér","dicsérr"],["Melyik illik ide: A madár a levegőben ...?","száll","szál","szálll"],["Melyik helyes?","huszonegy","húszonegy","huszonnegy"],["Melyik helyes?","almát","almat","allmát"]]],[["A **szövegszerkesztés** a mondanivaló megtervezése és elrendezése. Először válassz témát, célt és gondolj az olvasóra. Az **anyaggyűjtés** során olvass, figyelj meg, kérdezz és jegyzetelj. Ellenőrizd a források hitelességét. Jegyezd fel a szerzőt, címet, kiadót, évet és oldalszámot. A **gondolattérkép** össz
